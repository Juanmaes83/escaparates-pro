<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banderolas Studio PRO · Escaparates Pro</title>
<link rel="stylesheet" href="css/advanced-tool-host.css">
<style>
.band-content-grid{display:grid;gap:8px}.band-content-grid textarea{min-height:76px;resize:vertical}.band-output-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.band-status{font-size:10px;color:var(--dim);line-height:1.4;margin-top:7px}.band-media-preview{display:none;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;margin-top:8px;padding:6px;border:1px solid var(--line);border-radius:8px}.band-media-preview.on{display:grid}.band-media-preview img,.band-media-preview video{width:42px;height:42px;object-fit:cover;border-radius:6px}.band-field{display:grid;gap:5px;margin-bottom:10px}.band-field label{display:flex;justify-content:space-between;font-size:10px;color:#bbb}.band-field input,.band-field textarea,.band-field select{width:100%;background:#080808;color:#fff;border:1px solid #303030;border-radius:7px;padding:7px}.band-clean .at-side,.band-clean .at-stagebar{display:none}.band-clean .at-app{display:block}.band-clean .at-stage{height:100vh;display:block}.band-clean .at-canvas{height:100vh;padding:0}.band-clean .at-frame-shell{border:0!important;border-radius:0!important}
</style>
</head>
<body>
<div class="at-app">
  <aside class="at-side">
    <header class="at-head"><div class="at-kicker">ESCAPARATES PRO · ADVANCED TOOL</div><h1>Banderolas Studio PRO</h1><div style="display:flex;gap:8px;align-items:center"><span class="at-badge">TYPE B · RUBIK SOTA</span><span class="at-status" id="band-status">Inicializando…</span></div><input id="band-project-name" value="Banderolas Project" aria-label="Nombre del proyecto" style="margin-top:10px;width:100%;background:#080808;color:#fff;border:1px solid #303030;border-radius:8px;padding:8px"></header>
    <div class="at-toolbar"><button class="at-btn primary" id="band-save">Guardar</button><button class="at-btn" id="band-load">Restaurar</button><button class="at-btn" id="band-version">Crear versión</button><button class="at-btn" id="band-original">Original</button></div>
    <div class="at-scroll">
      <section class="at-section at-priority-section"><button type="button">MEDIA · IMAGEN / VÍDEO</button><div class="at-body"><div class="band-output-grid"><button class="at-btn primary" id="band-upload">Subir imagen / vídeo</button><button class="at-btn" id="band-remove">Eliminar media</button></div><input id="band-file" type="file" accept="image/*,video/*" hidden><div id="band-media-preview" class="band-media-preview"><div id="band-thumb"></div><div class="at-media-name" id="band-media-name"></div><span class="at-badge" id="band-media-kind">MEDIA</span></div></div></section>

      <section class="at-section"><button type="button">CONTENIDO</button><div class="at-body band-content-grid">
        <div class="band-field"><label>Título</label><input id="band-title" value="L.A.P.D. EVIDENCE"></div>
        <div class="band-field"><label>Case / Referencia</label><input id="band-case" value="Case: #884-Black Dahlia"></div>
        <div class="band-field"><label>Fecha</label><input id="band-date" value="Oct 14, 1947"></div>
        <div class="band-field"><label>Contenido / Nota</label><textarea id="band-content">&quot;Meet me at the pier.&#10;Bring the files.&quot;</textarea></div>
        <div class="band-field"><label>Firma</label><input id="band-signature" value="- V."></div>
      </div></section>

      <section class="at-section"><button type="button">MEDIA · SIZE / POSITION</button><div class="at-body">
        <div class="band-field"><label>Size <span class="at-value" id="band-scale-v">1.00x</span></label><input id="band-scale" type="range" min="0.5" max="2.5" step="0.05" value="1"></div>
        <div class="band-field"><label>X <span class="at-value" id="band-x-v">0</span></label><input id="band-x" type="range" min="-300" max="300" step="5" value="0"></div>
        <div class="band-field"><label>Y <span class="at-value" id="band-y-v">0</span></label><input id="band-y" type="range" min="-300" max="300" step="5" value="0"></div>
        <button class="at-btn" id="band-reset-media" style="width:100%">Reset media</button>
        <div class="band-status">Escala y recoloca el asset dentro de la tela sin modificar shaders ni física Verlet/cloth.</div>
      </div></section>

      <section class="at-section at-priority-section"><button type="button">GUARDAR / GRABAR / EXPORTAR</button><div class="at-body">
        <div class="band-field"><label>Recording FPS</label><select id="band-fps"><option value="30">30 FPS</option><option value="60">60 FPS</option></select></div>
        <div class="band-output-grid"><button class="at-btn" id="band-png">Exportar PNG</button><button class="at-btn primary" id="band-record">Grabar WEBM</button><button class="at-btn" id="band-html">Standalone HTML</button><button class="at-btn" id="band-json">Project JSON</button><button class="at-btn" id="band-embed">Copiar Embed</button><button class="at-btn" id="band-preview-clean">Preview Clean</button></div>
      </div></section>
    </div>
  </aside>
  <main class="at-stage"><header class="at-stagebar"><strong>VISTA PREVIA EN DIRECTO · CLOTH ENGINE PRESERVADO</strong><div class="at-stage-actions"><button class="at-btn" id="band-fullscreen">Pantalla completa</button></div></header><div class="at-canvas"><div class="at-frame-shell" id="band-shell"><iframe id="band-frame" title="Banderolas Studio PRO"></iframe><div class="at-loading" id="band-loading"><div class="at-loading-card"><span class="at-dot"></span>Cargando motor canónico…</div></div></div></div></main>
</div><div class="at-toast" id="at-toast"></div>
<script>window.EP=window.EP||{};</script>
<script src="js/customization/project-store-local.js"></script>
<script src="js/projects/project-versioning.js"></script>
<script src="js/advanced-tools/registry.js"></script>
<script src="js/advanced-tools/render-adapter.js"></script>
<script src="js/advanced-tools/project-adapter.js"></script>
<script src="js/advanced-tools/banderolas-host.js"></script>
</body></html>
