name: TEMP Wire V3 Fashion Pearl
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-wire-v3-fashion-pearl.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
          fetch-depth: 0
      - name: Protected baseline gate
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
      - name: Wire Pearl assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./v3-fashion-pearl-cinematic.css">'
          js='<script src="./v3-fashion-pearl-cinematic.js"></script>'
          if css not in s:
              marker='<link rel="stylesheet" href="./v3-fashion-art-direction.css">'
              assert s.count(marker)==1, f'CSS marker count={s.count(marker)}'
              s=s.replace(marker, marker+'\n'+css,1)
          if js not in s:
              marker='<script src="./v3-fashion-scene-system.js"></script>'
              assert s.count(marker)==1, f'JS marker count={s.count(marker)}'
              s=s.replace(marker, marker+'\n'+js,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-scene-system.js
          node --check labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-cinematic.js
          test "$(grep -c 'v3-fashion-pearl-cinematic.css' labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html)" -eq 1
          test "$(grep -c 'v3-fashion-pearl-cinematic.js' labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html)" -eq 1
      - name: Commit exact allowlist and self-remove
        run: |
          rm .github/workflows/tmp-wire-v3-fashion-pearl.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html .github/workflows/tmp-wire-v3-fashion-pearl.yml
          git diff --cached --name-only | sort >/tmp/changed
          printf '%s\n' '.github/workflows/tmp-wire-v3-fashion-pearl.yml' 'labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html' | sort >/tmp/allowed
          diff -u /tmp/allowed /tmp/changed
          git commit -m 'feat(v3-fashion): wire Pearl cinematic scene layer'
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
