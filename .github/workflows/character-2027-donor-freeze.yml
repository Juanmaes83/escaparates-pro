name: Character 2027 exact donor freeze

on:
  push:
    branches:
      - chatgpt/museum-character-2027-integration-v1
    paths:
      - .github/workflows/character-2027-donor-freeze.yml

permissions:
  contents: write

jobs:
  freeze-characterstudio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Museum surgery branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/museum-character-2027-integration-v1
          fetch-depth: 0

      - name: Fetch exact CharacterStudio donor
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Juanmaes83/CharacterStudio.git /tmp/CharacterStudio
          git -C /tmp/CharacterStudio checkout --quiet f5a93a48ed0e3904fce58f08f7fbe08b5411b289
          test "$(git -C /tmp/CharacterStudio rev-parse HEAD)" = "f5a93a48ed0e3904fce58f08f7fbe08b5411b289"

      - name: Copy approved stones preserving original structure
        run: |
          set -euo pipefail
          SRC=/tmp/CharacterStudio
          DST=labs/immersive-worlds/donors-frozen/character-2027/characterstudio
          files=(
            src/character2027/api/CharacterActionAPI.js
            src/character2027/animation/MotionController.js
            src/character2027/animation/MotionFoundationV2.js
            src/character2027/animation/MotionFoundationV2Extra.js
            src/character2027/animation/SocialMotionFoundationV3.js
            src/character2027/animation/Retargeter.js
            src/character2027/rig/BoneMap.js
            src/character2027/interaction/LookAtController.js
            src/character2027/ik/ContactIKController.js
            src/character2027/ik/DonorTwoBoneIK.js
            src/character2027/ik/HumanoidIKController.js
            src/character2027/ik/LadderIKExtension.js
            src/character2027/ik/TerrainSemanticIK.js
            src/pages/Create.jsx
            src/pages/Appearance.jsx
            src/pages/MotionLab.jsx
          )
          for f in "${files[@]}"; do
            mkdir -p "$DST/$(dirname "$f")"
            cp --preserve=mode,timestamps "$SRC/$f" "$DST/$f"
          done

      - name: Verify all 16 donor blob hashes exactly
        run: |
          set -euo pipefail
          SRC=/tmp/CharacterStudio
          DST=labs/immersive-worlds/donors-frozen/character-2027/characterstudio
          cat > /tmp/expected.tsv <<'EOF'
          src/character2027/api/CharacterActionAPI.js	1107f6015dd16274105d16a71e950729b678f667
          src/character2027/animation/MotionController.js	35a9182bd8cf378df6389fdc27f9fbd02a9b662b
          src/character2027/animation/MotionFoundationV2.js	3ffa2617b107c1bdf885befce8bfcd4e0bda067c
          src/character2027/animation/MotionFoundationV2Extra.js	f59c9e54fc4e4347f8a145e8e2b3e2a7bb57d848
          src/character2027/animation/SocialMotionFoundationV3.js	2490cc4e36e1464d237000caca457d5b73dd79ec
          src/character2027/animation/Retargeter.js	a32c471eb67f4d3dd33b694e5317532b0ec753ef
          src/character2027/rig/BoneMap.js	0c74181afaaa64e34e3b8c03cfb042fb7fb27e12
          src/character2027/interaction/LookAtController.js	c5cb4f75694f31a04dadf7236cafece91e77acba
          src/character2027/ik/ContactIKController.js	c4b0c14288f30d7d8178bc1dadc11a7f3c7d76ce
          src/character2027/ik/DonorTwoBoneIK.js	ea0e507a072d949bab8018b4ad27e7cc31392d26
          src/character2027/ik/HumanoidIKController.js	c4e103dc3f2dddf341f2654d15e3e8909d676856
          src/character2027/ik/LadderIKExtension.js	242fb865fcd61fe573c85c1de8467778ea1a9c97
          src/character2027/ik/TerrainSemanticIK.js	870d24744baae178acf0751d28d7e9b7d70d3560
          src/pages/Create.jsx	e70cf09eddd8c9c3df5c7d5c27fada75ed1b5979
          src/pages/Appearance.jsx	d1ec659da9f5702ca4a83483f3850675c30df949
          src/pages/MotionLab.jsx	8e1fff64f882cfd2eff6837e19e93b4dbad70515
          EOF
          count=0
          while IFS=$'\t' read -r path expected; do
            donor=$(git -C "$SRC" hash-object "$path")
            frozen=$(git hash-object "$DST/$path")
            echo "$path donor=$donor frozen=$frozen expected=$expected"
            test "$donor" = "$expected"
            test "$frozen" = "$expected"
            count=$((count+1))
          done < /tmp/expected.tsv
          test "$count" = "16"
          echo "CHARACTERSTUDIO_EXACT_FREEZE_PASS count=$count"

      - name: Commit exact CharacterStudio freeze and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/immersive-worlds/donors-frozen/character-2027/characterstudio
          git rm .github/workflows/character-2027-donor-freeze.yml
          git commit -m "chore(character): freeze exact CharacterStudio donor stones"
          git push origin HEAD:chatgpt/museum-character-2027-integration-v1
