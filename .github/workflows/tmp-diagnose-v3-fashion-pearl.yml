name: TEMP Diagnose V3 Fashion Pearl
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-diagnose-v3-fashion-pearl.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
          fetch-depth: 0
      - name: Print asset order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html').read_text(encoding='utf-8')
          print('STYLES',re.findall(r'<link[^>]+href=["\x27]([^"\x27]+)["\x27][^>]*>',s,re.I)[-12:])
          print('SCRIPTS',re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)["\x27][^>]*>',s,re.I)[-20:])
          print('PEARL_CSS_COUNT',s.count('v3-fashion-pearl-cinematic.css'))
          print('PEARL_JS_COUNT',s.count('v3-fashion-pearl-cinematic.js'))
          PY
      - name: Prepare Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          mkdir -p /tmp/q && cd /tmp/q
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect boot state
        run: |
          cd /tmp/q
          node <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1720,height:980}});
            const logs=[];
            p.on('pageerror',e=>{logs.push('PAGEERROR '+e.stack);console.log('PAGEERROR',e.stack)});
            p.on('console',m=>{logs.push('CONSOLE '+m.type()+' '+m.text());console.log('CONSOLE',m.type(),m.text())});
            await p.goto('http://127.0.0.1:4173/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForTimeout(7000);
            const state=await p.evaluate(()=>{
              const f=document.querySelector('.stage iframe');
              let inner={};try{inner={ready:f?.contentDocument?.readyState||null,hasApi:!!f?.contentWindow?.CasebookPro,keys:f?.contentWindow?.CasebookPro?Object.keys(f.contentWindow.CasebookPro):[],bodyText:f?.contentDocument?.body?.innerText?.slice(0,500)||''}}catch(e){inner={error:String(e)}}
              return {ready:document.readyState,body:[...document.body.classList],hasShell:!!document.querySelector('#esShell'),hasHost:!!window.__CasebookV3Host,hasV3:!!window.CasebookProV3,hasPearl:!!window.CasebookFashionPearl,hasDirector:!!window.CasebookPearlDirector,scripts:[...document.scripts].map(s=>s.src||'inline').slice(-15),inner};
            });
            console.log('BOOT_STATE='+JSON.stringify(state));
            fs.mkdirSync(process.env.GITHUB_WORKSPACE+'/qa-pearl-diag',{recursive:true});
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/qa-pearl-diag/state.json',JSON.stringify({state,logs},null,2));
            await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-pearl-diag/boot.png',fullPage:true});
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-fashion-pearl-boot-diagnostics
          path: qa-pearl-diag/
      - name: Self-remove
        if: always()
        run: |
          rm -f .github/workflows/tmp-diagnose-v3-fashion-pearl.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-diagnose-v3-fashion-pearl.yml
          git commit -m 'chore(ci): remove temporary Pearl boot diagnostics' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
