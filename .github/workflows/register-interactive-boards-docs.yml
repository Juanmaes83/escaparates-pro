name: Register Interactive Boards documentation

on:
  push:
    branches:
      - docs/register-interactive-boards-casebook-v1-1

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register validated Interactive Boards module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('README.md')
          text = root.read_text(encoding='utf-8')
          anchor = "Arquitectura: `EP.InteractiveBoards` registra los boards; `interactive-boards-ui.js` abre el workspace a ancho completo bajo la barra superior; cada board se ejecuta en iframe aislado para evitar conflictos con el Three.js global del modo Efectos. Website Modules conserva sus 31 módulos sin cambios."
          registry = """

          ### Registro oficial de Interactive Boards

          | # | Módulo | Versión | Estado | Ruta canónica | SHA-256 |
          | ---: | --- | --- | --- | --- | --- |
          | 1 | **Casebook PRO — Creative Campaign Board** | V1.1 | **VALIDADO EN PLATAFORMA** | `labs/interactive-boards-source/casebook-pro-v1-1/` | `96d5da228695c4b0d669e45251469608d4f8676e4c27a462654f6724fd780e63` |

          Registro de integración: PR **#33**, merge commit `89dc455271cf1cc4f537114f31ed73cf80d19ec0`, GitHub Pages y Vercel desplegados correctamente y validación visual/funcional integrada confirmada tras el deploy. La familia tiene actualmente **1 Interactive Board validado**.

          Regla documental: todo Interactive Board nuevo o nueva versión validada debe quedar registrado en este README raíz, en `labs/interactive-boards-source/README.md` y en el README específico de su módulo antes de iniciar la siguiente evolución.
          """.rstrip()
          if '### Registro oficial de Interactive Boards' not in text:
              if anchor not in text:
                  raise SystemExit('No se encontró el ancla de Interactive Boards en README.md')
              text = text.replace(anchor, anchor + registry, 1)
              root.write_text(text, encoding='utf-8')

          category = Path('labs/interactive-boards-source/README.md')
          category.parent.mkdir(parents=True, exist_ok=True)
          category.write_text("""# Interactive Boards — Registry

Familia de primer nivel de **Escaparates Pro** para workspaces visuales conectados, presentaciones espaciales y sistemas interactivos de organización/narrativa. Los Interactive Boards se ejecutan aislados del motor general de Efectos y de Website Modules para preservar su runtime, estado y pipeline de exportación.

## Módulos validados

| # | Módulo | Versión | Estado | Ruta | SHA-256 |
| ---: | --- | --- | --- | --- | --- |
| 1 | **Casebook PRO — Creative Campaign Board** | V1.1 | **VALIDADO EN PLATAFORMA** | `casebook-pro-v1-1/` | `96d5da228695c4b0d669e45251469608d4f8676e4c27a462654f6724fd780e63` |

## Casebook PRO V1.1

Primer board de la categoría. Incluye cinco demos completas — Detective / Investigation, Campaign 360, Fashion Campaign, Project / Tasks y Strategy / Presentation —, tarjetas multimedia, board/background multimedia, conexiones físicas y semánticas, timeline, Graph View, lasso, minimapa, JSON Import/Export y entregables HTML, ZIP, Embed, Preview, PNG y Review Recording.

- Module ID: `casebook-pro-v1-1`
- Registry JS: `js/interactive-boards-casebook-pro-v1-1.js`
- UI family controller: `js/interactive-boards-ui.js`
- Fuente canónica: `casebook-pro-v1-1/index.html`
- Preservación: `casebook-pro-v1-1/source.v1.1.html.gz`
- PR de integración: `#33`
- Merge commit: `89dc455271cf1cc4f537114f31ed73cf80d19ec0`
- Deploy GitHub Pages: validado
- Deploy Vercel: validado
- Validación visual/funcional integrada: confirmada tras el deploy

## Regla de registro

Cuando un Interactive Board o una versión nueva haya superado la validación standalone y la validación integrada en Escaparates Pro, debe registrarse en tres niveles:

1. `README.md` raíz — inventario y estado global.
2. `labs/interactive-boards-source/README.md` — catálogo oficial de la familia.
3. README del módulo — arquitectura, capacidades, fuente canónica, hash, PR/commit y estado de validación.

No se considera cerrada una entrega si el módulo está desplegado pero falta alguno de estos registros.

## Evolución

Las versiones aprobadas son inmutables: una ampliación avanzada entra como versión nueva y no modifica silenciosamente el HTML canónico anterior. Casebook PRO V1.1 queda congelado como baseline validado para futuras V2/V3.
""", encoding='utf-8')

          module = Path('labs/interactive-boards-source/casebook-pro-v1-1/README.md')
          m = module.read_text(encoding='utf-8')
          validation = """

          ## Registro de validación en plataforma

          - Estado: **APROBADO / VALIDADO EN PLATAFORMA**.
          - PR de integración: **#33** — `feat(interactive-boards): add Casebook PRO V1.1`.
          - Merge commit canónico: `89dc455271cf1cc4f537114f31ed73cf80d19ec0`.
          - GitHub Pages: deploy completado correctamente.
          - Vercel: deploy completado correctamente.
          - Validación visual y funcional integrada: confirmada tras el deploy.
          - URL directa: `https://juanmaes83.github.io/escaparates-pro/labs/interactive-boards-source/casebook-pro-v1-1/index.html`.
          - Plataforma: `https://juanmaes83.github.io/escaparates-pro/` → **Boards** → **Casebook PRO V1.1**.

          Esta V1.1 es el baseline canónico de la familia Interactive Boards. Cualquier ampliación funcional se desarrolla como versión nueva y conserva esta entrega sin cambios.
          """.rstrip()
          if '## Registro de validación en plataforma' not in m:
              m = m.rstrip() + validation + '\n'
              module.write_text(m, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/register-interactive-boards-docs.yml
          git add README.md labs/interactive-boards-source/README.md labs/interactive-boards-source/casebook-pro-v1-1/README.md
          python3 - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'README.md','labs/interactive-boards-source/README.md','labs/interactive-boards-source/casebook-pro-v1-1/README.md','.github/workflows/register-interactive-boards-docs.yml'}
          assert staged==expected,(staged,expected)
          print('Staging documental exacto: PASS')
          PY
          git commit -m "docs(interactive-boards): register validated Casebook PRO V1.1"
          git push origin HEAD:docs/register-interactive-boards-casebook-v1-1
