name: TEMP Pearl Force Render
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-pearl-force-render.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
      - name: Serve and compare forced render
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & sleep 2
          mkdir -p /tmp/q && cd /tmp/q && npm init -y >/dev/null 2>&1 && npm install playwright@latest --silent && npx playwright install --with-deps chromium >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/qa-force"
          timeout 100s node - <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1720,height:980}});
            const logs=[];p.on('pageerror',e=>logs.push('PAGEERROR '+e.message));p.on('console',m=>{if(m.type()==='error')logs.push('CONSOLE '+m.text())});
            await p.goto('http://127.0.0.1:4173/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html',{waitUntil:'domcontentloaded',timeout:25000});
            await p.waitForTimeout(5500);
            await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-force/01-before.png',animations:'disabled',timeout:15000});
            const before=await p.evaluate(()=>{const f=document.querySelector('.stage iframe'),a=f?.contentWindow?.CasebookPro;return {api:!!a,scene:a?.fashion?.getState?.(),stats:a?.fashion?.stats?.()}});
            const forced=await p.evaluate(()=>{const f=document.querySelector('.stage iframe'),a=f?.contentWindow?.CasebookPro;if(!a)return null;const png=a.capturePNG?.();return {pngLength:png?.length||0,state:a.fashion?.getState?.(),stats:a.fashion?.stats?.()}});
            await p.waitForTimeout(300);
            await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-force/02-after-force.png',animations:'disabled',timeout:15000});
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/qa-force/state.json',JSON.stringify({before,forced,logs},null,2));
            console.log('FORCED='+JSON.stringify({before,forced,logs}));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pearl-force-render
          path: qa-force/
      - name: Self-remove
        if: always()
        run: |
          rm -f .github/workflows/tmp-pearl-force-render.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-pearl-force-render.yml
          git commit -m 'chore(ci): remove temporary Pearl force-render QA' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true
