name: TEMP QA2 V3 Fashion Pearl
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-qa2-v3-fashion-pearl.yml']
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
          fetch-depth: 0
      - name: Protected baseline gate
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
      - name: Prepare Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          mkdir -p /tmp/q && cd /tmp/q
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Bounded browser QA
        run: |
          cd /tmp/q
          timeout 90s node <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),assert=require('assert');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1720,height:980}});
            const logs=[];p.on('pageerror',e=>{logs.push('PAGEERROR '+e.message);console.log('PAGEERROR',e.message)});p.on('console',m=>{if(m.type()==='error'){logs.push('CONSOLE '+m.text());console.log('CONSOLE',m.text())}});
            fs.mkdirSync(process.env.GITHUB_WORKSPACE+'/qa-pearl',{recursive:true});
            await p.goto('http://127.0.0.1:4173/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html',{waitUntil:'domcontentloaded',timeout:25000});
            await p.waitForTimeout(4500);
            await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-pearl/00-boot.png',timeout:10000});
            const state=await p.evaluate(()=>{const f=document.querySelector('.stage iframe'),a=f?.contentWindow?.CasebookPro;return {shell:!!document.querySelector('#esShell'),body:[...document.body.classList],host:!!window.__CasebookV3Host,v3:!!window.CasebookProV3,pearl:!!window.CasebookFashionPearl,director:!!window.CasebookPearlDirector,api:!!a,fashion:!!a?.fashion,sceneId:a?.fashion?.getState?.()?.sceneId||null,stats:a?.fashion?.stats?.()||null,innerReady:f?.contentDocument?.readyState||null};});
            console.log('STATE='+JSON.stringify(state));
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/qa-pearl/state.json',JSON.stringify({state,logs},null,2));
            assert.equal(state.shell,true,'Editorial shell not mounted');assert.equal(state.api,true,'Casebook iframe API absent');assert.equal(state.fashion,true,'Fashion API absent');assert.equal(state.pearl,true,'Pearl host layer absent');assert.equal(state.director,true,'Pearl cinematic director absent');assert.equal(state.sceneId,'pearl-runway');
            for(const [name,v] of [['01-arrival',.06],['02-hero',.30],['03-craft',.60],['04-portal',.90]]){await p.evaluate(x=>window.CasebookPearlDirector.setProgress(x),v);await p.waitForTimeout(900);await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-pearl/'+name+'.png',timeout:10000});}
            const fatal=logs.filter(x=>/ReferenceError|TypeError|SyntaxError|Cannot set|not defined|not a function|Pearl Fashion:/i.test(x));assert.equal(fatal.length,0,'Fatal errors: '+fatal.join(' | '));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-fashion-pearl-qa2
          path: qa-pearl/
          if-no-files-found: warn
      - name: Self-remove
        if: always()
        run: |
          rm -f .github/workflows/tmp-qa2-v3-fashion-pearl.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-qa2-v3-fashion-pearl.yml
          git commit -m 'chore(ci): remove temporary Pearl QA2' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true
