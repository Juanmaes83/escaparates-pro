name: Integrate Banderolas Output V2

on:
  push:
    branches:
      - feature/banderolas-output-v2-clean
    paths:
      - .github/workflows/integrate-banderolas-output-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Escaparates Pro
        uses: actions/checkout@v4
        with:
          ref: feature/banderolas-output-v2-clean
          fetch-depth: 0

      - name: Checkout canonical Banderolas Output V2
        uses: actions/checkout@v4
        with:
          repository: Juanmaes83/BANDEROLAS-DINAMICAS
          ref: 538146f7ec2ddbd056b55da0ed0eb8a1cf96ef83
          path: source-banderolas

      - name: Preserve canonical source byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          DEST="labs/website-modules-source/banderolas-dinamicas-output-v2"
          mkdir -p "$DEST"
          cp source-banderolas/index.html "$DEST/index.html"
          cp source-banderolas/index-output-v2.html "$DEST/index-output-v2.html"
          cp source-banderolas/output-enhancer-v2.js "$DEST/output-enhancer-v2.js"
          cp source-banderolas/OUTPUT-V2-NOTES.md "$DEST/OUTPUT-V2-NOTES.md"

          test "$(git -C source-banderolas hash-object index.html)" = "$(git hash-object "$DEST/index.html")"
          test "$(git -C source-banderolas hash-object index-output-v2.html)" = "$(git hash-object "$DEST/index-output-v2.html")"
          test "$(git -C source-banderolas hash-object output-enhancer-v2.js)" = "$(git hash-object "$DEST/output-enhancer-v2.js")"

      - name: Create thin Website Modules registry
        shell: bash
        run: |
          cat > js/website-modules-banderolas-output-v2.js <<'EOF'
          // Banderolas Dinamicas — Output V2. Canonical standalone Website Modules bridge.
          (function() {
              'use strict';
              window.EP = window.EP || {};
              if (!EP.WebsiteModules || !EP.WebsiteModules.register) return;

              var ID = 'banderolas-dinamicas-output-v2';
              var PATH = 'labs/website-modules-source/banderolas-dinamicas-output-v2/index-output-v2.html';

              function escapeAttr(value) {
                  return String(value || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
              }

              function buildFallbackDocument() {
                  var src = escapeAttr(PATH);
                  return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banderolas Dinamicas — Output V2</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#000}body{overflow:hidden}</style></head><body><iframe title="Banderolas Dinamicas — Output V2" src="' + src + '" allow="autoplay; fullscreen; clipboard-write; display-capture" allowfullscreen></iframe></body></html>';
              }

              EP.WebsiteModules.register({
                  id: ID,
                  name: 'Banderolas Dinamicas — Output V2',
                  icon: 'BD',
                  family: 'Interactive Media / Dynamic Fabric',
                  description: 'Banderola WebGL con fisica cloth/Verlet, imagen o video, controles de composicion y pipeline Output V2.',
                  sourceFile: 'Juanmaes83/BANDEROLAS-DINAMICAS · preview-output-v2 · 538146f7ec2ddbd056b55da0ed0eb8a1cf96ef83',
                  mediaMap: 'Editor propio Output V2: texto, imagen/video, Media Size/X/Y, Save/Restore, PNG, WebM 30/60 FPS, Preview Clean, Standalone HTML y Embed.',
                  standalonePath: PATH,
                  standaloneEditorNote: 'Editor Output V2 original preservado. Personaliza y exporta desde su propio panel; Escaparates Pro solo lo registra y carga como standalone local.',
                  fields: [],
                  build: function() {
                      return buildFallbackDocument();
                  }
              });
          })();
          EOF

      - name: Connect registry before Website Modules UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="js/website-modules-banderolas-output-v2.js"></script>'
          if tag not in s:
              needle = '<script src="js/website-modules-logo-wheel-pro.js"></script>'
              if needle not in s:
                  raise SystemExit('Website Modules insertion point not found')
              s = s.replace(needle, needle + '\n' + tag, 1)
              p.write_text(s, encoding='utf-8')

      - name: Add source record
        shell: bash
        run: |
          cat > labs/website-modules-source/banderolas-dinamicas-output-v2/README.md <<'EOF'
          # Banderolas Dinamicas — Output V2

          Estado: candidato integrado para revision visual. No aprobado para merge todavia.

          Fuente canonica:
          - Repo: `Juanmaes83/BANDEROLAS-DINAMICAS`
          - Rama: `preview-output-v2`
          - Commit: `538146f7ec2ddbd056b55da0ed0eb8a1cf96ef83`
          - Entrypoint: `index-output-v2.html`

          Regla de integracion: el standalone original se preserva byte-for-byte. Escaparates Pro no reescribe shaders, fisica Verlet/cloth, upload, interaccion ni WebGL; solo registra y carga el entrypoint local.
          EOF

      - name: QA
        shell: bash
        run: |
          set -euo pipefail
          node --check js/website-modules-banderolas-output-v2.js
          grep -q 'index-output-v2.html' js/website-modules-banderolas-output-v2.js
          grep -q 'output-enhancer-v2.js' labs/website-modules-source/banderolas-dinamicas-output-v2/index-output-v2.html
          grep -q 'website-modules-banderolas-output-v2.js' index.html
          git diff --check

      - name: Commit clean integration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source-banderolas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/website-modules-banderolas-output-v2.js labs/website-modules-source/banderolas-dinamicas-output-v2
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat(web-modules): add canonical Banderolas Output V2"
          git push origin HEAD:feature/banderolas-output-v2-clean
