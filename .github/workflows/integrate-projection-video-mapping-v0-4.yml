name: Integrate Projection Video Mapping V0.4

on:
  push:
    branches:
      - feature/projection-video-mapping-v0-4

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Escaparates Pro
        uses: actions/checkout@v4
        with:
          ref: feature/projection-video-mapping-v0-4
          fetch-depth: 0

      - name: Checkout approved Projection source
        uses: actions/checkout@v4
        with:
          repository: Juanmaes83/projection-video-mapping-experience
          ref: d1d1c9904b8d1ec600c43f21ac7051dc948f1d86
          path: projection-source

      - name: Preserve approved V0.4 package
        run: |
          set -euo pipefail
          DEST="labs/rubik-sota-tools/projection-video-mapping-v0-4"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp projection-source/index.html "$DEST/index.html"
          cp projection-source/index-v0-4.html "$DEST/index-v0-4.html"
          cp projection-source/v0-3-enhancer.js "$DEST/v0-3-enhancer.js"
          cp projection-source/v0-4-final.js "$DEST/v0-4-final.js"
          cp projection-source/FINAL-V0.4-NOTES.md "$DEST/FINAL-V0.4-NOTES.md"

      - name: Register RUBIK SOTA tool
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/rubik-tools-ui.js')
          s = p.read_text(encoding='utf-8')
          if "id: 'projection-video-mapping-v0-4'" not in s:
              marker = "        {\n            id: 'pin-mapping-studio-pro',"
              block = """        {
            id: 'projection-video-mapping-v0-4',
            name: 'Projection / Video Mapping Experience V0.4',
            icon: 'PM',
            desc: 'Herramienta de autoria de projection mapping con geometria Rubik Sota, fondo/media, video/imagen, beam, dust, texto, transform y outputs.',
            src: 'labs/rubik-sota-tools/projection-video-mapping-v0-4/index-v0-4.html'
        },
"""
              if marker not in s:
                  raise SystemExit('Rubik tools insertion marker not found')
              p.write_text(s.replace(marker, block + marker, 1), encoding='utf-8')
          PY

      - name: Static QA
        run: |
          set -euo pipefail
          test -f labs/rubik-sota-tools/projection-video-mapping-v0-4/index-v0-4.html
          test -f labs/rubik-sota-tools/projection-video-mapping-v0-4/index.html
          test -f labs/rubik-sota-tools/projection-video-mapping-v0-4/v0-3-enhancer.js
          test -f labs/rubik-sota-tools/projection-video-mapping-v0-4/v0-4-final.js
          grep -q 'src="index.html"' labs/rubik-sota-tools/projection-video-mapping-v0-4/index-v0-4.html
          grep -q 'v0-3-enhancer.js' labs/rubik-sota-tools/projection-video-mapping-v0-4/index-v0-4.html
          grep -q 'v0-4-final.js' labs/rubik-sota-tools/projection-video-mapping-v0-4/index-v0-4.html
          grep -q "id: 'projection-video-mapping-v0-4'" js/rubik-tools-ui.js
          git diff --check

      - name: Commit integration candidate
        run: |
          set -euo pipefail
          rm -rf projection-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/rubik-sota-tools/projection-video-mapping-v0-4 js/rubik-tools-ui.js
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat(rubik-sota): integrate Projection Video Mapping V0.4"
          git push origin HEAD:feature/projection-video-mapping-v0-4
