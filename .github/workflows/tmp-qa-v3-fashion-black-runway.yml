name: TEMP QA V3 Fashion Black Runway
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab]
    paths: ['.github/workflows/tmp-qa-v3-fashion-black-runway.yml']
permissions:
  contents: write
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab
          fetch-depth: 0
      - name: Verify protected baselines
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- \
            labs/interactive-boards-source/casebook-pro-v1-1 \
            labs/interactive-boards-source/casebook-pro-v2 \
            js/interactive-boards-casebook-pro-v1-1.js \
            js/interactive-boards-casebook-pro-v2.js \
            js/interactive-boards.js js/interactive-boards-ui.js css
      - name: Install isolated browser runtime
        run: |
          mkdir -p /tmp/fashionqa && cd /tmp/fashionqa
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --silent
          npx playwright install --with-deps chromium
      - name: Exercise real Fashion runtime and capture evidence
        env:
          FASHION_URL: https://escaparates-lhbnvew3u-juanma-espinosas-projects.vercel.app/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html
        run: |
          cd /tmp/fashionqa
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1720,height:980},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            await page.goto(process.env.FASHION_URL,{waitUntil:'networkidle',timeout:120000});
            await page.waitForSelector('#esShell',{state:'visible',timeout:30000});
            await page.waitForFunction(()=>document.body.classList.contains('v3-fashion-lab'),null,{timeout:15000});
            await page.waitForFunction(()=>document.querySelector('.stage iframe')?.contentWindow?.CasebookPro?.fashion?.stats,null,{timeout:30000});
            await page.waitForTimeout(1800);
            const state=await page.evaluate(()=>{
              const f=document.querySelector('.stage iframe');
              const a=f?.contentWindow?.CasebookPro?.fashion;
              return {
                lab:document.body.classList.contains('v3-fashion-lab'),
                shell:!!document.querySelector('#esShell'),
                panel:!!document.querySelector('.fashionLabPanel'),
                css:getComputedStyle(document.querySelector('#esShell')).backgroundColor,
                runtime:a?.getState?.(),
                stats:a?.stats?.(),
                world:window.CasebookProV3?.getWorld?.()?.name||null,
                originalPanel:getComputedStyle(document.querySelector('#app>.panel')).display,
                hasRunway:a?.stats?.()?.sceneId==='black-runway'
              };
            });
            console.log('FASHION_STATE='+JSON.stringify(state));
            assert.equal(state.lab,true);
            assert.equal(state.shell,true);
            assert.equal(state.panel,true);
            assert.equal(state.hasRunway,true);
            assert.ok(state.stats.meshes>10,'Expected authored 3D meshes');
            assert.ok(state.stats.triangles>0,'Expected rendered geometry');
            fs.mkdirSync(process.env.GITHUB_WORKSPACE+'/qa-fashion',{recursive:true});
            await page.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-fashion/01-black-runway-overview.png',fullPage:true});

            // Camera intent / selected framing.
            await page.selectOption('#flShot','DETAIL');
            await page.waitForTimeout(1100);
            const shot=await page.evaluate(()=>document.querySelector('.stage iframe')?.contentWindow?.CasebookPro?.fashion?.getState?.()?.shot);
            assert.equal(shot,'DETAIL');
            await page.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-fashion/02-black-runway-detail.png',fullPage:true});

            // No-post diagnostic must produce a structurally readable alternate state.
            await page.click('#flNoPost');
            await page.waitForTimeout(900);
            const diagnostic=await page.evaluate(()=>document.querySelector('.stage iframe')?.contentWindow?.CasebookPro?.fashion?.getState?.()?.diagnostic);
            assert.equal(diagnostic,true);
            await page.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-fashion/03-black-runway-no-post.png',fullPage:true});

            // Restore diagnostic and verify semantic runtime survives a refresh.
            await page.click('#flNoPost');
            await page.click('#flRefresh');
            await page.waitForTimeout(400);
            const after=await page.evaluate(()=>document.querySelector('.stage iframe')?.contentWindow?.CasebookPro?.fashion?.stats?.());
            assert.equal(after.sceneId,'black-runway');
            assert.ok(after.items>=0);

            const fatal=errors.filter(e=>/ReferenceError|TypeError|SyntaxError|not defined|not a function|Fashion bridge/i.test(e));
            console.log('BROWSER_ERRORS='+JSON.stringify(errors));
            assert.equal(fatal.length,0,'Fatal browser errors: '+fatal.join(' | '));
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/qa-fashion/runtime.json',JSON.stringify({state,shot,diagnostic,after,errors},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Upload Fashion visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-fashion-black-runway-visual-evidence
          path: qa-fashion/
          if-no-files-found: warn
      - name: Self-remove QA workflow without workspace residue
        if: always()
        run: |
          rm -f .github/workflows/tmp-qa-v3-fashion-black-runway.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-qa-v3-fashion-black-runway.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = '.github/workflows/tmp-qa-v3-fashion-black-runway.yml'
          git commit -m 'chore(ci): remove temporary Fashion visual QA' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab
