name: TEMP Fix V3 Fashion Pearl Runtime
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-fix-v3-fashion-pearl-runtime.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
          fetch-depth: 0
      - name: Protected baseline gate
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
      - name: Fix and parse injected runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-cinematic.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            '__fashionState.diagnostic?.88:1.08':'__fashionState.diagnostic ? .88 : 1.08',
            '__fashionState.diagnostic?.5:1.05':'__fashionState.diagnostic ? .5 : 1.05',
            '__fashionState.diagnostic?.4:.95':'__fashionState.diagnostic ? .4 : .95',
            '__fashionState.diagnostic?.42:.72':'__fashionState.diagnostic ? .42 : .72',
            "type==='material'?.76:.62":"type==='material' ? .76 : .62",
            "type==='material'?.02:.06":"type==='material' ? .02 : .06",
            'index%5===0?.16:.66':'index%5===0 ? .16 : .66',
          }
          for old,new in replacements.items():
            assert old in s, f'missing expected token: {old}'
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          m=re.search(r'const pearlRuntime=String\.raw`([\s\S]*?)`;\n\nfunction replaceFn',s)
          assert m,'pearlRuntime template not found'
          Path('/tmp/pearl-injected-runtime.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-cinematic.js
          node --check /tmp/pearl-injected-runtime.js
          ! grep -E "diagnostic\?\.[0-9]|material'\?\.[0-9]|===0\?\.[0-9]" labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-cinematic.js
      - name: Commit exact runtime and self-remove
        run: |
          rm .github/workflows/tmp-fix-v3-fashion-pearl-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-cinematic.js .github/workflows/tmp-fix-v3-fashion-pearl-runtime.yml
          git diff --cached --name-only | sort >/tmp/changed
          printf '%s\n' '.github/workflows/tmp-fix-v3-fashion-pearl-runtime.yml' 'labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-cinematic.js' | sort >/tmp/allowed
          diff -u /tmp/allowed /tmp/changed
          git commit -m 'fix(v3-fashion): make Pearl injected runtime parse-safe'
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
