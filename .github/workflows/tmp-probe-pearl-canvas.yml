name: TEMP Probe Pearl Canvas
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-probe-pearl-canvas.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
      - name: Probe iframe and canvas
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & sleep 2
          mkdir -p /tmp/q && cd /tmp/q && npm init -y >/dev/null 2>&1 && npm install playwright@latest --silent && npx playwright install --with-deps chromium >/dev/null
          timeout 70s node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1720,height:980}});
            await p.goto('http://127.0.0.1:4173/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html',{waitUntil:'domcontentloaded',timeout:25000});
            await p.waitForTimeout(5000);
            const v=await p.evaluate(()=>{
              const f=document.querySelector('.stage iframe');
              const cs=f?getComputedStyle(f):null;
              const d=f?.contentDocument, c=d?.querySelector('canvas'), cb=c?c.getBoundingClientRect():null, fb=f?f.getBoundingClientRect():null;
              const ccs=c?f.contentWindow.getComputedStyle(c):null, body=d?.body, bcs=body?f.contentWindow.getComputedStyle(body):null;
              return {iframe:fb&&{x:fb.x,y:fb.y,w:fb.width,h:fb.height,display:cs.display,opacity:cs.opacity,visibility:cs.visibility,z:cs.zIndex},canvas:cb&&{x:cb.x,y:cb.y,w:cb.width,h:cb.height,attrW:c.width,attrH:c.height,display:ccs.display,opacity:ccs.opacity,visibility:ccs.visibility},body:body&&{class:body.className,display:bcs.display,opacity:bcs.opacity,visibility:bcs.visibility,bg:bcs.backgroundColor},html:d?.documentElement?.outerHTML?.slice(0,180),api:!!f?.contentWindow?.CasebookPro};
            });
            console.log('PEARL_CANVAS='+JSON.stringify(v));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Self-remove
        if: always()
        run: |
          rm -f .github/workflows/tmp-probe-pearl-canvas.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-probe-pearl-canvas.yml
          git commit -m 'chore(ci): remove temporary Pearl canvas probe' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true
