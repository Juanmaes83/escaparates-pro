name: TEMP QA4 V3 Fashion Black Runway
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab]
    paths: ['.github/workflows/tmp-qa4-v3-fashion-black-runway.yml']
permissions:
  contents: write
jobs:
  black-runway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab
          fetch-depth: 0
      - name: Source and isolation gates
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
          node --check labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-scene-system.js
      - name: Local exact branch + Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html >/dev/null && break; sleep 1; done
          mkdir -p /tmp/qa && cd /tmp/qa
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Acceptance and captures
        run: |
          cd /tmp/qa
          node <<'JS'
          const {chromium}=require('playwright'),assert=require('assert'),fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:1720,height:980},deviceScaleFactor:1});
            const errors=[];p.on('pageerror',e=>{errors.push('PAGEERROR '+e.message);console.log('PAGEERROR',e.message)});p.on('console',m=>{if(m.type()==='error'){errors.push('CONSOLE '+m.text());console.log('CONSOLE ERROR',m.text())}});
            await p.goto('http://127.0.0.1:4173/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForFunction(()=>document.querySelector('.stage iframe')?.contentWindow?.CasebookPro?.fashion?.stats,{timeout:30000});
            await p.waitForSelector('#esShell',{state:'visible',timeout:30000});
            await p.waitForFunction(()=>window.CasebookProV3?.getWorld?.(),{timeout:15000});await p.waitForTimeout(1500);
            fs.mkdirSync(process.env.GITHUB_WORKSPACE+'/qa-fashion',{recursive:true});
            const snap=()=>p.evaluate(()=>{const a=document.querySelector('.stage iframe').contentWindow.CasebookPro.fashion;return{shell:!!document.querySelector('#esShell'),lab:document.body.classList.contains('v3-fashion-lab'),theme:document.body.dataset.esTheme,panel:!!document.querySelector('.fashionLabPanel'),state:a.getState(),stats:a.stats(),world:window.CasebookProV3.getWorld().name}});
            const overview=await snap();console.log('OVERVIEW='+JSON.stringify(overview));assert.equal(overview.shell,true);assert.equal(overview.lab,true);assert.equal(overview.theme,'fashion');assert.equal(overview.panel,true);assert.equal(overview.state.sceneId,'black-runway');assert.ok(overview.stats.meshes>10);assert.ok(overview.stats.triangles>0);
            await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-fashion/01-overview.png',fullPage:true});
            await p.selectOption('#flShot','DETAIL');await p.waitForTimeout(800);const detail=await snap();assert.equal(detail.state.shot,'DETAIL');await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-fashion/02-detail.png',fullPage:true});
            await p.click('#flNoPost');await p.waitForTimeout(600);const noPost=await snap();assert.equal(noPost.state.diagnostic,true);await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-fashion/03-no-post.png',fullPage:true});
            await p.click('#flStructure');await p.waitForTimeout(500);const structure=await snap();assert.equal(structure.state.structure,true);await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-fashion/04-structure.png',fullPage:true});
            const fatal=errors.filter(e=>/ReferenceError|TypeError|SyntaxError|Cannot set|not defined|not a function/i.test(e));console.log('ERRORS='+JSON.stringify(errors));assert.equal(fatal.length,0,'Fatal '+fatal.join(' | '));
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/qa-fashion/runtime.json',JSON.stringify({overview,detail,noPost,structure,errors},null,2));await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-fashion-black-runway-qa4
          path: qa-fashion/
          if-no-files-found: warn
      - name: Self-remove
        if: always()
        run: |
          rm -f .github/workflows/tmp-qa4-v3-fashion-black-runway.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-qa4-v3-fashion-black-runway.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'chore(ci): remove temporary Black Runway QA4' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab
