name: Character 2027 exact donor freeze transport

on:
  push:
    branches:
      - chatgpt/museum-character-2027-integration-v1

permissions:
  contents: write

jobs:
  exact-copy:
    if: ${{ !contains(github.event.head_commit.message, '[donor-freeze-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Museum branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/museum-character-2027-integration-v1
          fetch-depth: 0

      - name: Checkout frozen CharacterStudio donor
        uses: actions/checkout@v4
        with:
          repository: Juanmaes83/CharacterStudio
          ref: f5a93a48ed0e3904fce58f08f7fbe08b5411b289
          path: _characterstudio_donor

      - name: Copy approved stones byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/_characterstudio_donor"
          DST="$GITHUB_WORKSPACE/labs/immersive-worlds/donors-frozen/character-2027/characterstudio"

          mkdir -p "$DST/src/character2027/api" "$DST/src/character2027/animation" "$DST/src/character2027/rig" "$DST/src/character2027/interaction" "$DST/src/character2027/ik" "$DST/src/pages"

          cp "$SRC/src/character2027/api/CharacterActionAPI.js" "$DST/src/character2027/api/CharacterActionAPI.js"
          cp "$SRC/src/character2027/animation/MotionController.js" "$DST/src/character2027/animation/MotionController.js"
          cp "$SRC/src/character2027/animation/MotionFoundationV2.js" "$DST/src/character2027/animation/MotionFoundationV2.js"
          cp "$SRC/src/character2027/animation/MotionFoundationV2Extra.js" "$DST/src/character2027/animation/MotionFoundationV2Extra.js"
          cp "$SRC/src/character2027/animation/SocialMotionFoundationV3.js" "$DST/src/character2027/animation/SocialMotionFoundationV3.js"
          cp "$SRC/src/character2027/animation/Retargeter.js" "$DST/src/character2027/animation/Retargeter.js"
          cp "$SRC/src/character2027/rig/BoneMap.js" "$DST/src/character2027/rig/BoneMap.js"
          cp "$SRC/src/character2027/interaction/LookAtController.js" "$DST/src/character2027/interaction/LookAtController.js"
          cp "$SRC/src/character2027/ik/ContactIKController.js" "$DST/src/character2027/ik/ContactIKController.js"
          cp "$SRC/src/character2027/ik/DonorTwoBoneIK.js" "$DST/src/character2027/ik/DonorTwoBoneIK.js"
          cp "$SRC/src/character2027/ik/HumanoidIKController.js" "$DST/src/character2027/ik/HumanoidIKController.js"
          cp "$SRC/src/character2027/ik/LadderIKExtension.js" "$DST/src/character2027/ik/LadderIKExtension.js"
          cp "$SRC/src/character2027/ik/TerrainSemanticIK.js" "$DST/src/character2027/ik/TerrainSemanticIK.js"
          cp "$SRC/src/pages/Create.jsx" "$DST/src/pages/Create.jsx"
          cp "$SRC/src/pages/Appearance.jsx" "$DST/src/pages/Appearance.jsx"
          cp "$SRC/src/pages/MotionLab.jsx" "$DST/src/pages/MotionLab.jsx"

      - name: Verify all 16 Git blob SHAs
        shell: bash
        run: |
          set -euo pipefail
          D="labs/immersive-worlds/donors-frozen/character-2027/characterstudio"
          check() {
            path="$1"; expected="$2"
            actual="$(git hash-object "$path")"
            printf '%s  %s  %s\n' "$expected" "$actual" "$path"
            test "$actual" = "$expected"
          }
          check "$D/src/character2027/api/CharacterActionAPI.js" 1107f6015dd16274105d16a71e950729b678f667
          check "$D/src/character2027/animation/MotionController.js" 35a9182bd8cf378df6389fdc27f9fbd02a9b662b
          check "$D/src/character2027/animation/MotionFoundationV2.js" 3ffa2617b107c1bdf885befce8bfcd4e0bda067c
          check "$D/src/character2027/animation/MotionFoundationV2Extra.js" f59c9e54fc4e4347f8a145e8e2b3e2a7bb57d848
          check "$D/src/character2027/animation/SocialMotionFoundationV3.js" 2490cc4e36e1464d237000caca457d5b73dd79ec
          check "$D/src/character2027/animation/Retargeter.js" a32c471eb67f4d3dd33b694e5317532b0ec753ef
          check "$D/src/character2027/rig/BoneMap.js" 0c74181afaaa64e34e3b8c03cfb042fb7fb27e12
          check "$D/src/character2027/interaction/LookAtController.js" c5cb4f75694f31a04dadf7236cafece91e77acba
          check "$D/src/character2027/ik/ContactIKController.js" c4b0c14288f30d7d8178bc1dadc11a7f3c7d76ce
          check "$D/src/character2027/ik/DonorTwoBoneIK.js" ea0e507a072d949bab8018b4ad27e7cc31392d26
          check "$D/src/character2027/ik/HumanoidIKController.js" c4e103dc3f2dddf341f2654d15e3e8909d676856
          check "$D/src/character2027/ik/LadderIKExtension.js" 242fb865fcd61fe573c85c1de8467778ea1a9c97
          check "$D/src/character2027/ik/TerrainSemanticIK.js" 870d24744baae178acf0751d28d7e9b7d70d3560
          check "$D/src/pages/Create.jsx" e70cf09eddd8c9c3df5c7d5c27fada75ed1b5979
          check "$D/src/pages/Appearance.jsx" d1ec659da9f5702ca4a83483f3850675c30df949
          check "$D/src/pages/MotionLab.jsx" 8e1fff64f882cfd2eff6837e19e93b4dbad70515

      - name: Commit exact frozen CharacterStudio donor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _characterstudio_donor
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/immersive-worlds/donors-frozen/character-2027/characterstudio
          if git diff --cached --quiet; then
            echo "No donor changes required"
            exit 0
          fi
          git commit -m "chore(character): freeze exact CharacterStudio donor stones [donor-freeze-bot]"
          git push origin HEAD:chatgpt/museum-character-2027-integration-v1
