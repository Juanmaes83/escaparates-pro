# trigger: sync living Character tracker 2026-08-26
name: Museum Phase4A sync tracker
on:
  push:
    branches: [chatgpt/museum-character-2027-integration-v1]
    paths: ['.github/workflows/museum-phase4a-sync-tracker.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/museum-character-2027-integration-v1
          fetch-depth: 0
      - name: Sync living tracker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('labs/immersive-worlds/docs/MUSEUM_CHARACTER_AVATAR_2027_PROGRESS_TRACKER.md')
          s=p.read_text()
          pairs=[
            ('| Character runtime activation | **NOT STARTED** | Phase 2 did not add active runtime imports |','| Character runtime activation | **PASS / ACTIVE** | Phase 3 presence + Phase 4A bounded runtime graft |'),
            ('| Character visible in Museum | **NO** | Phase 3 has not started |','| Character visible in Museum | **PASS** | Juanma human visual validation 2026-08-26 in Gallery A |'),
            ('| Character presence / IDLE | PENDING | Phase 3 |','| Character presence / IDLE | **PASS / CLOSED** | Phase 3 human gate completed 2026-08-26 |'),
            ('| Third-person free mobility / collision | PENDING | Phase 4A |','| Third-person free mobility / collision | **IN PROGRESS / HUMAN PASS PENDING** | Technical gate implemented; video validation next |'),
            ('**PHASE 3 = PENDING / NEXT AFTER JUANMA APPROVAL**','**PHASE 3 = PASS / CLOSED — human visual validation 2026-08-26**'),
            ('**PHASE 4A = PENDING**','**PHASE 4A = TECHNICAL GATE READY / HUMAN VALIDATION PENDING**'),
            ('**PHASE 2 IS CLOSED.**\n\n**NEXT ONLY AFTER JUANMA APPROVAL:** Phase 3 — first bounded runtime surgery: Character presence / rig / scale / grounding / `IDLE_V2` in Gallery A.\n\nDo not activate locomotion, third-person camera, portals or specialized-room Character behavior in the same first presence gate.','**PHASE 3 IS PASS / CLOSED.**\n\n**CURRENT:** Phase 4A — technical free-mobility gate implemented in Gallery A. Human video validation is pending.\n\n**NEXT ONLY AFTER JOINT PHASE 4A PASS:** Phase 4B — canonical Gallery A → Gallery B portal continuity with the same Avatar identity.')
          ]
          for old,new in pairs:
              assert old in s, old
              s=s.replace(old,new,1)
          phase3=['vendor exact `GLTFLoader.js` from Three 0.185.1 and register provenance','Character asset loads','Character visible in Gallery A','Rig valid','Scale correct','Grounding correct','`IDLE_V2` stable','animation updates through existing Museum frame loop','deterministic dispose/rollback','no duplicate renderer','no duplicate WorldStore','no duplicate CameraAuthority']
          for item in phase3: s=s.replace(f'- [ ] {item}',f'- [x] {item}',1)
          phase4=['Character Explore input routing through Museum InputSystem','WALK','BACKWARD','TURN LEFT / RIGHT','STOP','JUMP','room bounds','wall collision','relevant furniture collision','grounding during movement','Museum-owned navigation resolver reused/extracted cleanly','no second ExploreController collision oracle','distinct third-person Explore behavior under the same CameraAuthority']
          for item in phase4: s=s.replace(f'- [ ] {item}',f'- [x] {item}',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/immersive-worlds/docs/MUSEUM_CHARACTER_AVATAR_2027_PROGRESS_TRACKER.md
          git commit -m 'docs(museum): sync tracker through Phase4A human gate'
          git push
