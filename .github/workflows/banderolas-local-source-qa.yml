name: Banderolas Local Source QA

on:
  push:
    branches:
      - feature/type-b-banderolas-studio-pro
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preserve-local-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Escaparates Pro branch
        uses: actions/checkout@v4
        with:
          ref: feature/type-b-banderolas-studio-pro
          fetch-depth: 0
          path: target

      - name: Checkout canonical Banderolas source
        uses: actions/checkout@v4
        with:
          repository: Juanmaes83/BANDEROLAS-DINAMICAS
          ref: 538146f7ec2ddbd056b55da0ed0eb8a1cf96ef83
          fetch-depth: 1
          path: source

      - name: Verify canonical Git blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source hash-object index.html)" = "9fc683b9e988a56a8426d094bde3c4bcaa25e372"
          test "$(git -C source hash-object output-enhancer-v2.js)" = "e496e414b5ae7d77c82583ad1a071c1ee42c52f5"
          test "$(git -C source hash-object index-output-v2.html)" = "4cb27137abba038d87d025db48b4967ba1185a84"

      - name: Preserve source locally byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          DEST="target/labs/immersive-worlds/shared-capabilities/flexible-media/banderolas/source"
          mkdir -p "$DEST"
          cp source/index.html "$DEST/index.html"
          cp source/output-enhancer-v2.js "$DEST/output-enhancer-v2.js"
          cp source/index-output-v2.html "$DEST/index-output-v2.html"
          cp source/OUTPUT-V2-NOTES.md "$DEST/OUTPUT-V2-NOTES.md"
          test "$(git hash-object "$DEST/index.html")" = "9fc683b9e988a56a8426d094bde3c4bcaa25e372"
          test "$(git hash-object "$DEST/output-enhancer-v2.js")" = "e496e414b5ae7d77c82583ad1a071c1ee42c52f5"
          test "$(git hash-object "$DEST/index-output-v2.html")" = "4cb27137abba038d87d025db48b4967ba1185a84"

      - name: Write preservation manifest
        shell: bash
        run: |
          cat > target/labs/immersive-worlds/shared-capabilities/flexible-media/banderolas/SOURCE-MANIFEST.md <<'EOF'
          # Banderolas — Preserved Source Manifest

          Source repository: `Juanmaes83/BANDEROLAS-DINAMICAS`

          Approved candidate branch: `preview-output-v2`

          Pinned commit: `538146f7ec2ddbd056b55da0ed0eb8a1cf96ef83`

          Preserved byte-for-byte by GitHub Actions:

          - `source/index.html` — Git blob `9fc683b9e988a56a8426d094bde3c4bcaa25e372`
          - `source/output-enhancer-v2.js` — Git blob `e496e414b5ae7d77c82583ad1a071c1ee42c52f5`
          - `source/index-output-v2.html` — Git blob `4cb27137abba038d87d025db48b4967ba1185a84`
          - `source/OUTPUT-V2-NOTES.md` — source documentation

          Integration rule: `PRESERVE LOCAL SOURCE → ADAPTER → PANEL → QA → APPROVAL`.

          The preserved source is never rewritten to connect Escaparates Pro. The outer Type B panel delegates to the preserved Output V2 controls through a same-origin DOM adapter.
          EOF

      - name: Static Type B QA
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          node --check js/advanced-tools/banderolas-host.js
          node --check js/advanced-tools/registry.js
          node tests/banderolas-type-b-contract.spec.mjs
          ! grep -E "raw\.githubusercontent|cdn\.jsdelivr|frame\.srcdoc|bridgeSource|__epBandDrawPatched" js/advanced-tools/banderolas-host.js
          grep -F "labs/immersive-worlds/shared-capabilities/flexible-media/banderolas/source/index-output-v2.html" js/advanced-tools/registry.js

      - name: Install Chromium runtime QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/epqa
          cd /tmp/epqa
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Runtime QA — preserved Output V2 + same-origin panel adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory target >/tmp/banderolas-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat >/tmp/epqa/runtime.js <<'NODE'
          const { chromium } = require('/tmp/epqa/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/banderolas-tool.html',{waitUntil:'domcontentloaded'});
            try {
              await page.waitForFunction(()=>document.querySelector('#band-status')?.textContent.includes('Motor local conectado'),null,{timeout:12000});
            } catch(e) {
              console.error('STATUS=',await page.locator('#band-status').textContent().catch(()=>''));
              console.error('FRAMES=',page.frames().map(f=>f.url()));
              throw e;
            }
            const wrapper=page.frames().find(f=>f.url().includes('/source/index-output-v2.html'));
            const engine=page.frames().find(f=>f.url().includes('/source/index.html'));
            if(!wrapper) throw new Error('Preserved Output V2 wrapper not found');
            if(!engine) throw new Error('Preserved Banderolas engine not found');
            const canvas=await engine.$('#glcanvas');
            if(!canvas) throw new Error('Canonical WebGL canvas missing');
            const box=await canvas.boundingBox();
            if(!box||box.width<100||box.height<100) throw new Error('Canvas has invalid dimensions');
            if(!(await engine.$('#outputStatus'))) throw new Error('Output V2 enhancer did not initialize');
            await page.fill('#band-title','QA LOCAL SOURCE');
            await page.waitForFunction(()=>document.querySelector('#band-frame')?.contentDocument?.getElementById('appFrame')?.contentDocument?.querySelector('#input-title')?.value==='QA LOCAL SOURCE');
            await page.locator('#band-scale').evaluate(el=>{el.value='1.5';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.waitForFunction(()=>document.querySelector('#band-frame')?.contentDocument?.getElementById('appFrame')?.contentDocument?.querySelector('#mediaScale')?.value==='1.5');
            const png=await engine.evaluate(()=>document.getElementById('glcanvas').toDataURL('image/png'));
            if(typeof png!=='string'||!png.startsWith('data:image/png')) throw new Error('PNG capture unavailable');
            const outerStatus=await page.locator('#band-status').textContent();
            if(!outerStatus.includes('Output V2 preservado')) throw new Error('Outer adapter did not report preserved Output V2');
            const fatal=errors.filter(x=>!x.includes('ResizeObserver'));
            if(fatal.length) throw new Error('Page errors: '+fatal.join(' | '));
            console.log('RUNTIME_QA_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/epqa/runtime.js

      - name: Commit exact preservation artifacts
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/immersive-worlds/shared-capabilities/flexible-media/banderolas/source \
                  labs/immersive-worlds/shared-capabilities/flexible-media/banderolas/SOURCE-MANIFEST.md
          if git diff --cached --quiet; then
            echo "Canonical local source already exact; nothing to commit."
          else
            git commit -m "fix(banderolas): preserve Output V2 source byte-for-byte"
            git push origin HEAD:feature/type-b-banderolas-studio-pro
          fi
