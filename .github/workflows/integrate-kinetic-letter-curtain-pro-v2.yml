name: Integrate Kinetic Letter Curtain PRO V2

on:
  push:
    branches:
      - feat/kinetic-letter-curtain-pro-v2-video-projection
    paths:
      - .github/workflows/integrate-kinetic-letter-curtain-pro-v2.yml

permissions:
  contents: write

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kinetic-letter-curtain-pro-v2-video-projection
          fetch-depth: 0

      - name: Reconstruct approved standalone
        shell: bash
        run: |
          mkdir -p labs/website-modules-source/kinetic-letter-curtain-pro-v2-video-projection
          cat tmp/klc-v2-html.part1 tmp/klc-v2-html.part2 tmp/klc-v2-html.part3 | base64 -d | gzip -d > labs/website-modules-source/kinetic-letter-curtain-pro-v2-video-projection/index.html
          echo "4b96f27ccc328a4d5c9173872abf17410abceceb5ffea0f2e14facc3a435497c  labs/website-modules-source/kinetic-letter-curtain-pro-v2-video-projection/index.html" | sha256sum -c -
          test "$(git hash-object labs/website-modules-source/kinetic-letter-curtain-pro-v2-video-projection/index.html)" = "53fcaca9d362a4f963364b9650da146812489265"

      - name: Create V2 module bridge and documentation
        shell: bash
        run: |
          cat > js/website-modules-kinetic-letter-curtain-pro-v2-video-projection.js <<'EOF'
          // Kinetic Letter Curtain PRO V2 — Video Projection — standalone Website Modules bridge.
          (function() {
              'use strict';
              window.EP = window.EP || {};
              if (!EP.WebsiteModules || !EP.WebsiteModules.register) return;

              var ID = 'kinetic-letter-curtain-pro-v2-video-projection';
              var PATH = 'labs/website-modules-source/kinetic-letter-curtain-pro-v2-video-projection/index.html';

              function escapeAttr(value) {
                  return String(value || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
              }

              function buildFallbackDocument() {
                  var src = escapeAttr(PATH);
                  return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinetic Letter Curtain PRO V2 — Video Projection</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#eee7da}body{overflow:hidden}</style></head><body><iframe title="Kinetic Letter Curtain PRO V2 — Video Projection" src="' + src + '" allow="autoplay; fullscreen; display-capture" allowfullscreen></iframe></body></html>';
              }

              EP.WebsiteModules.register({
                  id: ID,
                  name: 'Kinetic Letter Curtain PRO V2 — Video Projection',
                  icon: 'V2',
                  family: 'Canvas / Video Projection Typography',
                  description: 'Cortina tipografica fisica con video proyectado dentro de las letras, malla visual de alta densidad y perfiles de rendimiento.',
                  sourceFile: PATH + ' · V2 aprobada · SHA-256 4b96f27ccc328a4d5c9173872abf17410abceceb5ffea0f2e14facc3a435497c',
                  mediaMap: 'Editor propio: todo V1.1 + video projection por escena, densidad visual, glyph scale/weight, FPS, sampling, fit y correccion de imagen.',
                  standalonePath: PATH,
                  standaloneEditorNote: 'Modulo V2 independiente. Mantiene V1.1 intacta y añade Video Projection: OFF, Static Image, Balanced y High Quality, con malla visual desacoplada de la fisica y limites automaticos en movil.',
                  standaloneActions: {
                      html: 'downloadFinalHtmlBtn',
                      zip: 'downloadClientZipBtn',
                      embed: 'copyEmbedBtn'
                  },
                  fields: [],
                  build: function() {
                      return buildFallbackDocument();
                  }
              });
          })();
          EOF

          cat > labs/website-modules-source/kinetic-letter-curtain-pro-v2-video-projection/README.md <<'EOF'
          # Kinetic Letter Curtain PRO V2 — Video Projection

          Modulo premium independiente de Escaparates Pro. Extiende Kinetic Letter Curtain PRO V1.1 con proyeccion de video en tiempo real dentro de la materia tipografica, sin sustituir ni modificar la V1.1.

          ## Identidad

          - Module ID: `kinetic-letter-curtain-pro-v2-video-projection`
          - Version integrada: `V2 — Video Projection`
          - Superficie: `Website Modules Lab`
          - HTML canonico: `labs/website-modules-source/kinetic-letter-curtain-pro-v2-video-projection/index.html`
          - Registro: `js/website-modules-kinetic-letter-curtain-pro-v2-video-projection.js`
          - SHA-256 aprobado: `4b96f27ccc328a4d5c9173872abf17410abceceb5ffea0f2e14facc3a435497c`
          - Git blob SHA esperado: `53fcaca9d362a4f963364b9650da146812489265`
          - Base conceptual: `Juanmaes83/world-cup-letter-flags`
          - V1.1 permanece como modulo independiente en `kinetic-letter-curtain-pro`.

          ## Objetivo V2

          Convertir la cortina de letras en una pantalla fisica viva. Cada letra funciona como una muestra visual del frame de video mientras las hebras siguen respondiendo a gravedad, restricciones e impulso de cursor/tactil.

          ## Modos de proyeccion

          - `OFF`: colores y patrones normales.
          - `Static image mapping`: imagen estatica como mapa de color.
          - `Video mapping · balanced`: sampling y FPS moderados para priorizar fluidez.
          - `Video mapping · high quality`: mayor densidad, resolucion y frecuencia de mapping en escritorio.

          Cada una de las cuatro escenas puede tener su propio video de proyeccion.

          ## High Density Letter Matrix

          La V2 desacopla la densidad visual de la malla fisica. Los nodos Verlet siguen siendo la estructura mecanica, mientras se interpolan glifos visuales adicionales entre nodos y hebras. Esto aumenta la resolucion aparente de la pantalla tipografica sin multiplicar en la misma proporcion el coste de la simulacion fisica.

          Controles disponibles:

          - densidad visual `1.0–2.0x`;
          - escala de glifo `0.75–1.5x`;
          - peso tipografico `600 / 700 / 800 / 900`;
          - mapping FPS `8–30`;
          - sample resolution `96 / 128 / 160 / 192`;
          - video fit `cover / contain`;
          - brightness;
          - contrast;
          - saturation.

          ## Perfiles efectivos y movil

          Balanced y High Quality aplican limites automaticos en pantallas pequenas para proteger CPU, bateria y suavidad. El perfil efectivo reduce densidad, FPS de mapping, sample resolution y render FPS cuando corresponde, sin eliminar la interaccion fisica.

          ## Prioridad del logo

          El logo integrado en la cortina se conserva. Cuando una letra cae dentro de la mascara del logo, el logo tiene prioridad visual sobre el video proyectado, permitiendo combinar marca legible y video en movimiento.

          ## Funciones heredadas de V1.1

          - cuatro escenas independientes;
          - cortina larga;
          - sky/fondo imagen-video;
          - wall/plaster imagen-video;
          - canopy personalizado;
          - contenido libre de palabras/nombres/productos/claims;
          - colores y patrones;
          - image color-map;
          - logo integrado en las letras;
          - todos los textos visibles personalizables;
          - Scene / Plaster;
          - navegacion, cursor/tactil y fisica de hebras;
          - viewer final cerrado.

          ## Persistencia de media

          La configuracion ligera usa claves V2 propias. La media pesada, incluido el video de proyeccion, se guarda como Blob en IndexedDB y se resuelve con ObjectURL durante la edicion. No se guarda video pesado en localStorage.

          ## Exportaciones

          El standalone conserva:

          - HTML final cerrado;
          - ZIP cliente;
          - preview;
          - embed iframe;
          - PNG;
          - grabacion de revision cuando el navegador permite display capture / MediaRecorder.

          HTML y ZIP incluyen el video de proyeccion cuando existe.

          ## QA de integracion

          Antes del PR se verifica:

          - reconstruccion byte a byte del HTML aprobado;
          - SHA-256 exacto;
          - Git blob SHA exacto;
          - sintaxis JavaScript del standalone;
          - sintaxis del bridge y Website Modules UI;
          - presencia de los cuatro modos de proyeccion;
          - controles de densidad, escala, peso, FPS y sampling;
          - acciones HTML / ZIP / Embed;
          - V1.1 sin cambios;
          - diff final limitado a los archivos del nuevo modulo y los dos puntos de conexion/documentacion.

          La validacion visual final integrada corresponde al usuario despues del deploy.
          EOF

      - name: Connect loader and root README
        shell: python
        run: |
          from pathlib import Path

          ui = Path('js/website-modules-ui.js')
          s = ui.read_text()
          old = "            { id: 'kinetic-letter-curtain-pro', src: 'js/website-modules-kinetic-letter-curtain-pro.js' }"
          new = old + ",\n            { id: 'kinetic-letter-curtain-pro-v2-video-projection', src: 'js/website-modules-kinetic-letter-curtain-pro-v2-video-projection.js' }"
          assert s.count(old) == 1
          assert 'website-modules-kinetic-letter-curtain-pro-v2-video-projection.js' not in s
          ui.write_text(s.replace(old, new, 1))

          readme = Path('README.md')
          r = readme.read_text()
          changes = [
              ('La version actual incluye 30 modulos premium.', 'La version actual incluye 31 modulos premium.'),
              ('- Kinetic Letter Curtain PRO V1.1.\n', '- Kinetic Letter Curtain PRO V1.1.\n- Kinetic Letter Curtain PRO V2 — Video Projection.\n'),
              ('**Kinetic Letter Curtain PRO V1.1** vive en `labs/website-modules-source/kinetic-letter-curtain-pro/` y conserva como fuente canonica el HTML V1.1 aprobado. El Lab lo abre como editor standalone aislado, sin reimplementar el solver fisico de las hebras. Incluye cuatro escenas, cortina tipografica alargada, contenido libre, colores y patrones, imagen como mapa de color, logo integrado en las letras, sky/wall/plaster/canopy con imagen-video, textos visibles completamente personalizables, persistencia IndexedDB y entregables HTML final, ZIP cliente, embed, preview, PNG y grabacion de revision.\n', '**Kinetic Letter Curtain PRO V1.1** vive en `labs/website-modules-source/kinetic-letter-curtain-pro/` y conserva como fuente canonica el HTML V1.1 aprobado. El Lab lo abre como editor standalone aislado, sin reimplementar el solver fisico de las hebras. Incluye cuatro escenas, cortina tipografica alargada, contenido libre, colores y patrones, imagen como mapa de color, logo integrado en las letras, sky/wall/plaster/canopy con imagen-video, textos visibles completamente personalizables, persistencia IndexedDB y entregables HTML final, ZIP cliente, embed, preview, PNG y grabacion de revision.\n\n**Kinetic Letter Curtain PRO V2 — Video Projection** vive en `labs/website-modules-source/kinetic-letter-curtain-pro-v2-video-projection/` como modulo independiente. Conserva la experiencia V1.1 y suma video proyectado dentro de las letras, malla visual de alta densidad desacoplada de la fisica, modos OFF / Static / Balanced / High Quality, control de densidad, escala y peso tipografico, FPS y resolucion de sampling, fit, brillo, contraste, saturacion y limites automaticos en movil.\n'),
              ('- **Kinetic Letter Curtain PRO V1.1** en Website Modules Lab: modulo standalone Canvas/Verlet ubicado en `labs/website-modules-source/kinetic-letter-curtain-pro/`, con cuatro escenas, cortina fisica alargada, media de entorno imagen-video, contenido tipografico libre, image color-map, logo integrado y pipeline propio de entregables cerrados.\n', '- **Kinetic Letter Curtain PRO V1.1** en Website Modules Lab: modulo standalone Canvas/Verlet ubicado en `labs/website-modules-source/kinetic-letter-curtain-pro/`, con cuatro escenas, cortina fisica alargada, media de entorno imagen-video, contenido tipografico libre, image color-map, logo integrado y pipeline propio de entregables cerrados.\n- **Kinetic Letter Curtain PRO V2 — Video Projection** en Website Modules Lab: modulo standalone Canvas/Verlet + video sampling ubicado en `labs/website-modules-source/kinetic-letter-curtain-pro-v2-video-projection/`, con video dentro de las letras, malla visual de alta densidad, perfiles Balanced/High Quality y pipeline propio de entregables cerrados.\n')
          ]
          for old, new in changes:
              assert r.count(old) == 1, old
              r = r.replace(old, new, 1)
          assert r.count('Kinetic Letter Curtain PRO V2 — Video Projection') >= 3
          readme.write_text(r)

      - name: Static QA
        shell: bash
        run: |
          node --check js/website-modules-ui.js
          node --check js/website-modules-kinetic-letter-curtain-pro-v2-video-projection.js
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          p = Path('labs/website-modules-source/kinetic-letter-curtain-pro-v2-video-projection/index.html')
          s = p.read_text()
          expected = '4b96f27ccc328a4d5c9173872abf17410abceceb5ffea0f2e14facc3a435497c'
          actual = hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          required = [
              'projectionModeInput', 'projectionVideoInput', 'visualDensityInput',
              'glyphScaleInput', 'glyphWeightInput', 'mappingFpsInput',
              'sampleResolutionInput', 'projectionBrightnessInput',
              'projectionContrastInput', 'projectionSaturationInput',
              'video-balanced', 'video-high', 'downloadFinalHtmlBtn',
              'downloadClientZipBtn', 'copyEmbedBtn'
          ]
          missing = [x for x in required if x not in s]
          assert not missing, missing
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S | re.I)
          Path('/tmp/klc-v2.js').write_text('\n'.join(scripts))
          print('HTML SHA-256', actual)
          PY
          node --check /tmp/klc-v2.js
          test "$(git hash-object labs/website-modules-source/kinetic-letter-curtain-pro-v2-video-projection/index.html)" = "53fcaca9d362a4f963364b9650da146812489265"
          git diff --quiet origin/master -- labs/website-modules-source/kinetic-letter-curtain-pro/index.html
          git diff --check

      - name: Commit clean integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md js/website-modules-ui.js js/website-modules-kinetic-letter-curtain-pro-v2-video-projection.js labs/website-modules-source/kinetic-letter-curtain-pro-v2-video-projection/README.md labs/website-modules-source/kinetic-letter-curtain-pro-v2-video-projection/index.html
          git rm tmp/klc-v2-html.part1 tmp/klc-v2-html.part2 tmp/klc-v2-html.part3 .github/workflows/integrate-kinetic-letter-curtain-pro-v2.yml
          git diff --cached --check
          git commit -m "feat(web-modules): add Kinetic Letter Curtain PRO V2 Video Projection"
          git push origin HEAD:feat/kinetic-letter-curtain-pro-v2-video-projection
