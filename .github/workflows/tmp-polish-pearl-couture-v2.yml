name: TEMP Polish Pearl Couture V2
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-polish-pearl-couture-v2.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
      - name: Apply exact art-direction polish
        run: |
          FILE='labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-couture-v2.js'
          python3 -c "from pathlib import Path; p=Path('$FILE'); s=p.read_text(); anchor='function __pcArchitecture(){'; helper=\"function __pcText(lines,w=30,h=6,hero=false){const c=document.createElement('canvas');c.width=1200;c.height=300;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#232220';x.textBaseline='top';x.font=hero?'600 74px Georgia,Times New Roman,serif':'600 28px Arial,Helvetica,sans-serif';(Array.isArray(lines)?lines:[lines]).slice(0,3).forEach((t,i)=>x.fillText(String(t||'').toUpperCase(),26,22+i*(hero?88:52),1140));const tx=new THREE.CanvasTexture(c);tx.needsUpdate=true;const m=new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false,side:THREE.DoubleSide});const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);o.renderOrder=30;return o;}\\n\"; assert anchor in s; s=s.replace(anchor,helper+anchor,1) if 'function __pcText(' not in s else s; s=s.replace('cyc.material.roughness=.98;g.add(cyc);','cyc.material.roughness=.98;cyc.material.color.set(0xbab6b0);g.add(cyc);'); s=s.replace('__fMat(0xb8b4ae,.61,.06)','__fMat(0xa9a6a1,.63,.07)').replace('__fMat(0xd1cdc6,.42,.10)','__fMat(0xc4c0b9,.44,.10)').replace('color:0xd8d0c5','color:0xeee8de'); s=s.replace(\"const title=__fTextPlane(['AFTER DARK / FW26','PEARL COUTURE STUDY'],48,9.5,'hero');\",\"const title=__pcText(['AFTER DARK / FW26','PEARL COUTURE STUDY'],48,10,true);\").replace(\"const look=__fTextPlane(['01 / SILHOUETTE',names[0]||'LOOK 01'],28,5.2,'label');\",\"const look=__pcText(['01 / SILHOUETTE',names[0]||'LOOK 01'],28,5.2,false);\").replace(\"const material=__fTextPlane(['02 / MATERIAL',names[1]||'PEARL SATIN'],27,5,'label');\",\"const material=__pcText(['02 / MATERIAL',names[1]||'PEARL SATIN'],27,5,false);\").replace(\"const index=__fTextPlane(['CASEBOOK PRO V3 / FASHION','SCENE 01 — PEARL RUNWAY'],34,5.4,'label');\",\"const index=__pcText(['CASEBOOK PRO V3 / FASHION','SCENE 01 — PEARL RUNWAY'],34,5.4,false);\"); s=s.replace('title.position.set(-61,49,8.2)','title.position.set(-57,43,8.2)'); s=s.replace('renderer.toneMappingExposure=.82','renderer.toneMappingExposure=.77'); s=s.replace('scene.background=new THREE.Color(0xc5c1bb);scene.fog=new THREE.FogExp2(0xc5c1bb,.0013);','scene.background=new THREE.Color(0xb8b5b0);scene.fog=new THREE.FogExp2(0xb8b5b0,.00115);'); s=s.replace('__pcCamera(__pcState.center.x,6,132,__pcState.center.x,10,5)','__pcCamera(__pcState.center.x,7,165,__pcState.center.x,9,5)'); old=\"const x=cx+7*b-11*c+16*d,y=6-3*a+7*b-5*c+4*d,z=132-34*a-17*b+15*c+20*d;\"; new=\"const x=cx+4*b-8*c+11*d,y=7-2*a+5*b-3*c+3*d,z=165-35*a-9*b+7*c+18*d;\"; assert old in s; s=s.replace(old,new); p.write_text(s)"
          node --check "$FILE"
          grep -q 'function __pcText' "$FILE"
          grep -q 'z=165-35' "$FILE"
      - name: Commit and self-remove
        run: |
          rm -f .github/workflows/tmp-polish-pearl-couture-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-couture-v2.js .github/workflows/tmp-polish-pearl-couture-v2.yml
          git commit -m 'refactor(v3-fashion): refine Pearl Couture framing and contrast'
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
