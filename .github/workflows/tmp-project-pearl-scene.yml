name: TEMP Project Pearl Scene
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-project-pearl-scene.yml']
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
      - name: Inject projection probe
        run: |
          FILE='labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-cinematic.js'
          python3 -c "from pathlib import Path; p=Path('$FILE'); s=p.read_text(); old='function __pPearlProgress(p){'; ins='function __pProjectStats(){camera.updateMatrixWorld();const one=o=>{const b=new THREE.Box3().setFromObject(o),c=new THREE.Vector3();b.getCenter(c);const n=c.clone().project(camera);return {world:[c.x,c.y,c.z],ndc:[n.x,n.y,n.z]}};return {items:items.slice(0,6).map(it=>one(it.grp)),pearl:one(__fashionState.group),cam:{pos:[camera.position.x,camera.position.y,camera.position.z],rot:[camera.rotation.x,camera.rotation.y,camera.rotation.z],near:camera.near,far:camera.far},rig:{tx:rig.tx,ty:rig.ty,tz:rig.tz}};}\n'+old; assert old in s; s=s.replace(old,ins,1); old2='stats:__fStats,setProgress:__pPearlProgress,refresh:'; new2='stats:__fStats,project:__pProjectStats,setProgress:__pPearlProgress,refresh:'; assert old2 in s; s=s.replace(old2,new2,1); p.write_text(s)"
          node --check "$FILE"
      - name: Measure projection
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & sleep 2
          mkdir -p /tmp/q && cd /tmp/q && npm init -y >/dev/null 2>&1 && npm install playwright@latest --silent && npx playwright install --with-deps chromium >/dev/null
          timeout 70s node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1720,height:980}});await p.goto('http://127.0.0.1:4173/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html',{waitUntil:'domcontentloaded',timeout:25000});await p.waitForTimeout(5000);const v=await p.evaluate(()=>document.querySelector('.stage iframe')?.contentWindow?.CasebookPro?.fashion?.project?.());console.log('PEARL_PROJECT='+JSON.stringify(v));if(!v)process.exitCode=2;await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Discard probe and self-remove
        if: always()
        run: |
          git checkout -- labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-cinematic.js
          rm -f .github/workflows/tmp-project-pearl-scene.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-project-pearl-scene.yml
          git commit -m 'chore(ci): remove temporary Pearl projection probe' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true
