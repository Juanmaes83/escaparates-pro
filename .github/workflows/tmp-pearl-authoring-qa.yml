name: TEMP Pearl Authoring QA
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-pearl-authoring-qa.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
          fetch-depth: 0
      - name: Protected baseline gate
        run: git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
      - name: Syntax check
        run: node --check labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-stability.js
      - name: Browser authoring QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          mkdir -p /tmp/pearlqa qa-authoring
          cp .github/qa-pearl-authoring.js /tmp/pearlqa/qa.js
          cd /tmp/pearlqa
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --silent
          npx playwright install --with-deps chromium >/dev/null
          timeout 160s node qa.js
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: pearl-authoring-hardening
          path: qa-authoring/
      - name: Cleanup temporary QA
        if: always()
        run: |
          rm -f .github/workflows/tmp-pearl-authoring-qa.yml .github/qa-pearl-authoring.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/tmp-pearl-authoring-qa.yml .github/qa-pearl-authoring.js
          git commit -m 'chore(ci): remove temporary Pearl authoring QA' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true