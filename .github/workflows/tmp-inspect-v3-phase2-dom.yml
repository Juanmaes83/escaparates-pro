name: TEMP Inspect V3 Phase2 DOM
on:
  push:
    branches: [feat/casebook-pro-v3-phase2-editorial-spatial-studio]
    paths: ['.github/workflows/tmp-inspect-v3-phase2-dom.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase2-editorial-spatial-studio
      - name: Inspect IDs and V2/V3 controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('labs/interactive-boards-source/casebook-pro-v3/index.html')
          s=p.read_text(encoding='utf-8')
          ids=sorted(set(re.findall(r'id="([^"]+)"',s)))
          print('=== IDS ===')
          for i in ids:
              if any(k in i.lower() for k in ['v2','story','present','record','graph','timeline','focus','zone','preview','panel','app','export','import','html','json','review']):
                  print(i)
          print('=== BUTTONS WITH TEXT/ID ===')
          for m in re.finditer(r'<button[^>]*id="([^"]+)"[^>]*>(.*?)</button>',s,re.S):
              text=re.sub('<[^>]+>',' ',m.group(2)); text=' '.join(text.split())
              print(m.group(1),'::',text[:100])
          PY
      - name: Self remove
        run: |
          rm .github/workflows/tmp-inspect-v3-phase2-dom.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ci): remove temporary V3 Phase2 DOM inspection'
          git push origin HEAD:feat/casebook-pro-v3-phase2-editorial-spatial-studio
