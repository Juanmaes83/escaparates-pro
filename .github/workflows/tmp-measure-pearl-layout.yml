name: TEMP Measure Pearl Layout
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-measure-pearl-layout.yml']
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
      - name: Patch temporary layout probe into Pearl API
        run: |
          FILE='labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-cinematic.js'
          python3 -c "from pathlib import Path; p=Path('$FILE'); s=p.read_text(); old='function __pPearlProgress(p){'; ins='function __pLayoutStats(){const b=new THREE.Box3();items.forEach(it=>{if(it.grp)b.expandByObject(it.grp)});const c=new THREE.Vector3(),sz=new THREE.Vector3();if(!b.isEmpty()){b.getCenter(c);b.getSize(sz)}return {center:[c.x,c.y,c.z],size:[sz.x,sz.y,sz.z],min:[b.min.x,b.min.y,b.min.z],max:[b.max.x,b.max.y,b.max.z],camera:[camera.position.x,camera.position.y,camera.position.z],fov:camera.fov,aspect:camera.aspect,zHome:Z_HOME,rig:{tx:rig.tx,ty:rig.ty,tz:rig.tz}};}\n'+old; assert old in s; s=s.replace(old,ins,1); old2='stats:__fStats,setProgress:__pPearlProgress,refresh:'; new2='stats:__fStats,layout:__pLayoutStats,setProgress:__pPearlProgress,refresh:'; assert old2 in s; s=s.replace(old2,new2,1); p.write_text(s)"
          node --check "$FILE"
      - name: Serve and measure in Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & sleep 2
          mkdir -p /tmp/q && cd /tmp/q && npm init -y >/dev/null 2>&1 && npm install playwright@latest --silent && npx playwright install --with-deps chromium >/dev/null
          timeout 60s node -e "const{chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1720,height:980}});await p.goto('http://127.0.0.1:4173/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html',{waitUntil:'domcontentloaded',timeout:25000});await p.waitForTimeout(4500);const v=await p.evaluate(()=>document.querySelector('.stage iframe')?.contentWindow?.CasebookPro?.fashion?.layout?.());console.log('PEARL_LAYOUT='+JSON.stringify(v));if(!v)process.exitCode=2;await b.close()})()"
      - name: Discard probe and self-remove
        if: always()
        run: |
          git checkout -- labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-cinematic.js
          rm -f .github/workflows/tmp-measure-pearl-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-measure-pearl-layout.yml
          git commit -m 'chore(ci): remove temporary Pearl layout probe' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true
