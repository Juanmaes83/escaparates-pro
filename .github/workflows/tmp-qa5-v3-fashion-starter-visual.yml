name: TEMP QA5 V3 Fashion Starter Visual
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab]
    paths: ['.github/workflows/tmp-qa5-v3-fashion-starter-visual.yml']
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab
          fetch-depth: 0
      - name: Isolation gate
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
      - name: Local exact branch and browser
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html >/dev/null && break; sleep 1; done
          mkdir -p /tmp/qa && cd /tmp/qa
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture populated Fashion starter
        run: |
          cd /tmp/qa
          node <<'JS'
          const {chromium}=require('playwright'),assert=require('assert'),fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:1720,height:980},deviceScaleFactor:1});
            const errors=[];p.on('pageerror',e=>{errors.push('PAGEERROR '+e.message);console.log('PAGEERROR',e.message)});p.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            await p.goto('http://127.0.0.1:4173/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForSelector('#esShell',{state:'visible',timeout:30000});
            await p.waitForFunction(()=>{const f=document.querySelector('.stage iframe'),a=f?.contentWindow?.CasebookPro;return a?.fashion&&a?.exportState?.()?.items?.length>=8},{timeout:30000});
            await p.waitForFunction(()=>window.CasebookProV3?.getWorld?.()?.name==='AFTER DARK / FW26',{timeout:15000});
            await p.waitForTimeout(1800);
            fs.mkdirSync(process.env.GITHUB_WORKSPACE+'/qa-fashion',{recursive:true});
            const state=await p.evaluate(()=>{const f=document.querySelector('.stage iframe'),a=f.contentWindow.CasebookPro;return {world:window.CasebookProV3.getWorld(),items:a.exportState().items.map(x=>({id:x.id,title:x.title||x.name,category:x.pro?.category||x.category,fashionType:x.pro?.fashionType})),fashion:a.fashion.getState(),stats:a.fashion.stats()}});
            console.log('STARTER='+JSON.stringify({world:state.world.name,items:state.items.length,stats:state.stats}));assert.ok(state.items.length>=8);assert.equal(state.world.name,'AFTER DARK / FW26');
            await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-fashion/01-fashion-starter-overview.png',fullPage:true});
            await p.selectOption('#flShot','HERO');await p.waitForTimeout(800);await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-fashion/02-fashion-starter-hero.png',fullPage:true});
            await p.selectOption('#flShot','DETAIL');await p.waitForTimeout(800);await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-fashion/03-fashion-starter-detail.png',fullPage:true});
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/qa-fashion/runtime.json',JSON.stringify({state,errors},null,2));
            const fatal=errors.filter(e=>/ReferenceError|TypeError|SyntaxError|Cannot set|not defined|not a function/i.test(e));assert.equal(fatal.length,0,'Fatal '+fatal.join(' | '));await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-fashion-starter-qa5
          path: qa-fashion/
          if-no-files-found: warn
      - name: Self-remove
        if: always()
        run: |
          rm -f .github/workflows/tmp-qa5-v3-fashion-starter-visual.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-qa5-v3-fashion-starter-visual.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'chore(ci): remove temporary Fashion starter QA5' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab
