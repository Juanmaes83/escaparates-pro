name: TEMP Run V3 Anchor Patch
on:
  push:
    branches: [feat/casebook-pro-v3-p0-technical-hardening]
    paths: ['.github/workflows/tmp-run-v3-anchor-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-p0-technical-hardening
          fetch-depth: 0
      - name: Fetch master and verify frozen baselines
        run: |
          set -euo pipefail
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
      - name: Apply V3-only patch
        run: |
          set -euo pipefail
          python3 .github/tmp-v3-anchor-patch.py
          node --check labs/interactive-boards-source/casebook-pro-v3/v3-spatial-worlds-p0.js
          grep -q 'patchV3AnchorBridge' labs/interactive-boards-source/casebook-pro-v3/index.html
          grep -q 'v3AnchorAt:__v3AnchorAt' labs/interactive-boards-source/casebook-pro-v3/index.html
          grep -q "anchor.type==='item3d'||anchor.type==='world3d'" labs/interactive-boards-source/casebook-pro-v3/v3-spatial-worlds-p0.js
      - name: Reverify, cleanup and commit
        run: |
          set -euo pipefail
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
          rm .github/tmp-v3-anchor-patch.py .github/workflows/tmp-run-v3-anchor-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(v3): anchor hotspots to Three.js world and item points'
          git push origin HEAD:feat/casebook-pro-v3-p0-technical-hardening
