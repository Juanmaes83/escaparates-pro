name: Integrate Rope Gallery PRO V1.5

on:
  push:
    branches:
      - feat/rope-gallery-pro-v1-5

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct approved standalone and integrate module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re

          expected = 'e7599acf4ab58a73eaaeabf9740e9a96dbb4efb2d26c063a0d724a9d517ca2b7'
          parts = [Path(f'tmp/rope-v1.5/part{i:02d}.b64').read_text().strip() for i in range(1,5)]
          gz = base64.b64decode(''.join(parts))
          html = gzip.decompress(gz)
          actual = hashlib.sha256(html).hexdigest()
          if actual != expected:
              raise SystemExit(f'Rope Gallery SHA mismatch: {actual} != {expected}')

          module_dir = Path('labs/website-modules-source/rope-gallery-pro')
          module_dir.mkdir(parents=True, exist_ok=True)
          (module_dir / 'index.html').write_bytes(html)
          (module_dir / 'source.v1.5.html.gz').write_bytes(gz)

          bridge = r'''// Rope Gallery PRO V1.5 — standalone Website Modules bridge.
          (function() {
              'use strict';
              window.EP = window.EP || {};
              if (!EP.WebsiteModules || !EP.WebsiteModules.register) return;

              var ID = 'rope-gallery-pro';
              var PATH = 'labs/website-modules-source/rope-gallery-pro/index.html';

              function escapeAttr(value) {
                  return String(value || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
              }

              function buildFallbackDocument() {
                  var src = escapeAttr(PATH);
                  return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rope Gallery PRO V1.5</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#faf8f4}body{overflow:hidden}</style></head><body><iframe title="Rope Gallery PRO V1.5" src="' + src + '" allow="autoplay; fullscreen; display-capture" allowfullscreen></iframe></body></html>';
              }

              EP.WebsiteModules.register({
                  id: ID,
                  name: 'Rope Gallery PRO V1.5',
                  icon: 'RG',
                  family: '3D / Interactive Gallery',
                  description: 'Galeria Three.js sobre cuerda fisica con pinzas, inercia, imagen/video por ficha y Focus editorial independiente.',
                  sourceFile: PATH + ' · V1.5 aprobada · clean media + focus',
                  mediaMap: 'Editor propio: logo, hero, navegacion, fondo, 8 fichas imagen/video, descripcion ampliada, CTA y entregables cliente.',
                  standalonePath: PATH,
                  standaloneEditorNote: 'Editor completo dentro del preview. Personaliza identidad, colores, fondo y ocho fichas con imagen/video, descripcion y CTA. El Focus final abre cada ficha en primer termino sin recortar el canvas.',
                  standaloneActions: {
                      html: 'downloadFinalHtmlBtn',
                      zip: 'downloadClientZipBtn',
                      embed: 'copyEmbedBtn'
                  },
                  fields: [],
                  build: function() {
                      return buildFallbackDocument();
                  }
              });
          })();
          '''
          # Remove workflow indentation introduced by the Python heredoc.
          bridge = '\n'.join(line[10:] if line.startswith('          ') else line for line in bridge.splitlines()) + '\n'
          Path('js/website-modules-rope-gallery-pro.js').write_text(bridge, encoding='utf-8')

          module_readme = f'''# Rope Gallery PRO V1.5

Modulo standalone de Escaparates Pro para crear una galeria 3D interactiva de tarjetas colgadas sobre una cuerda fisica, con personalizacion completa de identidad, imagen/video y contenido ampliado.

## Identidad

- Module ID: `rope-gallery-pro`
- Version aprobada: `V1.5 · Clean Media + Focus`
- Superficie: `Website Modules Lab`
- HTML canonico: `labs/website-modules-source/rope-gallery-pro/index.html`
- Copia de preservacion: `labs/website-modules-source/rope-gallery-pro/source.v1.5.html.gz`
- Registro: `js/website-modules-rope-gallery-pro.js`
- SHA-256 del HTML aprobado: `{expected}`
- Fuente de referencia: `Juanmaes83/rope-gallery`

El `index.html` es la version standalone V1.5 aprobada visual y funcionalmente. Se conserva como fuente canonica y no se reimplementa dentro del motor generico de Website Modules.

## Experiencia

La pieza conserva la identidad del proyecto Rope Gallery:

- cuerda fisica 3D con deformacion y respuesta al peso;
- tarjetas colgantes con pinzas verdes;
- drag, lanzamiento con inercia, rueda/trackpad y teclado;
- oscilacion tipo pendulo, rebote y repelencia entre tarjetas;
- parallax de camara y adaptacion de resolucion por rendimiento;
- ocho contenidos logicos reutilizados de forma estable sobre las tarjetas fisicas;
- Focus independiente del canvas al seleccionar una ficha, con media completa a la izquierda e informacion ampliada a la derecha;
- cierre del Focus mediante X, Escape o click exterior.

## Personalizacion Escaparates Pro

### Identidad y hero

- logo y nombre de marca;
- badge;
- titular, palabra destacada y segunda linea;
- subtitulo;
- CTA principal y URL;
- navegacion y CTA de cabecera;
- colores principales;
- fondo por color, imagen o video.

### Ocho fichas

Cada ficha permite personalizar de forma independiente:

- titulo;
- subtitulo;
- descripcion ampliada;
- texto CTA;
- URL CTA;
- imagen o video.

El pipeline multimedia replica el patron ya validado en otros modulos de Escaparates Pro: configuracion ligera en `localStorage`, Blob en IndexedDB, ObjectURL para video durante la edicion y resolucion segura de imagen/video para el viewer y las exportaciones. No se guardan videos pesados en `localStorage`.

## Entregables

La V1.5 incorpora su propio pipeline de salida:

- HTML final cerrado;
- ZIP cliente + assets + manifest;
- iframe/embed;
- preview local;
- captura PNG;
- PNG sequence ZIP;
- grabacion de video final MP4/WebM segun soporte;
- grabacion de revision cliente.

El viewer final mantiene cuerda, imagen/video, Focus y CTA, pero no expone el panel de personalizacion.

## Integracion con Website Modules Lab

Website Modules Lab carga directamente el `index.html` aprobado dentro de su iframe. Los botones globales HTML, ZIP y Embed delegan en los botones internos de la pieza:

- HTML -> `downloadFinalHtmlBtn`
- ZIP -> `downloadClientZipBtn`
- Embed -> `copyEmbedBtn`

Esto evita duplicar el exportador, recrear la experiencia o simplificar la fisica al incorporarla a Escaparates Pro.

## QA

Antes de modificar esta pieza:

1. Preservar el HTML canonico aprobado y comprobar su SHA-256.
2. Reutilizar el pipeline multimedia validado: Blob/IndexedDB + ObjectURL/DataURL solo donde corresponda.
3. Probar varias imagenes y varios videos simultaneamente.
4. Verificar que el contenido logico se mantiene asociado correctamente cuando las tarjetas fisicas se reciclan.
5. Probar Focus, X, Escape y click exterior sin recortes del canvas.
6. Probar HTML final, ZIP y Embed con imagen y video.
7. Confirmar que el viewer final no muestra el editor.
8. Revisar desktop y movil antes de dar una nueva version por aprobada.
'''
          (module_dir / 'README.md').write_text(module_readme, encoding='utf-8')

          ui_path = Path('js/website-modules-ui.js')
          ui = ui_path.read_text(encoding='utf-8')
          old = "            { id: 'sketchbook-pro-v3', src: 'js/website-modules-sketchbook-pro-v3.js' }\n        ];"
          new = "            { id: 'sketchbook-pro-v3', src: 'js/website-modules-sketchbook-pro-v3.js' },\n            { id: 'rope-gallery-pro', src: 'js/website-modules-rope-gallery-pro.js' }\n        ];"
          if ui.count(old) != 1:
              raise SystemExit('Website Modules loader anchor not found exactly once')
          ui_path.write_text(ui.replace(old, new), encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          replacements = [
              ('La version actual incluye 27 modulos premium.', 'La version actual incluye 28 modulos premium.'),
              ('- Sketchbook PRO V3.\n', '- Sketchbook PRO V3.\n- Rope Gallery PRO V1.5.\n'),
              ('**Sketchbook PRO V3** vive en `labs/website-modules-source/sketchbook-pro-v3/` y conserva como fuente canonica el HTML V3 aprobado. El Lab lo abre como editor standalone aislado, sin reimplementar su motor de paso de pagina. Incluye nueve spreads con imagen/video, drag y gesto de lanzamiento, curvatura fisica de la hoja, lupa arrastrable, parallax, branding, paleta, titulos y contacto editables, persistencia robusta de media y entregables HTML final, ZIP cliente, embed, preview, PNG, PNG sequence, WebM y grabacion de revision cliente.\n', '**Sketchbook PRO V3** vive en `labs/website-modules-source/sketchbook-pro-v3/` y conserva como fuente canonica el HTML V3 aprobado. El Lab lo abre como editor standalone aislado, sin reimplementar su motor de paso de pagina. Incluye nueve spreads con imagen/video, drag y gesto de lanzamiento, curvatura fisica de la hoja, lupa arrastrable, parallax, branding, paleta, titulos y contacto editables, persistencia robusta de media y entregables HTML final, ZIP cliente, embed, preview, PNG, PNG sequence, WebM y grabacion de revision cliente.\n\n**Rope Gallery PRO V1.5** vive en `labs/website-modules-source/rope-gallery-pro/` y conserva como fuente canonica el HTML V1.5 aprobado. El Lab lo abre como editor standalone aislado, sin reimplementar la fisica de cuerda. Incluye cuerda Three.js con pinzas, drag e inercia, ocho fichas personalizables con imagen/video, descripcion ampliada y CTA, Focus independiente del canvas, branding y fondo multimedia, persistencia IndexedDB y entregables HTML final, ZIP cliente, embed, preview, PNG, PNG sequence, MP4/WebM y grabacion de revision cliente.\n'),
              ('- **Sketchbook PRO V3** en Website Modules Lab: modulo standalone editorial ubicado en `labs/website-modules-source/sketchbook-pro-v3/`, con nueve spreads imagen-video, paso de pagina curvo, lupa, parallax, branding y pipeline propio de entregables cerrados.\n', '- **Sketchbook PRO V3** en Website Modules Lab: modulo standalone editorial ubicado en `labs/website-modules-source/sketchbook-pro-v3/`, con nueve spreads imagen-video, paso de pagina curvo, lupa, parallax, branding y pipeline propio de entregables cerrados.\n- **Rope Gallery PRO V1.5** en Website Modules Lab: modulo standalone Three.js ubicado en `labs/website-modules-source/rope-gallery-pro/`, con cuerda fisica, ocho fichas imagen-video, Focus editorial sin recortes, branding y pipeline propio de entregables cerrados.\n')
          ]
          for old_text, new_text in replacements:
              if readme.count(old_text) != 1:
                  raise SystemExit('README anchor not found exactly once: ' + old_text[:80])
              readme = readme.replace(old_text, new_text)
          readme_path.write_text(readme, encoding='utf-8')

          # Final structural checks before the commit.
          if hashlib.sha256((module_dir / 'index.html').read_bytes()).hexdigest() != expected:
              raise SystemExit('Final canonical HTML hash changed')
          if 'rope-gallery-pro' not in ui_path.read_text(encoding='utf-8'):
              raise SystemExit('Rope Gallery loader was not registered')
          if 'Rope Gallery PRO V1.5' not in readme_path.read_text(encoding='utf-8'):
              raise SystemExit('Root README was not updated')
          PY

          node --check js/website-modules-rope-gallery-pro.js
          node --check js/website-modules-ui.js

          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html = Path('labs/website-modules-source/rope-gallery-pro/index.html').read_text(encoding='utf-8')
          modules = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
          if len(modules) != 1:
              raise SystemExit(f'Expected 1 module script, found {len(modules)}')
          p = Path('/tmp/rope-gallery-v15.mjs')
          p.write_text(modules[0], encoding='utf-8')
          subprocess.run(['node', '--check', str(p)], check=True)
          if 'downloadFinalHtmlBtn' not in html or 'downloadClientZipBtn' not in html or 'copyEmbedBtn' not in html:
              raise SystemExit('Standalone export actions missing')
          PY

      - name: Commit verified integration only
        shell: bash
        run: |
          rm -rf tmp/rope-v1.5
          rm -f .github/workflows/integrate-rope-gallery-v1-5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
            js/website-modules-ui.js \
            js/website-modules-rope-gallery-pro.js \
            labs/website-modules-source/rope-gallery-pro/index.html \
            labs/website-modules-source/rope-gallery-pro/README.md \
            labs/website-modules-source/rope-gallery-pro/source.v1.5.html.gz
          git add -u tmp/rope-v1.5 .github/workflows/integrate-rope-gallery-v1-5.yml
          git diff --cached --check
          git status --short
          git commit -m "feat(web-modules): add Rope Gallery PRO V1.5"
          git push origin HEAD:feat/rope-gallery-pro-v1-5
