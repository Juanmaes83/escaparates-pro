name: TEMP Wire V3 Fashion Lab
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab]
    paths: ['.github/workflows/tmp-wire-v3-fashion-lab.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab
          fetch-depth: 0
      - name: Verify frozen baselines
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
      - name: Wire Fashion Lab registry exactly once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='    <script src="js/interactive-boards-casebook-pro-v3.js"></script>\n    <script src="js/interactive-boards-ui.js"></script>'
          new='    <script src="js/interactive-boards-casebook-pro-v3.js"></script>\n    <script src="js/interactive-boards-casebook-pro-v3-fashion-lab.js"></script>\n    <script src="js/interactive-boards-ui.js"></script>'
          assert s.count(old)==1, f'expected one wiring point, got {s.count(old)}'
          assert 'interactive-boards-casebook-pro-v3-fashion-lab.js' not in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          grep -c 'interactive-boards-casebook-pro-v3-fashion-lab.js' index.html | grep -q '^1$'
      - name: Commit only approved paths and self-remove
        run: |
          rm .github/workflows/tmp-wire-v3-fashion-lab.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/tmp-wire-v3-fashion-lab.yml
          git diff --cached --name-only | sort > /tmp/changed
          printf '.github/workflows/tmp-wire-v3-fashion-lab.yml\nindex.html\n' | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
          git commit -m 'chore(v3-fashion): wire isolated Fashion Lab board'
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab
