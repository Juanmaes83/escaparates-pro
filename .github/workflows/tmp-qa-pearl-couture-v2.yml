name: TEMP QA Pearl Couture V2
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-qa-pearl-couture-v2.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
          fetch-depth: 0
      - name: Protected baseline gate
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
      - name: Chromium direct-render QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & sleep 2
          mkdir -p /tmp/q && cd /tmp/q && npm init -y >/dev/null 2>&1 && npm install playwright@latest --silent && npx playwright install --with-deps chromium >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/qa-couture"
          timeout 110s node - <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),assert=require('assert');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1720,height:980}});const logs=[];p.on('pageerror',e=>logs.push('PAGEERROR '+e.message));p.on('console',m=>{if(m.type()==='error')logs.push('CONSOLE '+m.text())});await p.goto('http://127.0.0.1:4173/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html',{waitUntil:'domcontentloaded',timeout:25000});await p.waitForTimeout(5500);const base=await p.evaluate(()=>{const a=document.querySelector('.stage iframe')?.contentWindow?.CasebookPro;return {api:!!a,state:a?.fashion?.getState?.(),stats:a?.fashion?.stats?.()}});console.log('COUTURE_STATE='+JSON.stringify(base));assert.equal(base.api,true);assert.equal(base.state?.version,'3F.5-pearl-couture-candidate');for(const [name,v] of [['01-arrival',.05],['02-hero',.32],['03-craft',.62],['04-portal',.90]]){const data=await p.evaluate(x=>{const a=document.querySelector('.stage iframe')?.contentWindow?.CasebookPro;a?.fashion?.setProgress?.(x);return a?.capturePNG?.()},v);if(!data)throw new Error('No capture '+name);fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/qa-couture/'+name+'.png',Buffer.from(data.split(',')[1],'base64'));}fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/qa-couture/state.json',JSON.stringify({base,logs},null,2));const fatal=logs.filter(x=>/ReferenceError|TypeError|SyntaxError|not defined|not a function|Couture V2/i.test(x));assert.equal(fatal.length,0,fatal.join(' | '));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pearl-couture-v2-qa
          path: qa-couture/
      - name: Self-remove
        if: always()
        run: |
          rm -f .github/workflows/tmp-qa-pearl-couture-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-qa-pearl-couture-v2.yml
          git commit -m 'chore(ci): remove temporary Pearl Couture V2 QA' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true
