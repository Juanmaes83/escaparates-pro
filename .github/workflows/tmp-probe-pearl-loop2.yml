name: TEMP Probe Pearl Loop2
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-probe-pearl-loop2.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
      - name: Inspect loop source
        run: |
          FILE='labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html'
          grep -n -E 'setAnimationLoop|\.render\(|function loop|function animate|function tick|animate\(|tick\(' "$FILE" | tail -120
          sed -n '630,670p' "$FILE"
      - name: Self-remove
        if: always()
        run: |
          rm -f .github/workflows/tmp-probe-pearl-loop2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-probe-pearl-loop2.yml
          git commit -m 'chore(ci): remove temporary Pearl loop2 probe' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true
