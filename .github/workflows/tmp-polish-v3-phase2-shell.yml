name: TEMP Polish V3 Phase2 Shell
on:
  push:
    branches: [feat/casebook-pro-v3-phase2-editorial-spatial-studio]
    paths: ['.github/workflows/tmp-polish-v3-phase2-shell.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase2-editorial-spatial-studio
          fetch-depth: 0
      - name: Polish shell only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js=Path('labs/interactive-boards-source/casebook-pro-v3/v3-editorial-spatial-shell.js')
          s=js.read_text(encoding='utf-8')
          old='<button class="esMode active" data-esmode="story">Story</button>'
          assert s.count(old)==1
          s=s.replace(old,'<button class="esMode" data-esmode="story">Story</button>',1)
          js.write_text(s,encoding='utf-8')
          css=Path('labs/interactive-boards-source/casebook-pro-v3/v3-editorial-spatial-shell.css')
          c=css.read_text(encoding='utf-8')
          marker='/* PHASE2 EDITORIAL DELEGATED STATES */'
          assert marker not in c
          c += r'''

/* PHASE2 EDITORIAL DELEGATED STATES */
body.v3-editorial-studio .v3modalWrap{z-index:210!important;background:rgba(16,16,14,.42)!important;backdrop-filter:blur(22px)!important}
body.v3-editorial-studio .v3modal{width:min(760px,calc(100% - 54px))!important;max-height:82vh!important;background:var(--es-paper)!important;color:var(--es-ink)!important;border:1px solid var(--es-line)!important;border-radius:0!important;box-shadow:0 40px 120px rgba(0,0,0,.28)!important;padding:24px!important}
body.v3-editorial-studio .v3modal h2{font:400 30px/1 var(--es-display)!important;letter-spacing:-.035em!important;color:var(--es-ink)!important}
body.v3-editorial-studio .v3modal p{font:10px/1.65 var(--es-ui)!important;color:var(--es-muted)!important}
body.v3-editorial-studio .v3modal .btn{min-height:36px!important;border-radius:0!important;border-color:var(--es-line)!important;background:transparent!important;color:var(--es-ink)!important;text-transform:uppercase!important;letter-spacing:.08em!important;font-size:8px!important}
body.v3-editorial-studio .v3modal .btn.primary{background:var(--es-accent)!important;color:var(--es-accent-ink)!important;border-color:var(--es-accent)!important}
body.v3-editorial-studio .v3modal .field label{color:var(--es-muted)!important;text-transform:uppercase!important;letter-spacing:.09em!important;font-size:8px!important}
body.v3-editorial-studio .v3modal input,body.v3-editorial-studio .v3modal select,body.v3-editorial-studio .v3modal textarea{border:0!important;border-bottom:1px solid var(--es-line)!important;border-radius:0!important;background:transparent!important;color:var(--es-ink)!important}
body.v3-editorial-studio .v3worldmap{border:1px solid var(--es-line)!important;border-radius:0!important;background:var(--es-paper-2)!important;min-height:470px!important}
body.v3-editorial-studio .v3worldmap img{opacity:.88!important;filter:saturate(.78) contrast(.94)!important}
body.v3-editorial-studio .v3mapNode{width:32px!important;height:32px!important;border:1px solid var(--es-ink)!important;background:var(--es-paper)!important;color:var(--es-ink)!important;border-radius:50%!important;font:700 9px var(--es-mono)!important;box-shadow:0 7px 20px rgba(0,0,0,.12)!important}
body.v3-editorial-studio .v3mapNode.active{background:var(--es-ink)!important;color:var(--es-paper)!important}
body.v3-editorial-studio .v3mapNode span{background:var(--es-paper)!important;color:var(--es-ink)!important;border:1px solid var(--es-line)!important;border-radius:0!important;font:8px var(--es-ui)!important;padding:4px 6px!important}
body.v3-editorial-studio .v3routeLegend{gap:2px!important}body.v3-editorial-studio .v3routeLegend .btn{border-radius:0!important}
body.v3-editorial-studio .v2StoryRail{z-index:175!important;left:14px!important;right:14px!important;bottom:14px!important;border:1px solid var(--es-line)!important;border-radius:0!important;background:rgba(241,239,233,.96)!important;color:var(--es-ink)!important;backdrop-filter:blur(20px)!important;box-shadow:0 25px 80px rgba(0,0,0,.18)!important}
body.v3-editorial-studio .v2RailHead{border-bottom:1px solid var(--es-line)!important}body.v3-editorial-studio .v2RailHead b{font-size:8px!important;letter-spacing:.18em!important}body.v3-editorial-studio .v2RailHead span{color:var(--es-muted)!important}
body.v3-editorial-studio .v2Step{border:0!important;border-right:1px solid var(--es-line)!important;border-radius:0!important;background:transparent!important;color:var(--es-ink)!important}body.v3-editorial-studio .v2Step.active{background:var(--es-ink)!important;color:var(--es-paper)!important}body.v3-editorial-studio .v2Step .n,body.v3-editorial-studio .v2Step small{color:inherit!important;opacity:.58!important}
body.v3-editorial-studio .v2StoryRail .btn{border-radius:0!important;background:transparent!important;color:var(--es-ink)!important;border-color:var(--es-line)!important}body.v3-editorial-studio .v2StoryRail .btn.primary{background:var(--es-ink)!important;color:var(--es-paper)!important}
body.v3-editorial-studio .v3hot{border-radius:50%!important;background:rgba(245,243,237,.92)!important;color:#111!important;border:1px solid #111!important;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 10px 30px rgba(0,0,0,.22)!important}body.v3-editorial-studio .v3hot.portal{border-width:2px!important}body.v3-editorial-studio .v3hot.info{border-style:dotted!important}body.v3-editorial-studio .v3hotLabel{border-radius:0!important;background:rgba(245,243,237,.96)!important;color:#111!important;border:1px solid rgba(0,0,0,.14)!important;font:8px var(--es-ui)!important}
body[data-es-theme='fashion'].v3-editorial-studio .v3modal h2{font-family:var(--es-display)!important;text-transform:uppercase!important;font-size:40px!important;line-height:.82!important}body[data-es-theme='fashion'].v3-editorial-studio .v3mapNode span{text-transform:uppercase!important;font-weight:800!important;letter-spacing:.08em!important}
'''
          css.write_text(c,encoding='utf-8')
          PY
          node --check labs/interactive-boards-source/casebook-pro-v3/v3-editorial-spatial-shell.js
      - name: Verify isolation, commit, self remove
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
          rm .github/workflows/tmp-polish-v3-phase2-shell.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(v3): polish editorial delegated states and spatial modes'
          git push origin HEAD:feat/casebook-pro-v3-phase2-editorial-spatial-studio
