name: TEMP QA Pearl Polished
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-qa-pearl-polished.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
          fetch-depth: 0
      - name: Protected baseline gate
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
      - name: Capture polished renderer
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & sleep 2
          mkdir -p /tmp/q && cd /tmp/q && npm init -y >/dev/null 2>&1 && npm install playwright@latest --silent && npx playwright install --with-deps chromium >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/qa-polished"
          timeout 110s node - <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),assert=require('assert');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1720,height:980}});const errors=[];p.on('pageerror',e=>errors.push(e.message));await p.goto('http://127.0.0.1:4173/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html',{waitUntil:'domcontentloaded',timeout:25000});await p.waitForTimeout(5000);for(const [name,v] of [['01-arrival',.04],['02-hero',.32],['03-craft',.62],['04-portal',.90]]){const r=await p.evaluate(x=>{const a=document.querySelector('.stage iframe')?.contentWindow?.CasebookPro;a?.fashion?.setProgress?.(x);return {data:a?.capturePNG?.(),state:a?.fashion?.getState?.(),stats:a?.fashion?.stats?.()};},v);assert.equal(r.state?.version,'3F.5-pearl-couture-candidate');fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/qa-polished/'+name+'.png',Buffer.from(r.data.split(',')[1],'base64'));}await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa-polished/05-author-page.png',animations:'disabled',timeout:15000});fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/qa-polished/errors.json',JSON.stringify(errors,null,2));assert.equal(errors.length,0,errors.join(' | '));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pearl-polished-final-qa
          path: qa-polished/
      - name: Self-remove
        if: always()
        run: |
          rm -f .github/workflows/tmp-qa-pearl-polished.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-qa-pearl-polished.yml
          git commit -m 'chore(ci): remove temporary Pearl polished QA' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true
