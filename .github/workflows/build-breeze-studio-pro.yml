name: Build Breeze Studio PRO

on:
  push:
    branches:
      - feature/breeze-studio-pro
    paths:
      - .github/workflows/build-breeze-studio-pro.yml
      - scripts/build_breeze_studio_pro_v3.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Escaparates Pro
        uses: actions/checkout@v4
        with:
          ref: feature/breeze-studio-pro
          fetch-depth: 0

      - name: Checkout preserved Breeze source
        uses: actions/checkout@v4
        with:
          repository: Juanmaes83/breeze
          ref: 0ab82342f9169f20e32b0e90babcc4707e694906
          path: breeze-source

      - name: Add Breeze Studio PRO V3 authoring layer
        run: python scripts/build_breeze_studio_pro_v3.py

      - name: Build Breeze Studio PRO
        working-directory: breeze-source
        run: |
          npm ci
          npm run build

      - name: Install built module
        run: |
          set -euo pipefail
          DEST="labs/website-modules-source/breeze-studio-pro"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R breeze-source/dist/. "$DEST/"
          cp breeze-source/LICENSE "$DEST/LICENSE"
          cp breeze-source/CREDITS.md "$DEST/CREDITS.md"
          cat > "$DEST/README.md" <<'EOF'
          # Breeze Studio PRO V3

          Independent Escaparates Pro module built additively from the preserved Breeze engine.

          Source engine:
          - Juanmaes83/breeze
          - commit 0ab82342f9169f20e32b0e90babcc4707e694906

          V3 authoring model:
          - explicit Upload -> Saved -> Apply -> Applied state for every asset;
          - image/video mapped onto the simulated cloth;
          - cloth Scale / Position X / Position Y;
          - background image/video with Scale / Position X / Position Y;
          - original Breeze HDRI preserved as lighting while a custom visual background is active;
          - original Venus de Milo preserved;
          - uploaded GLB/GLTF/OBJ object can replace the sculpture;
          - applied replacement geometry rebuilds the real BVH cloth collider;
          - built-in object templates: Venus, Abstract Torus Knot, Abstract Orbit, Museum Plinth;
          - original Breeze scene, camera and physics controls preserved;
          - PNG, WebM and clean preview.

          Banderolas Dinamicas remains untouched and is not a runtime dependency.
          The proven Banderolas asset/video pattern informed this independent implementation.
          EOF

      - name: Register Website Module
        run: |
          cat > js/website-modules-breeze-studio-pro.js <<'EOF'
          (function() {
              'use strict';
              window.EP = window.EP || {};
              if (!EP.WebsiteModules || !EP.WebsiteModules.register) return;
              var PATH = 'labs/website-modules-source/breeze-studio-pro/index.html';
              EP.WebsiteModules.register({
                  id: 'breeze-studio-pro',
                  name: 'Breeze Studio PRO',
                  icon: 'BR',
                  family: 'Interactive Media / Dynamic Fabric',
                  description: 'Escultura y tela WebGPU con authoring por assets: fondo, media en tela y objeto 3D reemplazable.',
                  sourceFile: 'Juanmaes83/breeze · 0ab82342f9169f20e32b0e90babcc4707e694906 · additive derivative V3',
                  mediaMap: 'Upload > Saved > Apply > Applied para fondo imagen/video, tela imagen/video y GLB/GLTF/OBJ; templates 3D; Scene/Physics; PNG/WebM.',
                  standalonePath: PATH,
                  standaloneEditorNote: 'Modulo nuevo e independiente. Breeze preservado como motor; Banderolas permanece intacto y solo sirve como patron funcional probado.',
                  fields: [],
                  build: function() {
                      return '<!doctype html><html><body style="margin:0;background:#000"><iframe src="' + PATH + '" style="position:fixed;inset:0;width:100%;height:100%;border:0" allow="autoplay;fullscreen" allowfullscreen></iframe></body></html>';
                  }
              });
          })();
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="js/website-modules-breeze-studio-pro.js"></script>'
          if tag not in s:
              anchor = '<script src="js/website-modules-banderolas-output-v2.js"></script>'
              if anchor not in s:
                  raise SystemExit('Website Modules anchor not found')
              s = s.replace(anchor, anchor + '\n' + tag, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: QA static contract
        run: |
          set -euo pipefail
          test -f labs/website-modules-source/breeze-studio-pro/index.html
          test -f labs/website-modules-source/breeze-studio-pro/LICENSE
          test -f labs/website-modules-source/breeze-studio-pro/CREDITS.md
          grep -R -q 'Breeze Studio PRO' labs/website-modules-source/breeze-studio-pro
          grep -R -q 'Apply background' labs/website-modules-source/breeze-studio-pro/assets
          grep -R -q 'Apply to cloth' labs/website-modules-source/breeze-studio-pro/assets
          grep -R -q 'Saved' labs/website-modules-source/breeze-studio-pro/assets
          grep -R -q 'Applied' labs/website-modules-source/breeze-studio-pro/assets
          grep -R -q 'Abstract Torus Knot' labs/website-modules-source/breeze-studio-pro/assets
          grep -q 'website-modules-breeze-studio-pro.js' index.html
          node --check js/website-modules-breeze-studio-pro.js
          git diff --check

      - name: Commit candidate
        run: |
          set -euo pipefail
          rm -rf breeze-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/website-modules-breeze-studio-pro.js labs/website-modules-source/breeze-studio-pro
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(web-modules): rebuild Breeze Studio PRO V3 asset pipeline"
          git push origin HEAD:feature/breeze-studio-pro
