name: QA Interactive Boards Casebook

on:
  push:
    branches:
      - feat/interactive-boards-casebook-pro-v1-1

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate final Interactive Boards integration
        shell: bash
        run: |
          set -euo pipefail
          BASE=41ca26ce788667b9a891b839c44477377af01b8e
          EXPECTED_SHA=96d5da228695c4b0d669e45251469608d4f8676e4c27a462654f6724fd780e63
          node --check js/interactive-boards.js
          node --check js/interactive-boards-casebook-pro-v1-1.js
          node --check js/interactive-boards-ui.js
          test "$(sha256sum labs/interactive-boards-source/casebook-pro-v1-1/index.html | awk '{print $1}')" = "$EXPECTED_SHA"
          gzip -dc labs/interactive-boards-source/casebook-pro-v1-1/source.v1.1.html.gz | sha256sum | grep -q "$EXPECTED_SHA"
          grep -q 'id="mode-btn-interactive-boards"' index.html
          grep -q 'id="interactive-boards-stage"' index.html
          grep -q 'deactivateRubikSafely' js/interactive-boards-ui.js
          grep -q 'Website Modules conserva sus 31 módulos sin cambios' README.md
          git diff --check "$BASE"...HEAD
          python3 - <<'PY'
          import subprocess
          expected_product={'README.md','css/main.css','index.html','js/interactive-boards.js','js/interactive-boards-casebook-pro-v1-1.js','js/interactive-boards-ui.js','labs/interactive-boards-source/casebook-pro-v1-1/README.md','labs/interactive-boards-source/casebook-pro-v1-1/index.html','labs/interactive-boards-source/casebook-pro-v1-1/source.v1.1.html.gz'}
          changed=set(subprocess.check_output(['git','diff','--name-only','41ca26ce788667b9a891b839c44477377af01b8e...HEAD'],text=True).splitlines())
          expected_with_qa=expected_product|{'.github/workflows/qa-interactive-boards-casebook.yml'}
          assert changed==expected_with_qa,(changed,expected_with_qa)
          print('Pre-clean QA: producto exacto + 1 workflow temporal')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/qa-interactive-boards-casebook.yml
          git commit -m "ci: remove temporary Interactive Boards QA"
          python3 - <<'PY'
          import subprocess
          expected={'README.md','css/main.css','index.html','js/interactive-boards.js','js/interactive-boards-casebook-pro-v1-1.js','js/interactive-boards-ui.js','labs/interactive-boards-source/casebook-pro-v1-1/README.md','labs/interactive-boards-source/casebook-pro-v1-1/index.html','labs/interactive-boards-source/casebook-pro-v1-1/source.v1.1.html.gz'}
          changed=set(subprocess.check_output(['git','diff','--name-only','41ca26ce788667b9a891b839c44477377af01b8e...HEAD'],text=True).splitlines())
          assert changed==expected,(changed,expected)
          print('QA final: 9 archivos exactos, workflow temporal eliminado')
          PY
          git push origin HEAD:feat/interactive-boards-casebook-pro-v1-1
