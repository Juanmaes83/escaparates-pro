name: Wet Paint donor graft QA

on:
  push:
    branches:
      - chatgpt/museum-wet-paint-donor-graft-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Museum runtime
        working-directory: labs/immersive-worlds
        run: |
          python3 -m http.server 8000 > /tmp/wet-paint-http.log 2>&1 &
          echo $! > /tmp/wet-paint-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/wet-paint-studio.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wet-paint-http.log
          exit 1

      - name: Run Playwright visual QA
        working-directory: labs/immersive-worlds
        env:
          WET_PAINT_URL: http://127.0.0.1:8000/wet-paint-studio.html?authoring=1&world=.%2Fworlds%2Fitinerant-wet-paint-lab.world.json&portalVariant=D
        run: npx playwright test tests/wet-paint-donor-graft.spec.js --browser=chromium --workers=1 --reporter=line

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wet-paint-donor-graft-visual-qa
          path: |
            labs/immersive-worlds/qa-artifacts/wet-paint-donor-graft/**
            labs/immersive-worlds/test-results/**
            /tmp/wet-paint-http.log
          if-no-files-found: warn
          retention-days: 30
