name: TEMP Fix V3 Fashion Texture Compatibility
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab]
    paths: ['.github/workflows/tmp-fix-v3-fashion-texture-compat.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab
          fetch-depth: 0
      - name: Verify isolation and patch compatibility
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-scene-system.js')
          s=p.read_text(encoding='utf-8')
          old="tx.encoding=THREE.sRGBEncoding;tx.needsUpdate=true;tx.userData.fashionOwnedMap=true;return tx;"
          new="tx.encoding=THREE.sRGBEncoding;tx.needsUpdate=true;tx.userData=tx.userData||{};tx.userData.fashionOwnedMap=true;return tx;"
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-scene-system.js
      - name: Commit only Fashion runtime and self-remove
        run: |
          rm .github/workflows/tmp-fix-v3-fashion-texture-compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-scene-system.js .github/workflows/tmp-fix-v3-fashion-texture-compat.yml
          git diff --cached --name-only | sort > /tmp/changed
          printf '%s\n' '.github/workflows/tmp-fix-v3-fashion-texture-compat.yml' 'labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-scene-system.js' | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
          git commit -m 'fix(v3-fashion): support legacy Three texture metadata'
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab
