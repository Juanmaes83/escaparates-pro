name: TEMP Pearl Direct Capture
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-pearl-capture-direct.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
      - name: Capture Three canvas directly
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & sleep 2
          mkdir -p /tmp/q && cd /tmp/q && npm init -y >/dev/null 2>&1 && npm install playwright@latest --silent && npx playwright install --with-deps chromium >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/qa-direct"
          timeout 100s node - <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1720,height:980}});await p.goto('http://127.0.0.1:4173/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html',{waitUntil:'domcontentloaded',timeout:25000});await p.waitForTimeout(5500);const res=await p.evaluate(()=>{const f=document.querySelector('.stage iframe'),a=f?.contentWindow?.CasebookPro;if(!a)return null;const data=a.capturePNG();return {data,stats:a.fashion?.stats?.(),scene:a.fashion?.getState?.()};});if(!res?.data)throw new Error('No direct capture');fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/qa-direct/direct.png',Buffer.from(res.data.split(',')[1],'base64'));fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/qa-direct/state.json',JSON.stringify({stats:res.stats,scene:res.scene},null,2));console.log('DIRECT='+JSON.stringify({bytes:fs.statSync(process.env.GITHUB_WORKSPACE+'/qa-direct/direct.png').size,stats:res.stats}));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: pearl-direct-capture
          path: qa-direct/
      - name: Self-remove
        if: always()
        run: |
          rm -f .github/workflows/tmp-pearl-capture-direct.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-pearl-capture-direct.yml
          git commit -m 'chore(ci): remove temporary Pearl direct capture' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true
