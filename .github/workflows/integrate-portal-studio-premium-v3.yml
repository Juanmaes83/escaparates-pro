name: Integrate Portal Studio Premium V3

on:
  push:
    branches:
      - feature/portal-studio-premium-v3

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Escaparates Pro
        uses: actions/checkout@v4
        with:
          ref: feature/portal-studio-premium-v3
          fetch-depth: 0

      - name: Checkout approved Portal Studio source
        uses: actions/checkout@v4
        with:
          repository: Juanmaes83/finger-frame-effect-ai
          ref: fbbbd5db0f6b85fd0d0288887c03e7350fa85bf5
          path: portal-source

      - name: Preserve approved source package
        shell: bash
        run: |
          set -euo pipefail
          DEST="labs/website-modules-source/portal-studio-premium-v3"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R portal-source/premium-v2 "$DEST/premium-v2"
          cp -R portal-source/premium-v2-1 "$DEST/premium-v2-1"
          cp -R portal-source/premium-v2-1-1 "$DEST/premium-v2-1-1"
          cp -R portal-source/premium-v3 "$DEST/premium-v3"

      - name: Register Portal Studio Premium V3
        shell: bash
        run: |
          cat > js/website-modules-portal-studio-premium-v3.js <<'EOF'
          // Portal Studio Premium V3 — Lucy Live AI. Canonical standalone Website Modules bridge.
          (function() {
              'use strict';
              window.EP = window.EP || {};
              if (!EP.WebsiteModules || !EP.WebsiteModules.register) return;

              var PATH = 'labs/website-modules-source/portal-studio-premium-v3/premium-v3/index.html';

              EP.WebsiteModules.register({
                  id: 'portal-studio-premium-v3',
                  name: 'Portal Studio Premium V3 — Lucy Live AI',
                  icon: 'PS',
                  family: 'Interactive Media / Gesture Portals',
                  description: 'Portal interactivo por gestos con MediaPipe, imagen/video/HLS/WebRTC y Lucy 2.5 realtime AI como proveedor opcional.',
                  sourceFile: 'Juanmaes83/finger-frame-effect-ai · preview-premium-v3 · fbbbd5db0f6b85fd0d0288887c03e7350fa85bf5',
                  mediaMap: 'Camera/gesture video; portal media image/video; screen share; HLS; WebRTC; ORIGINAL/AI/SPLIT; Lucy styles; Preview Clean; PNG/WebM.',
                  standalonePath: PATH,
                  standaloneEditorNote: 'Premium V3 aprobado preservado con su core V2.1.1 y dependencias V2/V2.1. Escaparates Pro solo lo registra como modulo standalone local.',
                  fields: [],
                  build: function() {
                      return '<!doctype html><html><body style="margin:0;background:#000"><iframe src="' + PATH + '" style="position:fixed;inset:0;width:100%;height:100%;border:0" allow="camera;microphone;display-capture;autoplay;fullscreen;clipboard-write" allowfullscreen></iframe></body></html>';
                  }
              });
          })();
          EOF

      - name: Add registry script to Escaparates Pro
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="js/website-modules-breeze-studio-pro.js"></script>\n<script src="js/website-modules-ui.js"></script>'
          replacement = '<script src="js/website-modules-breeze-studio-pro.js"></script>\n<script src="js/website-modules-portal-studio-premium-v3.js"></script>\n<script src="js/website-modules-ui.js"></script>'
          if 'js/website-modules-portal-studio-premium-v3.js' not in s:
              if marker not in s:
                  raise SystemExit('Website Modules script marker not found')
              s = s.replace(marker, replacement, 1)
              p.write_text(s, encoding='utf-8')

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          test -f labs/website-modules-source/portal-studio-premium-v3/premium-v3/index.html
          test -f labs/website-modules-source/portal-studio-premium-v3/premium-v3/lucy-adapter.js
          test -f labs/website-modules-source/portal-studio-premium-v3/premium-v2-1-1/index.html
          test -f labs/website-modules-source/portal-studio-premium-v3/premium-v2-1-1/app.js
          test -f labs/website-modules-source/portal-studio-premium-v3/premium-v2/styles.css
          test -f labs/website-modules-source/portal-studio-premium-v3/premium-v2-1/styles.css
          grep -q '../premium-v2-1-1/index.html' labs/website-modules-source/portal-studio-premium-v3/premium-v3/index.html
          grep -q 'portal-studio-premium-v3' js/website-modules-portal-studio-premium-v3.js
          grep -q 'website-modules-portal-studio-premium-v3.js' index.html
          git diff --check

      - name: Commit integration candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf portal-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/website-modules-source/portal-studio-premium-v3 js/website-modules-portal-studio-premium-v3.js index.html
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat(web-modules): integrate approved Portal Studio Premium V3"
          git push origin HEAD:feature/portal-studio-premium-v3
