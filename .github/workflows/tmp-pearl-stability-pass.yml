name: TEMP Pearl Stability Pass
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-pearl-stability-pass.yml']
permissions:
  contents: write
jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PATCH_B64: ""
      QA_B64: " "
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
          fetch-depth: 0
      - name: Protected baseline gate
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
      - name: Apply isolated stability patch
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-stability.js
          grep -q 'v3-fashion-pearl-stability.js' labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html
          git diff --check
      - name: Browser stability QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          mkdir -p /tmp/pearlqa qa-stability
          cd /tmp/pearlqa
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --silent
          npx playwright install --with-deps chromium >/dev/null
          echo "$QA_B64" | base64 -d > qa.js
          timeout 160s node qa.js
      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: pearl-stability-pass
          path: qa-stability/
      - name: Commit validated stability fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-stability.js
          git commit -m 'fix(v3-fashion): stabilize Pearl scene lifecycle and visibility'
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
      - name: Self-remove temporary workflow
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != "success" ]; then
            git restore labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html 2>/dev/null || true
            rm -f labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-stability.js
          fi
          rm -f .github/workflows/tmp-pearl-stability-pass.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/tmp-pearl-stability-pass.yml
          git commit -m 'chore(ci): remove temporary Pearl stability workflow' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true
