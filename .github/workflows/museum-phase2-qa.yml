name: Museum Phase 2 QA

on:
  pull_request:
    paths:
      - 'labs/immersive-worlds/**'
      - 'tests/museum-phase2.*'
      - 'tests/museum-visitor-phase1.*'
      - '.github/workflows/museum-phase2-qa.yml'
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.53.1
          npx playwright install --with-deps chromium
      - name: Run Phase 1 regression
        run: npx playwright test --config=tests/museum-visitor-phase1.config.mjs
      - name: Run Phase 2 QA
        run: npx playwright test --config=tests/museum-phase2.config.mjs
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: museum-phase2-playwright
          path: |
            tests/museum-phase2-results.json
            tests/museum-visitor-phase1-results.json
            tests/test-results/museum-phase2/
            tests/test-results/museum-visitor-phase1/
          if-no-files-found: warn