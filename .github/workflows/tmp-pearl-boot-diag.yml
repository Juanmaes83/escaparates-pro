name: TEMP Pearl Boot Diagnostic
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-pearl-boot-diag.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
      - name: Run browser diagnostic
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          mkdir -p /tmp/diag
          cp .github/qa-pearl-boot-diag.js /tmp/diag/qa.js
          cd /tmp/diag
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --silent
          npx playwright install --with-deps chromium >/dev/null
          timeout 120s node qa.js
      - name: Cleanup diagnostic
        if: always()
        run: |
          rm -f .github/workflows/tmp-pearl-boot-diag.yml .github/qa-pearl-boot-diag.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/tmp-pearl-boot-diag.yml .github/qa-pearl-boot-diag.js
          git commit -m 'chore(ci): remove temporary Pearl boot diagnostic' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true