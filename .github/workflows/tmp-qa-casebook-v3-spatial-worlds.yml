name: TEMP QA Casebook PRO V3 Spatial Worlds

on:
  push:
    branches:
      - feat/interactive-boards-casebook-pro-v3-clone
    paths:
      - .github/workflows/tmp-qa-casebook-v3-spatial-worlds.yml

permissions:
  contents: write

jobs:
  qa-and-self-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated V3 branch
        uses: actions/checkout@v4
        with:
          ref: feat/interactive-boards-casebook-pro-v3-clone
          fetch-depth: 0

      - name: Fetch master baseline
        run: git fetch origin master:refs/remotes/origin/master

      - name: Verify forbidden baselines untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/master -- \
            labs/interactive-boards-source/casebook-pro-v1-1 \
            labs/interactive-boards-source/casebook-pro-v2 \
            js/interactive-boards-casebook-pro-v1-1.js \
            js/interactive-boards-casebook-pro-v2.js \
            js/interactive-boards.js \
            js/interactive-boards-ui.js \
            css
          echo 'FORBIDDEN_BASELINES_UNTOUCHED=OK'

      - name: Validate V3 runtime and loader
        shell: bash
        run: |
          set -euo pipefail
          V3='labs/interactive-boards-source/casebook-pro-v3/v3-spatial-worlds.js'
          HTML='labs/interactive-boards-source/casebook-pro-v3/index.html'
          test -s "$V3"
          node --check "$V3"
          test "$(grep -o 'src="v3-spatial-worlds.js"' "$HTML" | wc -l | tr -d ' ')" = '1'
          grep -q 'CasebookPro.exportState' "$HTML"
          grep -q 'CasebookPro.importState' "$HTML"
          grep -q 'World Map / Navigator' "$V3"
          grep -q 'Guided Tour' "$V3"
          grep -q 'PORTAL' "$V3"
          grep -q 'INFO' "$V3"
          grep -q 'X %' "$V3"
          grep -q 'Y %' "$V3"
          echo 'V3_RUNTIME_SYNTAX=OK'
          echo 'V3_LOADER_EXACTLY_ONCE=OK'
          echo 'V3_CORE_FEATURE_MARKERS=OK'

      - name: Verify branch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only origin/master...HEAD | sort
          BAD="$(git diff --name-only origin/master...HEAD | grep -Ev '^(index.html|js/interactive-boards-casebook-pro-v3.js|labs/interactive-boards-source/casebook-pro-v3/|\.github/workflows/tmp-qa-casebook-v3-spatial-worlds.yml$)' || true)"
          test -z "$BAD" || { echo "Unexpected paths:"; echo "$BAD"; exit 31; }
          echo 'BRANCH_SCOPE=OK'

      - name: Remove temporary workflow and commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-qa-casebook-v3-spatial-worlds.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ci): remove temporary V3 QA workflow'
          git push origin HEAD:feat/interactive-boards-casebook-pro-v3-clone
