name: Integrate Sketchbook PRO V3

on:
  push:
    branches:
      - feature/sketchbook-pro-v3
    paths:
      - '.github/workflows/integrate-sketchbook-v3.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sketchbook-pro-v3
          fetch-depth: 0

      - name: Materialize and patch
        run: python .github/scripts/integrate_sketchbook_v3.py

      - name: Syntax and integration checks
        run: |
          node --check js/website-modules-ui.js
          node --check js/website-modules-sketchbook-pro-v3.js
          python -c "from pathlib import Path; import hashlib; p=Path('labs/website-modules-source/sketchbook-pro-v3/index.html'); d=p.read_bytes(); assert hashlib.sha256(d).hexdigest() == '837fac4414bbd8b7eb2dbdac8514a5d40429e30e76647b942f7a477da8ed3ee6'; t=d.decode('utf-8'); [(_ for _ in ()).throw(AssertionError(x)) if x not in t else None for x in ['downloadFinalHtmlBtn','downloadClientZipBtn','copyEmbedBtn','publishPreviewBtn','recordClientReviewBtn','data-final-viewer']]; print('Integration checks OK')"

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/integrate-sketchbook-v3.yml .github/scripts/integrate_sketchbook_v3.py .github/tmp/sketchbook-v3.part*
          git add README.md js/website-modules-ui.js labs/website-modules-source/sketchbook-pro-v3/index.html labs/website-modules-source/sketchbook-pro-v3/source.v3.html.gz
          git commit -m "feat(web-modules): integrate approved Sketchbook PRO V3"
          git push origin HEAD:feature/sketchbook-pro-v3
