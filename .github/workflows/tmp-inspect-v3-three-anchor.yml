name: TEMP Inspect V3 Three Anchor
on:
  push:
    branches: [feat/casebook-pro-v3-p0-technical-hardening]
    paths: ['.github/workflows/tmp-inspect-v3-three-anchor.yml']
permissions:
  contents: write
jobs:
  inspect-and-self-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-p0-technical-hardening
          fetch-depth: 0
      - name: Decode embedded canonical source and inspect picking internals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,base64
          p=Path('labs/interactive-boards-source/casebook-pro-v3/index.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'const EMBEDDED_CASEBOOK_B64\s*=\s*"([A-Za-z0-9+/=]+)"',s)
          if not m:
              m=re.search(r'EMBEDDED_CASEBOOK_B64\s*=\s*"([A-Za-z0-9+/=]+)"',s)
          assert m, 'embedded base64 not found'
          src=base64.b64decode(m.group(1)).decode('utf-8')
          Path('/tmp/casebook.html').write_text(src,encoding='utf-8')
          print('DECODED_BYTES',len(src.encode()))
          for pat in ['hitMeshes','Raycaster','raycaster','intersectObjects','pointerdown','mousedown','touchstart','renderer.domElement','canvasEl','clientX','camera =','const camera','let camera','new THREE','getWorldPosition','worldToLocal','localToWorld']:
              print('\n===',pat,'===')
              for mm in list(re.finditer(re.escape(pat),src,re.I))[:8]:
                  a=max(0,mm.start()-500);b=min(len(src),mm.end()+900)
                  print(src[a:b].replace('\n',' ')[:1500])
          PY
      - name: Self remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-inspect-v3-three-anchor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ci): remove temporary V3 Three anchor inspection'
          git push origin HEAD:feat/casebook-pro-v3-p0-technical-hardening
