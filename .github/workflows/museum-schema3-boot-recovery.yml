name: Museum Schema3 Boot Recovery Gate

on:
  push:
    branches:
      - repair/museum-control-recovery-v1
  workflow_dispatch:

jobs:
  schema3-persisted-config-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run persisted Schema 3 boot regression
        run: node labs/immersive-worlds/qa/tools/studio-schema3-boot-regression.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: museum-schema3-boot-evidence
          path: output/playwright/studio-schema3-boot-regression.png
          if-no-files-found: warn
