name: TEMP Add V3 Fashion Black Runway Starter
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab]
    paths: ['.github/workflows/tmp-add-v3-fashion-starter.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab
          fetch-depth: 0
      - name: Add isolated Fashion starter logic
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-scene-system.js')
          s=p.read_text(encoding='utf-8')
          needle='function markLab(){\n'
          insert="""async function waitFor(fn,tries=80,ms=100){for(let i=0;i<tries;i++){try{const v=fn();if(v)return v}catch(_){ }await new Promise(r=>setTimeout(r,ms))}return null}\nasync function seedFashionStarter(force=false){\n  const w=window.CasebookProV3?.getWorld?.();\n  const count=api()?.exportState?.()?.items?.length||0;\n  const pristine=!!w&&w.name==='Untitled Spatial World'&&w.chapters?.length===1&&count===0;\n  const key='casebook-v3-fashion-starter-seeded-v2';\n  if(!force&&(!pristine||localStorage.getItem(key)))return false;\n  const preset=q('#preset'),load=q('#loadPresetBtn');if(!preset||!load)return false;\n  localStorage.setItem(key,'loading');\n  preset.value='fashion';preset.dispatchEvent(new Event('change',{bubbles:true}));load.click();\n  const loaded=await waitFor(()=>{const a=api(),n=a?.exportState?.()?.items?.length||0;return a&&n>=8?a:null},100,120);\n  if(!loaded){localStorage.removeItem(key);return false}\n  const name=q('#v3WorldName');if(name){name.value='AFTER DARK / FW26';name.dispatchEvent(new Event('change',{bubbles:true}))}\n  window.CasebookProV3?.save?.();\n  loaded.fashion?.apply?.();loaded.fashion?.setShot?.('OVERVIEW');\n  localStorage.setItem(key,'ready');\n  setTimeout(()=>{window.CasebookProV3?.save?.();enhanceInspector()},350);\n  return true;\n}\n\n"""
          assert s.count(needle)==1,s.count(needle)
          s=s.replace(needle,insert+needle,1)
          old='<div class="flToggleRow"><button class="flToggle" id="flRefresh">Refresh objects</button><button class="flToggle" id="flFrameSelected">Frame selected</button></div>'
          new=old+'<div class="flToggleRow"><button class="flToggle" id="flStarter" style="flex:2">Reload Black Runway Starter</button></div>'
          assert s.count(old)==1,s.count(old)
          s=s.replace(old,new,1)
          oldbind="  const frame=q('#flFrameSelected',root);if(frame)frame.onclick=()=>{const sel=selected();sceneApi()?.setShot?.('DETAIL',sel?.id||null);if(shot)shot.value='DETAIL';q('#flShotRead',root).textContent='DETAIL'};"
          newbind=oldbind+"\n  const starter=q('#flStarter',root);if(starter)starter.onclick=async()=>{starter.disabled=true;starter.textContent='Loading Fashion Starter…';await seedFashionStarter(true);starter.textContent='Reload Black Runway Starter';starter.disabled=false};"
          assert s.count(oldbind)==1,s.count(oldbind)
          s=s.replace(oldbind,newbind,1)
          bootold="  window.CasebookFashionLab={version:LAB_VERSION,semanticTypes:SEMANTIC_TYPES.slice(),relationshipTypes:RELATION_TYPES.slice(),scenes:{...SCENES},sceneApi};"
          bootnew=bootold+"\n  setTimeout(()=>seedFashionStarter(false).catch(e=>console.warn('[Fashion Lab] starter seed skipped',e)),900);"
          assert s.count(bootold)==1,s.count(bootold)
          s=s.replace(bootold,bootnew,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-scene-system.js
          grep -q 'seedFashionStarter' labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-scene-system.js
      - name: Commit only Fashion runtime and self-remove
        run: |
          rm .github/workflows/tmp-add-v3-fashion-starter.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-scene-system.js .github/workflows/tmp-add-v3-fashion-starter.yml
          git diff --cached --name-only | sort >/tmp/changed
          printf '%s\n' '.github/workflows/tmp-add-v3-fashion-starter.yml' 'labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-scene-system.js' | sort >/tmp/allowed
          diff -u /tmp/allowed /tmp/changed
          git commit -m 'feat(v3-fashion): seed Black Runway from Fashion Creative Room'
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-spatial-scene-lab
