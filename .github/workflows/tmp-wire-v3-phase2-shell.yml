name: TEMP Wire V3 Phase2 Editorial Shell
on:
  push:
    branches: [feat/casebook-pro-v3-phase2-editorial-spatial-studio]
    paths: ['.github/workflows/tmp-wire-v3-phase2-shell.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase2-editorial-spatial-studio
          fetch-depth: 0
      - name: Verify frozen baselines
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
      - name: Wire shell safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('labs/interactive-boards-source/casebook-pro-v3/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="v3-editorial-spatial-shell.css">\n'
          js='<script src="v3-editorial-spatial-shell.js"></script>\n'
          assert s.count(css)==0
          assert s.count(js)==0
          assert s.count('</head>')==1
          marker='<script src="v3-spatial-worlds-p0.js"></script>\n'
          assert s.count(marker)==1
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace(marker,marker+js,1)
          s=s.replace('<title>CASEBOOK PRO V2 — Spatial Storytelling System</title>','<title>CASEBOOK PRO V3 — Editorial Spatial Studio</title>',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -c 'v3-editorial-spatial-shell.css' labs/interactive-boards-source/casebook-pro-v3/index.html | grep -x 1
          grep -c 'v3-editorial-spatial-shell.js' labs/interactive-boards-source/casebook-pro-v3/index.html | grep -x 1
          node --check labs/interactive-boards-source/casebook-pro-v3/v3-editorial-spatial-shell.js
      - name: Commit and self remove
        run: |
          git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
          rm .github/workflows/tmp-wire-v3-phase2-shell.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(v3): wire Editorial Spatial Studio shell'
          git push origin HEAD:feat/casebook-pro-v3-phase2-editorial-spatial-studio
