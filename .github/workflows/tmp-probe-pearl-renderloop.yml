name: TEMP Probe Pearl Render Loop
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-probe-pearl-renderloop.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
      - name: Inspect render loop source
        run: |
          FILE='labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html'
          grep -n -E 'renderer\.render|requestAnimationFrame|WebGLRenderer|EffectComposer' "$FILE" | tail -80
      - name: Self-remove
        if: always()
        run: |
          rm -f .github/workflows/tmp-probe-pearl-renderloop.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-probe-pearl-renderloop.yml
          git commit -m 'chore(ci): remove temporary Pearl render-loop probe' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true
