name: TEMP Pearl Visual Stability
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-pearl-visual-stability.yml']
permissions:
  contents: write
jobs:
  visual-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
          fetch-depth: 0
      - name: Protected baseline gate
        run: git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
      - name: Wire stability runtime
        run: python3 -c "from pathlib import Path; p=Path('labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html'); s=p.read_text(encoding='utf-8'); tag='<script src=\"./v3-fashion-pearl-stability.js\"></script>'; p.write_text(s if tag in s else s.replace('</body>',tag+'\n</body>',1),encoding='utf-8')"
      - name: Syntax check
        run: node --check labs/interactive-boards-source/casebook-pro-v3-fashion-lab/v3-fashion-pearl-stability.js
      - name: Browser visual stability QA
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 & sleep 2; mkdir -p /tmp/pearlqa qa-stability; cp .github/qa-pearl-visual-core.js /tmp/pearlqa/qa.js; cd /tmp/pearlqa; npm init -y >/dev/null 2>&1; npm install playwright@latest --silent; npx playwright install --with-deps chromium >/dev/null; timeout 160s node qa.js
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: pearl-visual-stability-final
          path: qa-stability/
      - name: Commit validated wiring
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html && git commit -m 'fix(v3-fashion): wire validated Pearl stability runtime' && git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
      - name: Cleanup temporary QA
        if: always()
        run: rm -f .github/workflows/tmp-pearl-visual-stability.yml .github/qa-pearl-visual-core.js; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add -A .github/workflows/tmp-pearl-visual-stability.yml .github/qa-pearl-visual-core.js; git commit -m 'chore(ci): remove temporary Pearl visual QA' || true; git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true
