          .ib-catalog-meta span { color:var(--text-dim); } .ib-catalog-meta strong { color:var(--text); font:700 10px var(--mono); }
          .ib-open-direct { display:block; margin-top:12px; padding:9px 10px; border:1px solid var(--border); border-radius:7px; color:var(--text-dim); text-decoration:none; font-size:10px; text-align:center; }
          .ib-open-direct:hover { color:var(--text); border-color:var(--border-hover); }
          body.mode-interactive-boards #canvas-container,body.mode-interactive-boards #timeline-bar,body.mode-interactive-boards #effects-panel,body.mode-interactive-boards #properties-panel,body.mode-interactive-boards #scroll-sections-stage,body.mode-interactive-boards #rubik-tools-stage,body.mode-interactive-boards #website-modules-stage,body.mode-interactive-boards #sector-blueprints-stage,body.mode-interactive-boards #source-labs-stage { display:none!important; }
          body.mode-interactive-boards .top-center,body.mode-interactive-boards #btn-safe-zone,body.mode-interactive-boards #btn-copy-code,body.mode-interactive-boards #btn-capture-frame,body.mode-interactive-boards #btn-export { display:none!important; }
