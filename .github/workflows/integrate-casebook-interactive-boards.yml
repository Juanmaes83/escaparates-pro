name: Integrate Casebook PRO V1.1 Interactive Boards

on:
  push:
    branches:
      - feat/interactive-boards-casebook-pro-v1-1

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Escaparates Pro branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact approved Casebook standalone
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/casebook-src
          git clone --depth 1 --branch feat/casebook-pro-v1-1-standalone https://github.com/Juanmaes83/casebook.git /tmp/casebook-src
          cd /tmp/casebook-src
          cat pro-build/chunk.* | base64 -d | gzip -dc > /tmp/template.raw.html
          test -s /tmp/template.raw.html

          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('/tmp/template.raw.html')
          s=p.read_text(encoding='utf-8')
          assert s.count('\\\\n') == 5, s.count('\\\\n')
          s=s.replace('\\\\n','\\n')
          assert s.count('\\\\n') == 0
          db_start=s.find('function db(){')
          db_end=s.find('function decodeEmbeddedSource(){',db_start)
          assert db_start>=0 and db_end>db_start
          db_block='''const __MEM_MEDIA_DB=new Map();
          let __IDB_DISABLED=false;
          function db(){
           return new Promise((resolve)=>{
            if(__IDB_DISABLED || !window.indexedDB){resolve(null);return;}
            try{
             const q=indexedDB.open(DB_NAME,1);
             q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(DB_STORE))q.result.createObjectStore(DB_STORE)};
             q.onsuccess=()=>resolve(q.result);
             q.onerror=()=>{__IDB_DISABLED=true;resolve(null)};
             q.onblocked=()=>{__IDB_DISABLED=true;resolve(null)};
            }catch(e){__IDB_DISABLED=true;resolve(null)}
           });
          }
          async function dbPut(k,v){
           const d=await db();if(!d){__MEM_MEDIA_DB.set(k,v);return;}
           try{return await new Promise((r,j)=>{const t=d.transaction(DB_STORE,"readwrite");t.objectStore(DB_STORE).put(v,k);t.oncomplete=()=>r();t.onerror=()=>j(t.error)})}
           catch(e){__IDB_DISABLED=true;__MEM_MEDIA_DB.set(k,v)}
          }
          async function dbGet(k){
           if(__MEM_MEDIA_DB.has(k))return __MEM_MEDIA_DB.get(k);
           const d=await db();if(!d)return null;
           try{return await new Promise((r,j)=>{const t=d.transaction(DB_STORE,"readonly"),q=t.objectStore(DB_STORE).get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>j(q.error)})}
           catch(e){__IDB_DISABLED=true;return __MEM_MEDIA_DB.get(k)||null}
          }
          async function dbDel(k){
           __MEM_MEDIA_DB.delete(k);const d=await db();if(!d)return;
           try{return await new Promise((r,j)=>{const t=d.transaction(DB_STORE,"readwrite");t.objectStore(DB_STORE).delete(k);t.oncomplete=()=>r();t.onerror=()=>j(t.error)})}
           catch(e){__IDB_DISABLED=true}
          }

          '''
          db_block=textwrap.dedent(db_block)
          s=s[:db_start]+db_block+s[db_end:]
          old_get='const saved=localStorage.getItem(CONFIG_CACHE);if(saved)'
          new_get='let saved=null;try{saved=localStorage.getItem(CONFIG_CACHE)}catch(e){}if(saved)'
          assert s.count(old_get)==1
          s=s.replace(old_get,new_get,1)
          old_set='localStorage.setItem(CONFIG_CACHE,JSON.stringify(o))'
          new_set='try{localStorage.setItem(CONFIG_CACHE,JSON.stringify(o))}catch(e){}'
          assert s.count(old_set)==1
          s=s.replace(old_set,new_set,1)
          Path('/tmp/template.html').write_text(s,encoding='utf-8')
          PY

          curl --fail --location --retry 3 https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o /tmp/three.min.js
          curl --fail --location --retry 3 https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js -o /tmp/gsap.min.js
          curl --fail --location --retry 3 https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js -o /tmp/jszip.min.js

          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          template=Path('/tmp/template.html').read_text(encoding='utf-8')
          source_bytes=Path('/tmp/casebook-src/index.html').read_bytes()
          source=source_bytes.decode('utf-8')
          assert 'CASEBOOK v2 — Blackwood Dossier' in source
          canonical_sha=hashlib.sha256(source_bytes).hexdigest()
          three=Path('/tmp/three.min.js').read_text(encoding='utf-8')
          gsap=Path('/tmp/gsap.min.js').read_text(encoding='utf-8')
          jszip=Path('/tmp/jszip.min.js').read_text(encoding='utf-8')
          def safe_script(js): return js.replace('</script','<\\/script')
          three_tag='<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>'
          gsap_tag='<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>'
          jszip_tag='<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>'
          assert source.count(three_tag)==1
          assert source.count(gsap_tag)==1
          assert template.count(jszip_tag)==1
          runtime_source=source.replace(three_tag,'<script>'+safe_script(three)+'</script>')
          runtime_source=runtime_source.replace(gsap_tag,'<script>'+safe_script(gsap)+'</script>')
          template=template.replace(jszip_tag,'<script>'+safe_script(jszip)+'</script>')
          source_b64=base64.b64encode(runtime_source.encode('utf-8')).decode('ascii')
          assert template.count('__EMBEDDED_CASEBOOK_B64__')==1
          assert template.count('__EMBEDDED_CASEBOOK_SHA256__')==1
          out=template.replace('__EMBEDDED_CASEBOOK_B64__',source_b64).replace('__EMBEDDED_CASEBOOK_SHA256__',canonical_sha)
          required=['Cargar demo visual completa','Detective / Investigation','Campaign 360','Fashion Campaign','Project / Tasks','Strategy / Presentation','casebook-pro-v1-1-media','function __drawDemoArt','casebookProConnectionLabels','__MEM_MEDIA_DB','downloadHtmlBtn','downloadZipBtn','copyEmbedBtn','previewBtn','pngBtn','reviewBtn']
          for token in required: assert token in out, token
          assert 'cdnjs.cloudflare.com/ajax/libs/three.js' not in out
          assert 'cdnjs.cloudflare.com/ajax/libs/gsap' not in out
          assert 'cdnjs.cloudflare.com/ajax/libs/jszip' not in out
          target=Path('/tmp/casebook-approved.html')
          target.write_text(out,encoding='utf-8')
          sha=hashlib.sha256(target.read_bytes()).hexdigest()
          expected='96d5da228695c4b0d669e45251469608d4f8676e4c27a462654f6724fd780e63'
          print('casebook_sha256='+sha)
          print('casebook_bytes='+str(target.stat().st_size))
          assert sha==expected,(sha,expected)
          PY

      - name: Add Interactive Boards architecture and Casebook module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, gzip, textwrap
          expected='96d5da228695c4b0d669e45251469608d4f8676e4c27a462654f6724fd780e63'
          approved=Path('/tmp/casebook-approved.html').read_bytes()
          assert hashlib.sha256(approved).hexdigest()==expected
          module_dir=Path('labs/interactive-boards-source/casebook-pro-v1-1')
          module_dir.mkdir(parents=True,exist_ok=True)
          (module_dir/'index.html').write_bytes(approved)
          with open(module_dir/'source.v1.1.html.gz','wb') as raw:
              with gzip.GzipFile(filename='',mode='wb',fileobj=raw,compresslevel=9,mtime=0) as gz:
                  gz.write(approved)

          (module_dir/'README.md').write_text(textwrap.dedent('''\
          # Casebook PRO — Creative Campaign Board V1.1

          Primer módulo de la familia **Interactive Boards** de Escaparates Pro.

          ## Identidad

          - Module ID: `casebook-pro-v1-1`
          - Familia: `Interactive Boards`
          - Versión aprobada: `V1.1`
          - Fuente canónica: `index.html`
          - SHA-256 canónico: `96d5da228695c4b0d669e45251469608d4f8676e4c27a462654f6724fd780e63`
          - Preservación: `source.v1.1.html.gz`
          - Proyecto origen: `Juanmaes83/casebook`

          ## Arquitectura

          Casebook PRO no se reimplementa dentro del motor general de Escaparates Pro. Se ejecuta en un **iframe aislado** dentro del modo de primer nivel `Interactive Boards`, manteniendo independiente su runtime Three.js, GSAP, física de cuerdas, estado, editor y pipeline de exportación.

          El standalone aprobado es autosuficiente: incorpora Casebook, Three.js, GSAP y JSZip dentro del propio HTML. Esto evita conflictos con la versión global de Three.js utilizada por el modo Efectos.

          ## Presets visuales incluidos

          - Detective / Investigation — Blackwood Dossier completo.
          - Campaign 360.
          - Fashion Campaign.
          - Project / Tasks.
          - Strategy / Presentation.

          Cada preset carga una demostración visual completa con tarjetas, metadatos y conexiones, no únicamente un cambio de labels.

          ## Capacidades V1.1

          - Identidad: logo, proyecto, código y branding.
          - Colores de UI, pins y threads.
          - Board: cork, color, imagen o vídeo.
          - Background: color, imagen o vídeo.
          - Tarjetas generalizadas con texto editable.
          - Imagen y vídeo dentro de tarjetas.
          - Tags, notas, status, fecha, owner y metadata.
          - Conexiones con label, color y strength.
          - Inspector configurable.
          - Timeline, Graph View, lasso y minimap.
          - Física original y Undo/Redo preservados.
          - JSON Export + Import.
          - HTML, ZIP, Embed, Preview, PNG y Review Recording.
          - Viewer final cerrado sin panel de personalización.

          ## Media y persistencia

          Los medios pesados utilizan IndexedDB/Blob/ObjectURL. Para apertura local mediante `file://`, V1.1 incluye fallback de memoria si IndexedDB o localStorage están restringidos por el navegador.

          ## Integración en Escaparates Pro

          La plataforma registra Casebook mediante `js/interactive-boards-casebook-pro-v1-1.js` y lo abre desde `js/interactive-boards-ui.js` dentro de `#interactive-boards-stage`.

          `Interactive Boards` es una categoría de primer nivel independiente de Efectos, Scroll Sections, Website Modules Lab, Sector Blueprints, Source Labs y RUBIK SOTA. Website Modules conserva sus 31 módulos actuales sin cambios.

          ## Regla de evolución

          V1.1 queda congelada como fuente aprobada. Las ampliaciones posteriores deben entrar como versiones nuevas y no modificar silenciosamente este archivo canónico.
          '''),encoding='utf-8')

          Path('js/interactive-boards.js').write_text(textwrap.dedent('''\
          // Escaparates Pro — Interactive Boards registry.
          (function() {
              'use strict';
              window.EP = window.EP || {};
              var BOARDS = Object.create(null);
              function register(board) {
                  if (!board || !board.id) throw new Error('Interactive Board requires id');
                  BOARDS[board.id] = board;
                  return board;
              }
              function get(id) { return BOARDS[id] || null; }
              function getAll() { return Object.keys(BOARDS).map(function(id) { return BOARDS[id]; }); }
              EP.InteractiveBoards = { register: register, get: get, getAll: getAll };
          })();
          '''),encoding='utf-8')

          Path('js/interactive-boards-casebook-pro-v1-1.js').write_text(textwrap.dedent('''\
          // Casebook PRO V1.1 — first Interactive Boards module.
          (function() {
              'use strict';
              window.EP = window.EP || {};
              if (!EP.InteractiveBoards || !EP.InteractiveBoards.register) return;
              var PATH = 'labs/interactive-boards-source/casebook-pro-v1-1/index.html';
              EP.InteractiveBoards.register({
                  id: 'casebook-pro-v1-1',
                  name: 'Casebook PRO — Creative Campaign Board V1.1',
                  shortName: 'Casebook PRO V1.1',
                  icon: 'CB',
                  family: 'Interactive Boards / Creative Systems',
                  description: 'Board 3D conectado para investigación, campañas 360, moda, proyectos y presentaciones estratégicas.',
                  path: PATH,
                  sourceFile: PATH,
                  sha256: '96d5da228695c4b0d669e45251469608d4f8676e4c27a462654f6724fd780e63',
                  presets: ['Detective / Investigation','Campaign 360','Fashion Campaign','Project / Tasks','Strategy / Presentation'],
                  outputs: ['HTML','ZIP','Embed','Preview','PNG','Review Recording']
              });
          })();
          '''),encoding='utf-8')

          Path('js/interactive-boards-ui.js').write_text(textwrap.dedent('''\
          // Escaparates Pro — Interactive Boards first-level workspace.
          (function() {
              'use strict';
              window.EP = window.EP || {};
              var state = { active: false, activeId: null };
              function board() { return EP.InteractiveBoards && state.activeId ? EP.InteractiveBoards.get(state.activeId) : null; }
              function frame() { return document.getElementById('interactive-boards-frame'); }
              function stage() { return document.getElementById('interactive-boards-stage'); }
              function renderCatalog() {
                  var catalog = document.getElementById('interactive-boards-catalog');
                  if (!catalog || !EP.InteractiveBoards) return;
                  var boards = EP.InteractiveBoards.getAll();
                  catalog.innerHTML = '';
                  var head = document.createElement('div');
                  head.className = 'ib-catalog-head';
                  head.innerHTML = '<span>ESCAPARATES PRO</span><strong>Interactive Boards</strong><small>' + boards.length + ' board' + (boards.length === 1 ? '' : 's') + '</small>';
                  catalog.appendChild(head);
                  var list = document.createElement('div');
                  list.className = 'ib-catalog-list';
                  boards.forEach(function(item) {
                      var card = document.createElement('button');
                      card.type = 'button';
                      card.className = 'ib-board-card' + (item.id === state.activeId ? ' active' : '');
                      card.setAttribute('data-interactive-board', item.id);
                      card.innerHTML = '<span class="ib-board-icon">' + item.icon + '</span><span class="ib-board-copy"><strong>' + item.shortName + '</strong><small>' + item.description + '</small></span>';
                      card.addEventListener('click', function() { select(item.id); });
                      list.appendChild(card);
                  });
                  catalog.appendChild(list);
                  var current = board();
                  if (current) {
                      var meta = document.createElement('div');
                      meta.className = 'ib-catalog-meta';
                      meta.innerHTML = '<span>Presets</span><strong>' + current.presets.length + '</strong><span>Outputs</span><strong>' + current.outputs.length + '</strong>';
                      catalog.appendChild(meta);
                      var open = document.createElement('a');
                      open.className = 'ib-open-direct';
                      open.href = current.path;
                      open.target = '_blank';
                      open.rel = 'noopener';
                      open.textContent = 'Abrir módulo directo ↗';
                      catalog.appendChild(open);
                  }
              }
              function select(id) {
                  if (!EP.InteractiveBoards) return;
                  var item = EP.InteractiveBoards.get(id);
                  if (!item) return;
                  state.activeId = id;
                  renderCatalog();
                  var target = frame();
                  if (!target) return;
                  if (target.getAttribute('data-board-id') !== id) {
                      target.setAttribute('data-board-id', id);
                      target.src = item.path;
                  }
              }
              function clearOtherModeButtons() {
                  ['mode-btn-effects','mode-btn-scroll-sections','mode-btn-website-modules','mode-btn-sector-blueprints','mode-btn-source-labs','mode-btn-rubik-tools'].forEach(function(id) {
                      var el = document.getElementById(id); if (el) el.classList.remove('active');
                  });
              }
              function deactivateOtherModes() {
                  try { if (EP.WebsiteModulesUI && EP.WebsiteModulesUI.deactivate) EP.WebsiteModulesUI.deactivate(); } catch (e) {}
                  try { if (EP.SectorBlueprintsUI && EP.SectorBlueprintsUI.deactivate) EP.SectorBlueprintsUI.deactivate(); } catch (e) {}
                  try { if (EP.SourceLabsUI && EP.SourceLabsUI.deactivate) EP.SourceLabsUI.deactivate(); } catch (e) {}
                  try { if (EP.ScrollSectionsUI && EP.ScrollSectionsUI.setMode) EP.ScrollSectionsUI.setMode('effects'); } catch (e) {}
                  document.body.classList.remove('mode-rubik-tools','mode-website-modules','mode-sector-blueprints','mode-source-labs','mode-scroll-sections');
                  var rubikStage = document.getElementById('rubik-tools-stage'); if (rubikStage) rubikStage.classList.remove('active');
                  clearOtherModeButtons();
              }
              function activate() {
                  if (state.active) return;
                  state.active = true;
                  deactivateOtherModes();
                  document.body.classList.add('mode-interactive-boards');
                  var targetStage = stage(); if (targetStage) targetStage.classList.add('active');
                  var button = document.getElementById('mode-btn-interactive-boards'); if (button) button.classList.add('active');
                  if (EP.Timeline && EP.Timeline.pause) EP.Timeline.pause();
                  if (!state.activeId) {
                      var first = EP.InteractiveBoards && EP.InteractiveBoards.getAll()[0]; if (first) select(first.id);
                  } else { renderCatalog(); select(state.activeId); }
              }
              function deactivate() {
                  if (!state.active) return;
                  state.active = false;
                  document.body.classList.remove('mode-interactive-boards');
                  var targetStage = stage(); if (targetStage) targetStage.classList.remove('active');
                  var button = document.getElementById('mode-btn-interactive-boards'); if (button) button.classList.remove('active');
              }
              function init() {
                  var button = document.getElementById('mode-btn-interactive-boards');
                  if (!button || !EP.InteractiveBoards) return;
                  button.addEventListener('click', activate);
                  ['mode-btn-effects','mode-btn-scroll-sections','mode-btn-website-modules','mode-btn-sector-blueprints','mode-btn-source-labs','mode-btn-rubik-tools'].forEach(function(id) {
                      var other = document.getElementById(id); if (other) other.addEventListener('click', deactivate);
                  });
                  renderCatalog();
              }
              EP.InteractiveBoardsUI = { init: init, activate: activate, deactivate: deactivate, select: select };
              if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
          })();
          '''),encoding='utf-8')

          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          stage_anchor='    <div id="website-modules-stage">\n        <iframe id="wm-preview-frame" title="Vista previa Website Module"></iframe>\n    </div>\n    <div id="sector-blueprints-stage">'
          stage_insert='    <div id="website-modules-stage">\n        <iframe id="wm-preview-frame" title="Vista previa Website Module"></iframe>\n    </div>\n\n    <!-- Interactive Boards: complete connected visual workspaces, isolated in their own iframe -->\n    <div id="interactive-boards-stage">\n        <div id="interactive-boards-catalog" aria-label="Interactive Boards"></div>\n        <div id="interactive-boards-frame-wrap">\n            <iframe id="interactive-boards-frame" title="Interactive Board" allow="autoplay; fullscreen; display-capture; clipboard-write" allowfullscreen></iframe>\n        </div>\n    </div>\n    <div id="sector-blueprints-stage">'
          assert s.count(stage_anchor)==1, s.count(stage_anchor)
          s=s.replace(stage_anchor,stage_insert,1)
          source_btn='                <button class="mode-btn" data-mode="source-labs" id="mode-btn-source-labs" title="Experiencias fuente completas aisladas">Source Labs</button>\n'
          assert s.count(source_btn)==1, s.count(source_btn)
          boards_btn='                <button class="mode-btn" data-mode="interactive-boards" id="mode-btn-interactive-boards" title="Interactive Boards: tableros visuales conectados y presentaciones espaciales">Boards</button>\n'
          s=s.replace(source_btn,source_btn+boards_btn,1)
          script_anchor='    <script src="js/source-labs-ui.js"></script>\n'
          assert s.count(script_anchor)==1, s.count(script_anchor)
          scripts='    <script src="js/interactive-boards.js"></script>\n    <script src="js/interactive-boards-casebook-pro-v1-1.js"></script>\n    <script src="js/interactive-boards-ui.js"></script>\n'
          s=s.replace(script_anchor,script_anchor+scripts,1)
          index.write_text(s,encoding='utf-8')

          css=Path('css/main.css')
          c=css.read_text(encoding='utf-8')
          marker='/* Interactive Boards — first-level isolated creative workspaces */'
