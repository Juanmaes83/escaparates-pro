          .ib-catalog-head { padding:6px 4px 14px; border-bottom:1px solid var(--border); margin-bottom:10px; }
          .ib-catalog-head span,.ib-catalog-head small { display:block; color:var(--text-dim); font:600 9px var(--mono); letter-spacing:.12em; text-transform:uppercase; }
          .ib-catalog-head strong { display:block; margin:5px 0; color:var(--text); font-size:15px; }
