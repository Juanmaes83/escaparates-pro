          .ib-board-card:hover { border-color:var(--border-hover); background:rgba(255,255,255,.05); }
          .ib-board-card.active { border-color:rgba(79,140,255,.52); background:rgba(79,140,255,.12); box-shadow:inset 0 0 0 1px rgba(79,140,255,.08); }
          .ib-board-icon { width:34px; height:34px; flex:0 0 34px; border-radius:7px; display:grid; place-items:center; background:#0b0b0e; border:1px solid rgba(255,255,255,.1); font:800 10px var(--mono); }
          .ib-board-copy { min-width:0; }
