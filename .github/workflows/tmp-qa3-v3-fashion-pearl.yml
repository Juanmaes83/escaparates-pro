name: TEMP QA3 V3 Fashion Pearl
on:
  push:
    branches: [feat/casebook-pro-v3-phase3-fashion-pearl-cinematic]
    paths: ['.github/workflows/tmp-qa3-v3-fashion-pearl.yml']
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casebook-pro-v3-phase3-fashion-pearl-cinematic
          fetch-depth: 0
      - name: Protected baseline gate
        run: git diff --exit-code origin/master -- labs/interactive-boards-source/casebook-pro-v1-1 labs/interactive-boards-source/casebook-pro-v2 js/interactive-boards-casebook-pro-v1-1.js js/interactive-boards-casebook-pro-v2.js js/interactive-boards.js js/interactive-boards-ui.js css
      - name: Prepare Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          mkdir -p /tmp/q && cd /tmp/q
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: State then visual QA
        run: |
          cd /tmp/q
          timeout 90s node <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),assert=require('assert');
          (async()=>{
            const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1720,height:980}});const logs=[];
            p.on('pageerror',e=>{logs.push('PAGEERROR '+e.message);console.log('PAGEERROR',e.message)});p.on('console',m=>{if(m.type()==='error'){logs.push('CONSOLE '+m.text());console.log('CONSOLE',m.text())}});
            const out=process.env.GITHUB_WORKSPACE+'/qa-pearl';fs.mkdirSync(out,{recursive:true});
            await p.goto('http://127.0.0.1:4173/labs/interactive-boards-source/casebook-pro-v3-fashion-lab/index.html',{waitUntil:'domcontentloaded',timeout:25000});await p.waitForTimeout(5000);
            const state=await p.evaluate(()=>{const f=document.querySelector('.stage iframe'),a=f?.contentWindow?.CasebookPro;return {shell:!!document.querySelector('#esShell'),body:[...document.body.classList],api:!!a,fashion:!!a?.fashion,sceneId:a?.fashion?.getState?.()?.sceneId||null,stats:a?.fashion?.stats?.()||null,pearl:!!window.CasebookFashionPearl,director:!!window.CasebookPearlDirector,progress:window.CasebookPearlDirector?.progress||null,world:window.CasebookProV3?.getWorld?.()?.name||null};});
            console.log('STATE='+JSON.stringify(state));fs.writeFileSync(out+'/state.json',JSON.stringify({state,logs},null,2));
            assert.equal(state.shell,true);assert.equal(state.api,true);assert.equal(state.fashion,true);assert.equal(state.sceneId,'pearl-runway');assert.equal(state.pearl,true);assert.equal(state.director,true);
            await p.evaluate(()=>window.CasebookPearlDirector.destroy());
            await p.waitForTimeout(250);
            await p.screenshot({path:out+'/01-overview.png',timeout:15000,animations:'disabled'});
            for(const [name,v] of [['02-hero',.30],['03-craft',.60],['04-portal',.90]]){await p.evaluate(x=>{const a=document.querySelector('.stage iframe')?.contentWindow?.CasebookPro;a?.fashion?.setProgress?.(x)},v);await p.waitForTimeout(400);await p.screenshot({path:out+'/'+name+'.png',timeout:15000,animations:'disabled'});}
            const fatal=logs.filter(x=>/ReferenceError|TypeError|SyntaxError|Cannot set|not defined|not a function|Pearl Fashion:/i.test(x));assert.equal(fatal.length,0,'Fatal errors: '+fatal.join(' | '));await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-fashion-pearl-qa3
          path: qa-pearl/
          if-no-files-found: warn
      - name: Self-remove
        if: always()
        run: |
          rm -f .github/workflows/tmp-qa3-v3-fashion-pearl.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-qa3-v3-fashion-pearl.yml
          git commit -m 'chore(ci): remove temporary Pearl QA3' || true
          git push origin HEAD:feat/casebook-pro-v3-phase3-fashion-pearl-cinematic || true
