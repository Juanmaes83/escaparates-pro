name: Integrate Vinyl Player PRO V1

on:
  push:
    branches:
      - feat/vinyl-player-pro-v1

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct approved standalone and integrate module
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          expected = 'd181506e15d17aa9d20d016a0797882c36866822342f531f279d6c5c3e862cb5'
          source = ''.join(Path(f'tmp/vinyl-v1/part{i:02d}.b64').read_text().strip() for i in range(1,4))
          gz = base64.b64decode(source)
          html = gzip.decompress(gz)
          actual = hashlib.sha256(html).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA mismatch: {actual} != {expected}')

          module_dir = Path('labs/website-modules-source/vinyl-player-pro')
          module_dir.mkdir(parents=True, exist_ok=True)
          (module_dir / 'index.html').write_bytes(html)
          (module_dir / 'source.v1.html.gz').write_bytes(gz)

          ui_path = Path('js/website-modules-ui.js')
          ui = ui_path.read_text(encoding='utf-8')
          old = "            { id: 'rope-gallery-pro', src: 'js/website-modules-rope-gallery-pro.js' }\n        ];"
          new = "            { id: 'rope-gallery-pro', src: 'js/website-modules-rope-gallery-pro.js' },\n            { id: 'vinyl-player-pro', src: 'js/website-modules-vinyl-player-pro.js' }\n        ];"
          if ui.count(old) != 1:
              raise SystemExit('Website Modules loader anchor not found exactly once')
          ui_path.write_text(ui.replace(old, new), encoding='utf-8')

          root = Path('README.md')
          text = root.read_text(encoding='utf-8')
          replacements = [
              ('La version actual incluye 28 modulos premium.', 'La version actual incluye 29 modulos premium.'),
              ('- Rope Gallery PRO V1.5.\n', '- Rope Gallery PRO V1.5.\n- Vinyl Player PRO V1.\n'),
              ('**Rope Gallery PRO V1.5** vive en `labs/website-modules-source/rope-gallery-pro/` y conserva como fuente canonica el HTML V1.5 aprobado. El Lab lo abre como editor standalone aislado, sin reimplementar la fisica de cuerda. Incluye cuerda Three.js con pinzas, drag e inercia, ocho fichas personalizables con imagen/video, descripcion ampliada y CTA, Focus independiente del canvas, branding y fondo multimedia, persistencia IndexedDB y entregables HTML final, ZIP cliente, embed, preview, PNG, PNG sequence, MP4/WebM y grabacion de revision cliente.\n', '**Rope Gallery PRO V1.5** vive en `labs/website-modules-source/rope-gallery-pro/` y conserva como fuente canonica el HTML V1.5 aprobado. El Lab lo abre como editor standalone aislado, sin reimplementar la fisica de cuerda. Incluye cuerda Three.js con pinzas, drag e inercia, ocho fichas personalizables con imagen/video, descripcion ampliada y CTA, Focus independiente del canvas, branding y fondo multimedia, persistencia IndexedDB y entregables HTML final, ZIP cliente, embed, preview, PNG, PNG sequence, MP4/WebM y grabacion de revision cliente.\n\n**Vinyl Player PRO V1** vive en `labs/website-modules-source/vinyl-player-pro/` y conserva como fuente canonica el HTML V1 aprobado. El Lab lo abre como editor standalone aislado, sin reimplementar el tocadiscos Three.js ni su motor de audio. Incluye seis discos personalizables con portada imagen/video y audio propio, Custom Library para evitar sobrescritura por iTunes, controles mecanicos de brazo/plato/velocidad, branding, paleta, fondo multimedia, persistencia IndexedDB y entregables HTML final, ZIP cliente, embed, preview, PNG, PNG sequence, MP4/WebM y grabacion de revision cliente.\n'),
              ('- **Rope Gallery PRO V1.5** en Website Modules Lab: modulo standalone Three.js ubicado en `labs/website-modules-source/rope-gallery-pro/`, con cuerda fisica, ocho fichas imagen-video, Focus editorial sin recortes, branding y pipeline propio de entregables cerrados.\n', '- **Rope Gallery PRO V1.5** en Website Modules Lab: modulo standalone Three.js ubicado en `labs/website-modules-source/rope-gallery-pro/`, con cuerda fisica, ocho fichas imagen-video, Focus editorial sin recortes, branding y pipeline propio de entregables cerrados.\n- **Vinyl Player PRO V1** en Website Modules Lab: modulo standalone Three.js + Web Audio ubicado en `labs/website-modules-source/vinyl-player-pro/`, con seis discos imagen-video-audio, tocadiscos mecanico interactivo, Custom Library, branding y pipeline propio de entregables cerrados.\n')
          ]
          for old_text, new_text in replacements:
              if text.count(old_text) != 1:
                  raise SystemExit('README anchor not found exactly once: ' + old_text[:90])
              text = text.replace(old_text, new_text)
          root.write_text(text, encoding='utf-8')

          if hashlib.sha256((module_dir / 'index.html').read_bytes()).hexdigest() != expected:
              raise SystemExit('Final canonical HTML hash changed')
          PY

          node --check js/website-modules-vinyl-player-pro.js
          node --check js/website-modules-ui.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html = Path('labs/website-modules-source/vinyl-player-pro/index.html').read_text(encoding='utf-8')
          mods = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
          if len(mods) != 1:
              raise SystemExit(f'Expected 1 module script, found {len(mods)}')
          p = Path('/tmp/vinyl-player-pro-v1.mjs')
          p.write_text(mods[0], encoding='utf-8')
          subprocess.run(['node', '--check', str(p)], check=True)
          required = ['downloadHtmlBtn','downloadZipBtn','copyEmbedBtn','previewBtn','pngBtn','pngSequenceBtn','videoBtn','reviewBtn','sourceMode','indexedDB','albumsEditor']
          for token in required:
              if token not in html:
                  raise SystemExit('Required token missing: ' + token)
          PY

      - name: Commit verified integration only
        run: |
          rm -rf tmp/vinyl-v1
          rm -f .github/workflows/integrate-vinyl-player-pro-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md js/website-modules-ui.js labs/website-modules-source/vinyl-player-pro/index.html labs/website-modules-source/vinyl-player-pro/source.v1.html.gz
          git add -u tmp/vinyl-v1 .github/workflows/integrate-vinyl-player-pro-v1.yml
          git diff --cached --check
          git status --short
          git commit -m "feat(web-modules): integrate Vinyl Player PRO V1"
          git push origin HEAD:feat/vinyl-player-pro-v1
