name: Museum Phase4A schema surgical fix
on:
  push:
    branches: [chatgpt/museum-character-2027-integration-v1]
    paths: ['.github/workflows/museum-phase4a-types-surgical-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/museum-character-2027-integration-v1
          fetch-depth: 0
      - name: Restore exact pre-Phase4 schema then add one authority
        run: |
          git show 61857ea5a4e7be5ead84e0ad56a7361f70f9bc54:labs/immersive-worlds/engine/schema/types.js > /tmp/types.js
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/types.js')
          s=p.read_text()
          old="  EXPLORE: 'EXPLORE',\n  FOCUS: 'FOCUS',"
          new="  EXPLORE: 'EXPLORE',\n  THIRD_PERSON_EXPLORE: 'THIRD_PERSON_EXPLORE',\n  FOCUS: 'FOCUS',"
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          cp /tmp/types.js labs/immersive-worlds/engine/schema/types.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/immersive-worlds/engine/schema/types.js
          git commit -m 'fix(museum): preserve full schema while adding third-person authority'
          git push
