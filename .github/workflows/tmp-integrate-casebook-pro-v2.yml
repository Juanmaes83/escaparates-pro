name: TEMP Integrate Casebook PRO V2 exact source

on:
  push:
    branches:
      - feat/interactive-boards-casebook-pro-v2
    paths:
      - .github/workflows/tmp-integrate-casebook-pro-v2.yml

permissions:
  contents: write

jobs:
  copy-exact-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated V2 branch
        uses: actions/checkout@v4
        with:
          ref: feat/interactive-boards-casebook-pro-v2
          fetch-depth: 0

      - name: Download and verify canonical V2 standalone
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL='https://raw.githubusercontent.com/Juanmaes83/CASEBOOK-PRO-V2-Spatial-Storytelling-System/main/CASEBOOK_PRO_V2_SPATIAL_STORYTELLING_STANDALONE%20%282%29.html'
          EXPECTED_GIT_BLOB='abe3674c2bc29f0acdb4866c7a76a0714039a058'
          curl --fail --location --silent --show-error "$SOURCE_URL" --output /tmp/casebook-pro-v2.html
          ACTUAL_SIZE="$(wc -c < /tmp/casebook-pro-v2.html | tr -d ' ')"
          ACTUAL_BLOB="$(git hash-object /tmp/casebook-pro-v2.html)"
          ACTUAL_SHA256="$(sha256sum /tmp/casebook-pro-v2.html | awk '{print $1}')"
          echo "Canonical source: size=$ACTUAL_SIZE git_blob=$ACTUAL_BLOB sha256=$ACTUAL_SHA256"
          test "$ACTUAL_BLOB" = "$EXPECTED_GIT_BLOB"
          mkdir -p labs/interactive-boards-source/casebook-pro-v2
          cp /tmp/casebook-pro-v2.html labs/interactive-boards-source/casebook-pro-v2/index.html
          test "$(git hash-object labs/interactive-boards-source/casebook-pro-v2/index.html)" = "$EXPECTED_GIT_BLOB"
          echo "IDENTITY_CHECK_OK"

      - name: Commit exact HTML only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/interactive-boards-source/casebook-pro-v2/index.html
          if git diff --cached --quiet; then
            echo 'Canonical V2 HTML already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'feat(interactive-boards): add exact Casebook PRO V2 standalone'
          git push origin HEAD:feat/interactive-boards-casebook-pro-v2
