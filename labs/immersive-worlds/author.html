<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immersive Worlds — Autoría (capa fina V1)</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./app/ui/styles.css">
  <style>
    /*
     * Author Mode is a tool, not an experience. It deliberately looks like a
     * tool: a fixed panel, dense controls, no scenography. Keeping the two
     * surfaces visually distinct is part of keeping them architecturally
     * distinct (Constitution §5.6).
     */
    body { overflow: hidden; }
    .iw-au { position: fixed; inset: 0 auto 0 0; width: 22rem; max-width: 92vw; display: flex; flex-direction: column;
             background: #100f0e; border-right: 1px solid var(--iw-line); z-index: 20; }
    #iw-stage { left: 22rem; }
    #iw-canvas { cursor: grab; }
    #iw-canvas:active { cursor: grabbing; }
    .iw-au__head { display: flex; justify-content: space-between; align-items: flex-start; gap: .6rem;
                   padding: 1rem 1.1rem; border-bottom: 1px solid var(--iw-line); }
    .iw-au__head b { display: block; font: 500 .68rem/1 var(--iw-sans); letter-spacing: .24em; text-transform: uppercase; }
    .iw-au__head span { display: block; margin-top: .35rem; font-size: .7rem; color: var(--iw-ink-dim); }
    .iw-au__mode { font-size: .58rem !important; letter-spacing: .12em; border: 1px solid var(--iw-line); padding: .3rem .45rem; white-space: nowrap; }
    .iw-au__space { padding: .8rem 1.1rem; border-bottom: 1px solid var(--iw-line); }
    .iw-au__space label { display: block; font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; color: var(--iw-ink-dim); margin-bottom: .4rem; }
    .iw-au__tree { flex: 0 0 auto; max-height: 34vh; overflow: auto; padding: .4rem 0; border-bottom: 1px solid var(--iw-line); }
    .iw-au__tree details { padding: 0 1.1rem; }
    .iw-au__tree summary { cursor: pointer; list-style: none; padding: .45rem 0; font-size: .64rem; letter-spacing: .16em;
                           text-transform: uppercase; color: var(--iw-ink-dim); display: flex; justify-content: space-between; }
    .iw-au__tree summary::-webkit-details-marker { display: none; }
    .iw-au__tree summary i { font-style: normal; opacity: .6; }
    .iw-au__tree ul { list-style: none; margin: 0 0 .5rem; padding: 0; }
    .iw-au__tree li { padding: .34rem .5rem; font-size: .76rem; cursor: pointer; border-left: 2px solid transparent; color: #cdc7bc; }
    .iw-au__tree li:hover { background: rgba(240,236,228,.05); }
    .iw-au__tree li.is-selected { border-left-color: var(--iw-ink); background: rgba(240,236,228,.08); color: var(--iw-ink); }
    .iw-au__form { flex: 1; overflow: auto; padding: 1rem 1.1rem; }
    .iw-au__form h3 { margin: 0 0 .2rem; font: 400 1.02rem/1.3 var(--iw-serif); }
    .iw-au__id { margin: 0 0 1rem; font: 400 .62rem/1.4 ui-monospace, monospace; color: var(--iw-ink-dim); word-break: break-all; }
    .iw-au__row { margin-bottom: .7rem; }
    .iw-au__row label { display: block; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--iw-ink-dim); margin-bottom: .3rem; }
    .iw-au__row input[type=text], .iw-au__row input[type=number], .iw-au__row select, .iw-au__row textarea,
    .iw-au__space select {
      width: 100%; background: #0a0908; border: 1px solid var(--iw-line); color: var(--iw-ink);
      padding: .45rem .55rem; font: 400 .78rem/1.4 var(--iw-sans); border-radius: 2px;
    }
    .iw-au__row textarea { resize: vertical; }
    .iw-au__empty { font-size: .76rem; color: var(--iw-ink-dim); }
    .iw-au__foot { padding: .8rem 1.1rem 1rem; border-top: 1px solid var(--iw-line); display: flex; flex-wrap: wrap; gap: .4rem; }
    .iw-au__btn { flex: 1 1 auto; border: 1px solid var(--iw-line); background: transparent; color: var(--iw-ink);
                  padding: .5rem .6rem; font: 500 .64rem/1 var(--iw-sans); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
    .iw-au__btn--primary { background: rgba(240,236,228,.92); color: #14120f; border-color: transparent; }
    .iw-au__status { flex: 1 1 100%; margin: .5rem 0 0; font-size: .68rem; color: var(--iw-ink-dim); }
    .iw-au__status[data-ok="false"] { color: #d99b86; }
    @media (max-width: 820px) { .iw-au { position: static; width: 100%; height: 55vh; } #iw-stage { position: fixed; inset: 55vh 0 0 0; } }
  </style>
</head>
<body>
  <aside class="iw-au" id="iw-author"></aside>
  <main id="iw-stage">
    <canvas id="iw-canvas" aria-label="Vista de autoría: cámara orbital sobre la sala en edición."></canvas>
  </main>

  <script type="module">
    import { boot } from './app/author-app.js';
    boot().catch((error) => {
      console.error('[IW author] boot failed', error);
      document.getElementById('iw-author').innerHTML =
        `<div style="padding:1.2rem"><h1 style="font:400 1.1rem Georgia,serif">No se pudo abrir la autoría</h1>
         <pre style="font-size:.7rem;color:#a49d92;white-space:pre-wrap">${String(error?.message || error)}</pre></div>`;
    });
  </script>
</body>
</html>
