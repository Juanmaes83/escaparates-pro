<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0b0a">
  <title>Museum — Breeze Save / Re-entry / Route Gate</title>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js" } }
  </script>
  <link rel="stylesheet" href="./app/ui/styles.css">
  <link rel="stylesheet" href="./authoring/studio/visitor-phase1.css">
  <link rel="stylesheet" href="./authoring/studio/museum-phase2.css">
  <link rel="stylesheet" href="./authoring/studio/museum-phase2-hardening.css">
  <link rel="stylesheet" href="./authoring/studio/studio-validation-flow.css">
</head>
<body>
  <main id="iw-stage">
    <canvas id="iw-canvas" tabindex="0" aria-label="Vista tridimensional del Museo — gate de persistencia Breeze PRO V4.1."></canvas>
  </main>
  <div id="iw-ui"></div>

  <script type="module">
    const WORLD = './worlds/museum-v1.world.json';
    const BREEZE_SPACE = 'space.breeze';
    const url = new URL(location.href);
    url.searchParams.set('authoring', '1');
    url.searchParams.set('world', WORLD);
    history.replaceState(null, '', url);

    try {
      const [{ baseConfigFromWorld }] = await Promise.all([
        import('./authoring/experience-config.js')
      ]);
      const cleanWorld = await fetch(WORLD, { cache: 'no-store' }).then((response) => {
        if (!response.ok) throw new Error(`No se pudo cargar el mundo (${response.status})`);
        return response.json();
      });
      window.__IW_CONFIG = baseConfigFromWorld(cleanWorld);

      // Preserve all previously accepted Museum seams. Breeze remains the exact
      // approved V4.1 runtime; only a passive GET/APPLY state contract is added.
      await import('./authoring/museum-visible-media.js');
      await import('./authoring/museum-video-entity-media.js');
      await import('./authoring/museum-canonical-media-binding.js');
      await import('./authoring/studio/studio-validation-flow.js');
      await import('./authoring/studio/studio-validation-hardening.js');
      await import('./authoring/studio/gallery-b-closeout-validation.js');
      await import('./authoring/studio/breeze-persistence-adapter.js');

      const [app, visitor, phase2, layoutFix, hardening, { EVENTS }] = await Promise.all([
        import('./app/experience-app.js'),
        import('./authoring/studio/visitor-phase1.js'),
        import('./authoring/studio/museum-phase2.js'),
        import('./authoring/studio/museum-phase2-layout-fix.js'),
        import('./authoring/studio/museum-phase2-hardening.js'),
        import('./engine/core/event-bus.js')
      ]);

      const runtime = await app.boot();
      visitor.installVisitorPhase1();
      phase2.installMuseumPhase2();
      layoutFix.installMuseumPhase2LayoutFix();
      hardening.installMuseumPhase2Hardening();

      try {
        const [{ installWetPaintMuseumLifecycle }, { installWetPaintStudioControls }] = await Promise.all([
          import('./experiences/wet-paint-museum-lifecycle.js'),
          import('./authoring/studio/wet-paint-studio-controls.js')
        ]);
        if (runtime) {
          await new Promise((resolve) => requestAnimationFrame(resolve));
          window.__IW_WET_PAINT_HOST = installWetPaintMuseumLifecycle(runtime);
          installWetPaintStudioControls();
        }
      } catch (wetPaintError) {
        console.error('[Museum Breeze Persistence] Wet Paint preservation failed (non-fatal)', wetPaintError);
      }

      const snapshot = (reason = 'SNAPSHOT') => {
        const nested = window.__IW?.nested;
        const report = nested?.report?.() || null;
        window.__IW_BREEZE_GATE = {
          phase: 'SAVE_REENTRY_ROUTE',
          status: String(report?.guest?.backend || '').includes('breeze') ? 'BREEZE_ACTIVE' : (report?.presentation || 'MUSEUM'),
          reason,
          activeSpaceId: runtime?.state?.activeSpaceId || runtime?.spaces?.activeSpaceId || null,
          nested: report,
          donorCommit: 'c86cd3e20d6f981c75f1e39d395c794ad104d802',
          stateBridgeInstalled: true,
          persistence: window.__IW_BREEZE_PERSISTENCE || null,
          at: new Date().toISOString()
        };
        return window.__IW_BREEZE_GATE;
      };

      runtime?.bus?.on(EVENTS.SPACE_ENTERED, ({ spaceId }) => {
        requestAnimationFrame(() => snapshot(spaceId === BREEZE_SPACE ? 'BREEZE_ENTERED' : 'SPACE_ENTERED'));
      });
      runtime?.bus?.on(EVENTS.SPACE_LEFT, ({ spaceId }) => {
        requestAnimationFrame(() => snapshot(spaceId === BREEZE_SPACE ? 'BREEZE_LEFT' : 'SPACE_LEFT'));
      });
      window.setInterval(() => {
        if (runtime?.state?.activeSpaceId === BREEZE_SPACE || window.__IW?.nested?.isPresenting) snapshot('BREEZE_LIVE');
      }, 1000);
      snapshot('READY');

      console.log('[Museum Breeze Persistence] V4.1 controls intact; Museum SAVE / re-entry / route state seam enabled');
    } catch (error) {
      console.error('[Museum Breeze Persistence] boot failed', error);
      document.documentElement.dataset.iwError = String(error?.message || error);
      document.getElementById('iw-ui').innerHTML = `
        <div style="position:absolute;inset:0;display:grid;place-items:center;padding:2rem;background:#0a0908;color:#ddd">
          <div style="max-width:44rem"><h1>No se pudo iniciar Breeze Persistence Gate</h1><pre style="white-space:pre-wrap">${String(error?.message || error)}</pre></div>
        </div>`;
    }
  </script>
</body>
</html>
