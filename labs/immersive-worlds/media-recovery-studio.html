<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0b0a">
  <title>Museum — Durable Media Studio</title>
  <link rel="stylesheet" href="./app/ui/styles.css">
  <link rel="stylesheet" href="./authoring/studio/visitor-phase1.css">
  <link rel="stylesheet" href="./authoring/studio/museum-phase2.css">
  <link rel="stylesheet" href="./authoring/studio/museum-phase2-hardening.css">
  <link rel="stylesheet" href="./authoring/studio/studio-validation-flow.css">
</head>
<body>
  <main id="iw-stage">
    <canvas id="iw-canvas" tabindex="0" aria-label="Vista tridimensional del Museo con persistencia durable de medios."></canvas>
  </main>
  <div id="iw-ui"></div>

  <script type="module">
    const WORLD = './worlds/museum-v1.world.json';
    const url = new URL(location.href);
    url.searchParams.set('authoring', '1');
    url.searchParams.set('world', WORLD);
    history.replaceState(null, '', url);

    try {
      // Install durable MediaVault behaviour before creating the shared vault.
      const persistence = await import('./authoring/project-media-persistence.js');
      const [{ baseConfigFromWorld }, { ConfigStore }, { MediaVault }] = await Promise.all([
        import('./authoring/experience-config.js'),
        import('./authoring/config-store.js'),
        import('./authoring/media-vault.js')
      ]);

      const cleanWorld = await fetch(WORLD, { cache: 'no-store' }).then((response) => {
        if (!response.ok) throw new Error(`No se pudo cargar el mundo (${response.status})`);
        return response.json();
      });

      // LEVEL 3: bytes are rehydrated before applyConfigToWorld asks the vault to
      // resolve `authored:<id>`. ConfigStore becomes the project truth after it
      // has passed the schema normaliser; a base config is only the first run.
      const vault = window.__IW_VAULT || (window.__IW_VAULT = new MediaVault());
      const restoredAssets = await persistence.hydrateProjectVault(vault);
      const savedConfig = ConfigStore.load();
      window.__IW_CONFIG = savedConfig || baseConfigFromWorld(cleanWorld);

      // Human-PASS live surfaces.
      await import('./authoring/museum-visible-media.js');
      await import('./authoring/museum-video-entity-media.js');

      // Evidence-driven workflow + Gallery B hardening.
      await import('./authoring/studio/studio-validation-flow.js');
      await import('./authoring/studio/studio-validation-hardening.js');

      // LEVEL 2/3: every Runtime generation restores media bindings when rooms
      // are rebuilt, and Save/Validate only go green after durable evidence.
      await import('./authoring/project-runtime-persistence.js');
      await import('./authoring/studio/studio-durable-validation.js');

      const [app, visitor, phase2, layoutFix, hardening] = await Promise.all([
        import('./app/experience-app.js'),
        import('./authoring/studio/visitor-phase1.js'),
        import('./authoring/studio/museum-phase2.js'),
        import('./authoring/studio/museum-phase2-layout-fix.js'),
        import('./authoring/studio/museum-phase2-hardening.js')
      ]);

      await app.boot();
      visitor.installVisitorPhase1();
      phase2.installMuseumPhase2();
      layoutFix.installMuseumPhase2LayoutFix();
      hardening.installMuseumPhase2Hardening();

      window.__IW_DURABLE_BOOT = {
        restoredAssets,
        hadSavedConfig: Boolean(savedConfig),
        at: new Date().toISOString()
      };
      console.log(`[Museum Durable Media] ready · ${restoredAssets} assets restored`);
    } catch (error) {
      console.error('[Museum Durable Media] boot failed', error);
      document.documentElement.dataset.iwError = String(error?.message || error);
      document.getElementById('iw-ui').innerHTML = `
        <div style="position:absolute;inset:0;display:grid;place-items:center;padding:2rem;background:#0a0908;color:#ddd">
          <div style="max-width:44rem"><h1>No se pudo iniciar Durable Media Studio</h1><pre style="white-space:pre-wrap">${String(error?.message || error)}</pre></div>
        </div>`;
    }
  </script>
</body>
</html>
