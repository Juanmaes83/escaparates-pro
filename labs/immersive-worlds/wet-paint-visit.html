<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0b0a">
  <title>Museum — Exposición Itinerante · Wet Paint</title>
  <link rel="stylesheet" href="./app/ui/styles.css">
  <link rel="stylesheet" href="./authoring/studio/visitor-phase1.css">
  <link rel="stylesheet" href="./authoring/studio/museum-phase2.css">
  <link rel="stylesheet" href="./authoring/studio/museum-phase2-hardening.css">
</head>
<body>
  <main id="iw-stage">
    <canvas id="iw-canvas" tabindex="0" aria-label="Vista tridimensional de la Sala de Exposición Itinerante — Wet Paint."></canvas>
  </main>
  <div id="iw-ui"></div>

  <script type="module">
    const WORLD = './worlds/itinerant-wet-paint-lab.world.json';
    const SCOPE = 'world.itinerant-wet-paint';

    const here = new URL(location.href);
    here.searchParams.delete('authoring');
    here.searchParams.set('world', WORLD);
    history.replaceState(null, '', here);

    try {
      const [{ ConfigStore }, { MediaVault }] = await Promise.all([
        import('./authoring/config-store.js'),
        import('./authoring/media-vault.js')
      ]);

      ConfigStore.setScope(SCOPE);
      const savedConfig = ConfigStore.load();
      const vault = new MediaVault({ scope: SCOPE });
      if (savedConfig) await vault.hydrateConfig(savedConfig);
      window.__IW_VAULT = vault;
      if (savedConfig) window.__IW_CONFIG = savedConfig;

      const [app, visitor, phase2, layoutFix, hardening] = await Promise.all([
        import('./app/experience-app.js'),
        import('./authoring/studio/visitor-phase1.js'),
        import('./authoring/studio/museum-phase2.js'),
        import('./authoring/studio/museum-phase2-layout-fix.js'),
        import('./authoring/studio/museum-phase2-hardening.js')
      ]);

      await app.boot();
      visitor.installVisitorPhase1();
      phase2.installMuseumPhase2();
      layoutFix.installMuseumPhase2LayoutFix();
      hardening.installMuseumPhase2Hardening();
    } catch (error) {
      console.error('[Wet Paint Visitor] boot failed', error);
      document.documentElement.dataset.iwError = String(error?.message || error);
      document.getElementById('iw-ui').innerHTML = `
        <div style="position:absolute;inset:0;display:grid;place-items:center;padding:2rem;background:#0a0908;color:#ddd">
          <div><h1>No se pudo iniciar la exposición</h1><pre>${String(error?.message || error)}</pre></div>
        </div>`;
    }
  </script>
</body>
</html>
