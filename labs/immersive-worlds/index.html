<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Immersive Worlds — Fundación Arenas (prototipo aislado IW-1)</title>
  <meta name="theme-color" content="#0c0b0a">
  <meta name="robots" content="noindex">
  <meta name="description" content="Prototipo aislado del módulo Immersive Worlds de Escaparates Pro. Mundo, obras e institución ficticios.">
  <link rel="stylesheet" href="./app/ui/styles.css">
  <link rel="stylesheet" href="./authoring/studio/visitor-phase1.css">
  <link rel="stylesheet" href="./authoring/studio/museum-phase2.css">
  <link rel="stylesheet" href="./authoring/studio/museum-phase2-hardening.css">
</head>
<body>
  <main id="iw-stage">
    <canvas id="iw-canvas" tabindex="0" aria-label="Vista tridimensional de la sala. El contenido completo está disponible en texto desde el botón «Contenido en texto»."></canvas>
  </main>
  <div id="iw-ui"></div>

  <noscript>
    <p style="padding:2rem;font-family:Georgia,serif">
      Este prototipo necesita JavaScript y WebGL. El contenido de la colección está descrito en
      <code>worlds/museum-v1.world.json</code>.
    </p>
  </noscript>

  <script type="module">
    import { boot } from './app/experience-app.js';
    import { installVisitorPhase1 } from './authoring/studio/visitor-phase1.js';
    import { installMuseumPhase2 } from './authoring/studio/museum-phase2.js';
    import { installMuseumPhase2LayoutFix } from './authoring/studio/museum-phase2-layout-fix.js';
    import { installMuseumPhase2Hardening } from './authoring/studio/museum-phase2-hardening.js';

    document.addEventListener('change', (event) => {
      if (!event.target?.matches?.('[data-p1-dim], [data-p1-entity-a11y]')) return;
      requestAnimationFrame(() => window.__IW_STUDIO?.render?.());
    });

    boot().then(async () => {
      installVisitorPhase1();
      installMuseumPhase2();
      installMuseumPhase2LayoutFix();
      installMuseumPhase2Hardening();

      // — Wet Paint como capacidad nativa del Museo (Sala 4 — Exposición Itinerante) —
      // El donante (wet-paint-flow @ 0b9ba9a) funciona como motor OCULTO; sus controles
      // se presentan de forma nativa dentro del editor de Studio de las obras de la Sala 4
      // (acordeón, español, piel Museum). Sin overlay, sin salir del panel. Las galerías
      // clásicas (A/B) no muestran Wet Paint: el panel se limita a las obras itinerantes.
      try {
        const { installWetPaint } = await import('./experiences/wet-paint-adapter.js');
        const { installWetPaintStudioControls } = await import('./authoring/studio/wet-paint-studio-controls.js');
        const runtime = window.__IW?.runtime;
        if (runtime) {
          await new Promise((resolve) => requestAnimationFrame(resolve));
          const result = installWetPaint(runtime);
          installWetPaintStudioControls();
          if (result) {
            console.log('[Wet Paint] Motor + controles nativos de Studio instalados (Sala 4)');
          } else {
            console.warn('[Wet Paint] Motor diferido — runtime no listo');
          }
        }
      } catch (bridgeError) {
        console.error('[Wet Paint] Instalación fallida (no crítica):', bridgeError);
      }
    }).catch((error) => {
      console.error('[IW] boot failed', error);
      document.documentElement.dataset.iwError = String(error?.message || error);
      const ui = document.getElementById('iw-ui');
      ui.innerHTML = `
        <div style="position:absolute;inset:0;display:grid;place-items:center;padding:2rem;background:#0a0908">
          <div style="max-width:34rem">
            <p style="font:400 .7rem/1 'Helvetica Neue',sans-serif;letter-spacing:.4em;text-transform:uppercase;color:#a49d92">Fundación Arenas</p>
            <h1 style="font:400 1.4rem/1.3 Georgia,serif;margin:1.4rem 0">No se pudo iniciar la sala</h1>
            <p style="font:400 .86rem/1.7 'Helvetica Neue',sans-serif;color:#cfc9be">
              Este prototipo requiere WebGL2. Todo el contenido de la exposición está disponible como texto en
              <code>worlds/museum-v1.world.json</code>.
            </p>
            <pre style="margin-top:1.4rem;padding:1rem;border:1px solid rgba(240,236,228,.16);font-size:.74rem;color:#a49d92;white-space:pre-wrap">${String(error?.message || error)}</pre>
          </div>
        </div>`;
    });
  </script>
</body>
</html>
